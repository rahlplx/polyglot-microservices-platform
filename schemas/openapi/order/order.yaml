openapi: 3.1.0
info:
  title: Order Service
  description: >
    Manages the complete order lifecycle and saga orchestration.
    Handles order creation, status tracking, completion, and cancellation
    with compensating transactions via the saga pattern.
  version: 1.0.0
  contact:
    name: Platform Team

servers:
  - url: https://order.internal.example.com/v1
    description: Internal gRPC-Gateway endpoint

paths:
  /orders:
    post:
      operationId: createOrder
      summary: Create a new order
      tags: [Orders]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '200':
          description: Created order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateOrderResponse'
        '400':
          description: Invalid order data

    get:
      operationId: listOrders
      summary: List orders with filtering and pagination
      tags: [Orders]
      parameters:
        - name: customer_id
          in: query
          schema:
            type: string
        - name: status_filter
          in: query
          schema:
            $ref: '#/components/schemas/OrderStatus'
        - name: cursor
          in: query
          schema:
            type: string
        - name: page_size
          in: query
          schema:
            type: integer
            format: int32
        - name: sort_field
          in: query
          schema:
            type: string
        - name: sort_order
          in: query
          schema:
            type: string
            enum: [asc, desc]
      responses:
        '200':
          description: List of orders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListOrdersResponse'

  /orders/{orderId}:
    get:
      operationId: getOrder
      summary: Get order by ID
      tags: [Orders]
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Order details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetOrderResponse'
        '404':
          description: Order not found

  /orders/{orderId}/complete:
    post:
      operationId: completeOrder
      summary: Complete a fulfilled order
      tags: [Orders]
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Completed order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompleteOrderResponse'

  /orders/{orderId}/cancel:
    post:
      operationId: cancelOrder
      summary: Cancel an order (triggers saga compensation)
      tags: [Orders]
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelOrderRequest'
      responses:
        '200':
          description: Cancellation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelOrderResponse'

  /orders/{orderId}/status:
    get:
      operationId: getOrderStatus
      summary: Get order status and saga state
      tags: [Orders]
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Order status with saga details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetOrderStatusResponse'

components:
  schemas:
    Money:
      type: object
      description: Monetary value with currency (common.v1.Money)
      required: [currency_code, units, nanos]
      properties:
        currency_code:
          type: string
          minLength: 3
          maxLength: 3
        units:
          type: integer
          format: int64
        nanos:
          type: integer
          format: int32

    PaginationRequest:
      type: object
      description: Pagination request (common.v1.PaginationRequest)
      properties:
        cursor:
          type: string
        page_size:
          type: integer
          format: int32

    PaginationResponse:
      type: object
      description: Pagination response (common.v1.PaginationResponse)
      properties:
        next_cursor:
          type: string
        total_count:
          type: integer
          format: int64
        has_more:
          type: boolean

    TimeRange:
      type: object
      description: Time range for queries (common.v1.TimeRange)
      properties:
        start_time:
          type: string
          format: date-time
        end_time:
          type: string
          format: date-time

    Address:
      type: object
      description: Physical or digital address (common.v1.Address)
      properties:
        street_line_1:
          type: string
        street_line_2:
          type: string
        city:
          type: string
        state_province:
          type: string
        postal_code:
          type: string
        country_code:
          type: string

    OrderStatus:
      type: string
      enum:
        - ORDER_STATUS_UNSPECIFIED
        - ORDER_STATUS_PENDING
        - ORDER_STATUS_RESERVED
        - ORDER_STATUS_PAID
        - ORDER_STATUS_FULFILLING
        - ORDER_STATUS_COMPLETED
        - ORDER_STATUS_CANCELLED
        - ORDER_STATUS_FAILED
        - ORDER_STATUS_COMPENSATING

    OrderLine:
      type: object
      properties:
        product_id:
          type: string
        product_name:
          type: string
        quantity:
          type: integer
          format: int32
        unit_price:
          $ref: '#/components/schemas/Money'
        line_total:
          $ref: '#/components/schemas/Money'

    Order:
      type: object
      properties:
        order_id:
          type: string
        customer_id:
          type: string
        lines:
          type: array
          items:
            $ref: '#/components/schemas/OrderLine'
        total:
          $ref: '#/components/schemas/Money'
        status:
          $ref: '#/components/schemas/OrderStatus'
        payment_id:
          type: string
        shipping_address_id:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time

    OrderLineRequest:
      type: object
      required: [product_id, quantity]
      properties:
        product_id:
          type: string
        quantity:
          type: integer
          format: int32

    CreateOrderRequest:
      type: object
      required: [customer_id, lines]
      properties:
        customer_id:
          type: string
        lines:
          type: array
          items:
            $ref: '#/components/schemas/OrderLineRequest'
        shipping_address:
          $ref: '#/components/schemas/Address'

    CreateOrderResponse:
      type: object
      properties:
        order:
          $ref: '#/components/schemas/Order'

    GetOrderResponse:
      type: object
      properties:
        order:
          $ref: '#/components/schemas/Order'

    ListOrdersResponse:
      type: object
      properties:
        orders:
          type: array
          items:
            $ref: '#/components/schemas/Order'
        pagination:
          $ref: '#/components/schemas/PaginationResponse'

    CompleteOrderResponse:
      type: object
      properties:
        order:
          $ref: '#/components/schemas/Order'

    CancelOrderRequest:
      type: object
      properties:
        reason:
          type: string

    CancelOrderResponse:
      type: object
      properties:
        order:
          $ref: '#/components/schemas/Order'
        compensation_initiated:
          type: boolean

    GetOrderStatusResponse:
      type: object
      properties:
        order_id:
          type: string
        status:
          $ref: '#/components/schemas/OrderStatus'
        current_saga_step:
          type: string
        completed_steps:
          type: array
          items:
            type: string
        remaining_steps:
          type: array
          items:
            type: string
        compensation_steps:
          type: array
          items:
            type: string
