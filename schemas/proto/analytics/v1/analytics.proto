syntax = "proto3";

package analytics.v1;

option go_package = "github.com/comprehensive-architecture/services/gen/go/analytics/v1";

import "common/v1/types.proto";
import "google/protobuf/timestamp.proto";

// Analytics service provides business intelligence, reporting, and ML-driven insights
service AnalyticsService {
  // Get a pre-built or custom report
  rpc GetReport(GetReportRequest) returns (GetReportResponse);
  // Query aggregated metrics
  rpc QueryMetrics(QueryMetricsRequest) returns (QueryMetricsResponse);
  // Get real-time dashboard data
  rpc GetDashboard(GetDashboardRequest) returns (GetDashboardResponse);
}

message GetReportRequest {
  string report_type = 1; // "sales_summary", "order_funnel", "payment_reconciliation"
  common.v1.TimeRange time_range = 2;
  map<string, string> parameters = 3; // Report-specific parameters
  string output_format = 4; // "json", "csv", "pdf"
}

message GetReportResponse {
  string report_id = 1;
  string report_type = 2;
  common.v1.TimeRange time_range = 3;
  bytes data = 4; // Report content in requested format
  string content_type = 5;
  google.protobuf.Timestamp generated_at = 6;
}

message QueryMetricsRequest {
  repeated string metric_names = 1; // e.g., "order.count", "revenue.total", "latency.p99"
  common.v1.TimeRange time_range = 2;
  string granularity = 3; // "minute", "hour", "day"
  map<string, string> filters = 4; // Service, endpoint, status filters
  repeated string group_by = 5; // Grouping dimensions
}

message QueryMetricsResponse {
  repeated MetricSeries series = 1;
}

message MetricSeries {
  string metric_name = 1;
  repeated MetricDataPoint data_points = 2;
  map<string, string> labels = 3;
}

message MetricDataPoint {
  google.protobuf.Timestamp timestamp = 1;
  double value = 2;
}

message GetDashboardRequest {
  string dashboard_id = 1;
  common.v1.TimeRange time_range = 2;
  bool auto_refresh = 3;
}

message GetDashboardResponse {
  string dashboard_id = 1;
  repeated DashboardPanel panels = 2;
  google.protobuf.Timestamp last_updated = 3;
}

message DashboardPanel {
  string panel_id = 1;
  string title = 2;
  string panel_type = 3; // "line_chart", "bar_chart", "stat", "table"
  repeated MetricSeries data = 4;
  map<string, string> config = 5; // Panel-specific configuration
}
