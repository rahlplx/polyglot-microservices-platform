syntax = "proto3";

package order.v1;

option go_package = "github.com/comprehensive-architecture/services/gen/go/order/v1";

import "google/protobuf/timestamp.proto";
import "common/v1/events.proto";

// Saga orchestration events for the Order service's transactional outbox
service SagaService {
  // Get the current state of a saga instance
  rpc GetSagaState(GetSagaStateRequest) returns (GetSagaStateResponse);
  // Retry a failed saga step
  rpc RetrySagaStep(RetrySagaStepRequest) returns (RetrySagaStepResponse);
}

// Saga state entity
message SagaInstance {
  string saga_id = 1;
  string order_id = 2;
  SagaStatus status = 3;
  repeated SagaStep steps = 4;
  google.protobuf.Timestamp started_at = 5;
  google.protobuf.Timestamp completed_at = 6;
}

enum SagaStatus {
  SAGA_STATUS_UNSPECIFIED = 0;
  SAGA_STATUS_RUNNING = 1;
  SAGA_STATUS_COMPLETED = 2;
  SAGA_STATUS_COMPENSATING = 3;
  SAGA_STATUS_FAILED = 4;
}

message SagaStep {
  string step_name = 1;
  SagaStepStatus status = 2;
  google.protobuf.Timestamp started_at = 3;
  google.protobuf.Timestamp completed_at = 4;
  string error_message = 5;
  int32 retry_count = 6;
}

enum SagaStepStatus {
  SAGA_STEP_STATUS_UNSPECIFIED = 0;
  SAGA_STEP_STATUS_PENDING = 1;
  SAGA_STEP_STATUS_RUNNING = 2;
  SAGA_STEP_STATUS_COMPLETED = 3;
  SAGA_STEP_STATUS_FAILED = 4;
  SAGA_STEP_STATUS_COMPENSATING = 5;
  SAGA_STEP_STATUS_COMPENSATED = 6;
}

// Order created event (written to outbox)
message OrderCreatedEvent {
  string order_id = 1;
  string customer_id = 2;
  repeated string product_ids = 3;
  common.v1.EventType event_type = 4; // EVENT_TYPE_ORDER_CREATED
}

// Order completed event
message OrderCompletedEvent {
  string order_id = 1;
  common.v1.EventType event_type = 2; // EVENT_TYPE_ORDER_COMPLETED
}

// Order cancelled event (triggers compensation)
message OrderCancelledEvent {
  string order_id = 1;
  string reason = 2;
  common.v1.EventType event_type = 3; // EVENT_TYPE_ORDER_CANCELLED
}

message GetSagaStateRequest {
  string saga_id = 1;
}

message GetSagaStateResponse {
  SagaInstance saga = 1;
}

message RetrySagaStepRequest {
  string saga_id = 1;
  string step_name = 2;
}

message RetrySagaStepResponse {
  bool retry_initiated = 1;
  int32 retry_count = 2;
}
