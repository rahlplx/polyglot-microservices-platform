syntax = "proto3";

package order.v1;

option go_package = "github.com/rahlplx/polyglot-microservices-platform/gen/go/order/v1";

import "common/v1/types.proto";
import "google/protobuf/timestamp.proto";

// Order service manages the complete order lifecycle and saga orchestration
service OrderService {
  // Create a new order
  rpc CreateOrder(CreateOrderRequest) returns (CreateOrderResponse);
  // Get order by ID
  rpc GetOrder(GetOrderRequest) returns (GetOrderResponse);
  // List orders with filtering and pagination
  rpc ListOrders(ListOrdersRequest) returns (ListOrdersResponse);
  // Complete a fulfilled order
  rpc CompleteOrder(CompleteOrderRequest) returns (CompleteOrderResponse);
  // Cancel an order (triggers saga compensation)
  rpc CancelOrder(CancelOrderRequest) returns (CancelOrderResponse);
  // Get order status and saga state
  rpc GetOrderStatus(GetOrderStatusRequest) returns (GetOrderStatusResponse);
}

// Order entity
message Order {
  string order_id = 1;
  string customer_id = 2;
  repeated OrderLine lines = 3;
  common.v1.Money total = 4;
  OrderStatus status = 5;
  string payment_id = 6;
  string shipping_address_id = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  google.protobuf.Timestamp completed_at = 10;
}

// Single line item in an order
message OrderLine {
  string product_id = 1;
  string product_name = 2;
  int32 quantity = 3;
  common.v1.Money unit_price = 4;
  common.v1.Money line_total = 5;
}

enum OrderStatus {
  ORDER_STATUS_UNSPECIFIED = 0;
  ORDER_STATUS_PENDING = 1;
  ORDER_STATUS_RESERVED = 2;
  ORDER_STATUS_PAID = 3;
  ORDER_STATUS_FULFILLING = 4;
  ORDER_STATUS_COMPLETED = 5;
  ORDER_STATUS_CANCELLED = 6;
  ORDER_STATUS_FAILED = 7;
  ORDER_STATUS_COMPENSATING = 8;
}

message CreateOrderRequest {
  string customer_id = 1;
  repeated OrderLineRequest lines = 2;
  common.v1.Address shipping_address = 3;
}

message OrderLineRequest {
  string product_id = 1;
  int32 quantity = 2;
}

message CreateOrderResponse {
  Order order = 1;
}

message GetOrderRequest {
  string order_id = 1;
}

message GetOrderResponse {
  Order order = 1;
}

message ListOrdersRequest {
  string customer_id = 1;
  OrderStatus status_filter = 2;
  common.v1.PaginationRequest pagination = 3;
  common.v1.TimeRange time_range = 4;
  string sort_field = 5;
  string sort_order = 6;
}

message ListOrdersResponse {
  repeated Order orders = 1;
  common.v1.PaginationResponse pagination = 2;
}

message CompleteOrderRequest {
  string order_id = 1;
}

message CompleteOrderResponse {
  Order order = 1;
}

message CancelOrderRequest {
  string order_id = 1;
  string reason = 2;
}

message CancelOrderResponse {
  Order order = 1;
  // Whether saga compensation was triggered
  bool compensation_initiated = 2;
}

message GetOrderStatusRequest {
  string order_id = 1;
}

message GetOrderStatusResponse {
  string order_id = 1;
  OrderStatus status = 2;
  // Current saga step (if saga is active)
  string current_saga_step = 3;
  // Steps completed in the saga
  repeated string completed_steps = 4;
  // Steps remaining in the saga
  repeated string remaining_steps = 5;
  // Any compensation steps that were executed
  repeated string compensation_steps = 6;
}
