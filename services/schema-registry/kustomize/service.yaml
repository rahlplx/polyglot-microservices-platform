apiVersion: v1
kind: Service
metadata:
  name: schema-registry
  labels:
    app.kubernetes.io/name: schema-registry
    app.kubernetes.io/component: schema-registry
    app.kubernetes.io/part-of: polyglot-microservices
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: schema-registry
  ports:
    - name: grpc
      port: 50058
      targetPort: grpc
      protocol: TCP
    - name: http
      port: 8089
      targetPort: http
      protocol: TCP
