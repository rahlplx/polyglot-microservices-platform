[package]
name = "identity-service"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "SPIFFE/SPIRE workload attestation, SVID lifecycle, and mTLS certificate rotation service"
license = "Apache-2.0"
publish = false

[dependencies]
# Domain layer: ZERO external dependencies (only std)
# All dependencies below are for adapters and infrastructure layers only

# gRPC
tonic = "0.12"
prost = "0.13"
prost-types = "0.13"

# Async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# Crypto (memory-safe, zero-cost abstractions)
ring = "0.17"

# TLS (no OpenSSL dependency)
rustls = "0.23"
webpki = "0.22"
webpki-roots = "0.26"

# Certificate handling
x509-parser = "0.16"
der = "0.7"
pem = "3"

# Database (async, compile-time checked queries)
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "uuid", "json"] }

# Observability
opentelemetry = "0.24"
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.17", features = ["tonic", "metrics"] }
opentelemetry-semantic-conventions = "0.16"
tracing = "0.1"
tracing-opentelemetry = "0.25"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "registry"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Configuration
dotenvy = "0.15"

# Time
chrono = { version = "0.4", features = ["serde"] }

# UUID
uuid = { version = "1", features = ["v4", "serde"] }

# Hex encoding
hex = "0.4"

# Base64 encoding
base64 = "0.22"

# Error handling
thiserror = "1"
anyhow = "1"

[build-dependencies]
tonic-build = "0.12"

[dev-dependencies]
# Property-based testing
proptest = "1"

# Async testing
tokio-test = "0.4"

# Mocking
mockall = "0.13"

# Assertion helpers
assert_matches = "1"

[lib]
name = "identity_service"
path = "src/lib.rs"

[[bin]]
name = "identity-service"
path = "src/main.rs"

[[test]]
name = "attestation_test"
path = "tests/unit/attestation_test.rs"

[[test]]
name = "identity_contract_test"
path = "tests/contract/identity_test.rs"

[[test]]
name = "svid_property_test"
path = "tests/property/svid_property_test.rs"

[profile.release]
opt-level = "z"     # Optimize for size
lto = true          # Enable Link-Time Optimization
codegen-units = 1   # Better optimization, slower compile
strip = true        # Strip debug symbols
panic = "abort"     # Smaller binary, no unwinding

[profile.dev]
opt-level = 0
debug = true
