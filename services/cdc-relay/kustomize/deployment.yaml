apiVersion: apps/v1
kind: Deployment
metadata:
  name: cdc-relay
  namespace: production
  labels:
    app.kubernetes.io/name: cdc-relay
    app.kubernetes.io/component: cdc
    app.kubernetes.io/part-of: polyglot-microservices
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cdc-relay
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cdc-relay
        spiffe.io/inject: "true"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      serviceAccountName: cdc-relay
      securityContext:
        runAsNonRoot: true
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cdc-relay
          image: cdc-relay:dev
          ports:
            - containerPort: 9090
              name: http
            - containerPort: 50060
              name: grpc
          env:
            - name: DEBEZIUM_CONNECTOR_NAME
              value: "polyglot-cdc"
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka.production.svc.cluster.local:9092"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
