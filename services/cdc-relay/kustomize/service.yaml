apiVersion: v1
kind: Service
metadata:
  name: cdc-relay
  namespace: production
  labels:
    app.kubernetes.io/name: cdc-relay
    app.kubernetes.io/component: cdc
    app.kubernetes.io/part-of: polyglot-microservices
spec:
  selector:
    app.kubernetes.io/name: cdc-relay
  ports:
    - name: http
      port: 80
      targetPort: http
    - name: grpc
      port: 50060
      targetPort: grpc
