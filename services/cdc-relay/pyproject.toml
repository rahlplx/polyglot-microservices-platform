[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cdc-relay"
version = "0.1.0"
description = "CDC Relay — Transactional Outbox via Debezium"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
