apiVersion: v1
kind: Service
metadata:
  name: order
  labels:
    app.kubernetes.io/name: order
    app.kubernetes.io/component: order
    app.kubernetes.io/part-of: polyglot-microservices
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: order
  ports:
    - name: grpc
      port: 50054
      targetPort: grpc
      protocol: TCP
    - name: http
      port: 8084
      targetPort: http
      protocol: TCP
