// Proto file for the Gateway service API.
// This is the source of truth for the Gateway gRPC contract.
// Code generation is managed by Buf (buf generate).

syntax = "proto3";

package gateway.v1;

option go_package = "github.com/comprehensive-architecture/services/gateway/api/proto/gateway/v1;gatewayv1";

// GatewayService provides routing, health checking, rate limiting,
// and route configuration for the API Gateway.
service GatewayService {
  // Route forwards an incoming request to the appropriate upstream service.
  rpc Route(RouteRequest) returns (RouteResponse);

  // HealthCheck returns the health status of the gateway and its downstream dependencies.
  rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse);

  // GetRateLimit queries the current rate limit status for a client and route.
  rpc GetRateLimit(RateLimitRequest) returns (RateLimitResponse);

  // GetRouteConfig returns the current routing configuration for a service.
  rpc GetRouteConfig(RouteConfigRequest) returns (RouteConfigResponse);
}

// RouteRequest represents an incoming request to be routed.
message RouteRequest {
  // HTTP method (GET, POST, PUT, DELETE, PATCH, etc.)
  string method = 1;

  // Request path (e.g., "/api/v1/catalog/products")
  string path = 2;

  // Request headers as key-value pairs
  map<string, string> headers = 3;

  // Request body (binary-safe)
  bytes body = 4;

  // W3C Trace Context extracted from incoming headers
  string trace_context = 5;
}

// RouteResponse represents the response from the routed upstream service.
message RouteResponse {
  // HTTP status code from the upstream service
  uint32 status = 1;

  // Response headers as key-value pairs
  map<string, string> headers = 2;

  // Response body (binary-safe)
  bytes body = 3;

  // Name of the upstream service that handled the request
  string upstream_service = 4;
}

// HealthCheckRequest is an empty request for health checking.
message HealthCheckRequest {}

// ServingStatus enumerates the possible health states.
enum ServingStatus {
  // Unknown status
  SERVING_STATUS_UNSPECIFIED = 0;

  // Service is healthy and serving requests
  SERVING = 1;

  // Service is unavailable
  NOT_SERVING = 2;

  // Service is partially available (some downstreams unhealthy)
  DEGRADED = 3;
}

// DownstreamHealth represents the health of a downstream service dependency.
message DownstreamHealth {
  // Service name
  string service = 1;

  // Health status
  ServingStatus status = 2;

  // Last measured latency in nanoseconds (0 if unknown)
  int64 latency_ns = 3;

  // Last error message (empty if healthy)
  string error = 4;
}

// HealthCheckResponse contains the gateway health status.
message HealthCheckResponse {
  // Overall gateway health status
  ServingStatus status = 1;

  // Gateway uptime in seconds
  int64 uptime_seconds = 2;

  // Health status of each downstream service
  repeated DownstreamHealth downstream = 3;
}

// RateLimitRequest queries the current rate limit status.
message RateLimitRequest {
  // Client identifier (from X-API-Key or mTLS SVID)
  string client_id = 1;

  // Route pattern being accessed
  string route = 2;

  // Requested window in seconds (0 = use policy default)
  int64 window_seconds = 3;
}

// RateLimitResponse contains the rate limit status.
message RateLimitResponse {
  // Whether the request would be allowed
  bool allowed = 1;

  // Remaining requests in the current window
  int32 remaining = 2;

  // Unix timestamp when the window resets
  int64 reset_at = 3;

  // Name of the applied rate limit policy
  string policy = 4;

  // Milliseconds until the client should retry (0 if allowed)
  int64 retry_after_ms = 5;
}

// RouteConfigRequest queries the routing configuration.
message RouteConfigRequest {
  // Service to query (empty = all services)
  string service_name = 1;

  // Version filter (empty = all versions)
  string version = 2;
}

// Route represents a single routing rule.
message Route {
  // Unique route identifier
  string id = 1;

  // Path pattern (e.g., "/api/v1/catalog/*")
  string pattern = 2;

  // Allowed HTTP methods (empty = all)
  repeated string methods = 3;

  // Target upstream service name
  string upstream_service = 4;

  // Rewritten upstream path (empty = passthrough)
  string upstream_path = 5;

  // Request timeout in milliseconds
  int32 timeout_ms = 6;

  // Number of retries on upstream failure
  int32 retry_count = 7;

  // Rate limit policy name
  string rate_limit_policy = 8;

  // Whether authentication is required
  bool require_auth = 9;

  // Route metadata
  map<string, string> metadata = 10;
}

// RouteConfigResponse contains the routing configuration.
message RouteConfigResponse {
  // Matching routes
  repeated Route routes = 1;

  // Active middleware names
  repeated string middleware = 2;

  // Default timeout in milliseconds
  int32 timeout_ms = 3;
}
