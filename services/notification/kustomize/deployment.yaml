apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification
  labels:
    app.kubernetes.io/name: notification
    app.kubernetes.io/component: notification
    app.kubernetes.io/part-of: polyglot-microservices
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: notification
  template:
    metadata:
      labels:
        app.kubernetes.io/name: notification
        app.kubernetes.io/component: notification
        app.kubernetes.io/part-of: polyglot-microservices
      annotations:
        spiffe.io/inject: "true"
    spec:
      securityContext:
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: notification
      containers:
        - name: notification
          image: polyglot-platform/notification:latest
          ports:
            - name: grpc
              containerPort: 50056
              protocol: TCP
            - name: http
              containerPort: 8086
              protocol: TCP
          env:
            - name: GRPC_PORT
              value: "50056"
            - name: HTTP_PORT
              value: "8086"
            - name: SPIFFE_ENDPOINT_SOCKET
              value: "unix:///run/spire/sockets/agent.sock"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-gateway.production.svc.cluster.local:4317"
            - name: OTEL_SERVICE_NAME
              value: "notification"
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: LOG_LEVEL
              value: "info"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
