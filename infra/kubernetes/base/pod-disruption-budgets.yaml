  selector:
    matchLabels:
      app.kubernetes.io/name: spire-server
---
# Gateway: Allow 1 pod unavailable during rolling updates
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: gateway-pdb
  namespace: production
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/component: api-gateway
    app.kubernetes.io/part-of: polyglot-microservices
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway
