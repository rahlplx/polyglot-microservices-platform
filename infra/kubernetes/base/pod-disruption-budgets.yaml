# PodDisruptionBudgets for production namespace
# Ensures minimum availability during voluntary disruptions (node drains, rolling updates)
# Critical stateful services: minAvailable ensures quorum during maintenance
# Service deployments: maxUnavailable allows controlled rolling updates
---
# Kafka Broker: Require 2 of 3 replicas available (quorum for replication factor 3)
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: kafka-broker-pdb
  namespace: production
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/component: messaging
    app.kubernetes.io/part-of: polyglot-microservices
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: kafka
---
# Zookeeper: Require 2 of 3 replicas available (quorum for leader election)
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: zookeeper-pdb
  namespace: production
  labels:
    app.kubernetes.io/name: zookeeper
    app.kubernetes.io/component: messaging
