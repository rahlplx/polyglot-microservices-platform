# ServiceAccounts for all 9 polyglot microservices
# Each SA is annotated with SPIFFE/SPIRE identity for zero-trust mTLS
# SPIFFE ID format: spiffe://trust.example.org/ns/{namespace}/sa/{service-account}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gateway
  namespace: production
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/component: api-gateway
    app.kubernetes.io/part-of: polyglot-microservices
  annotations:
    spiffe.io/spiffe-id: spiffe://trust.example.org/ns/production/sa/gateway
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: identity
  namespace: production
  labels:
    app.kubernetes.io/name: identity
    app.kubernetes.io/component: identity-service
    app.kubernetes.io/part-of: polyglot-microservices
  annotations:
    spiffe.io/spiffe-id: spiffe://trust.example.org/ns/production/sa/identity
---
