apiVersion: v1
kind: Namespace
metadata:
  name: production
  labels:
    name: production
    environment: production
    app.kubernetes.io/part-of: polyglot-microservices
    app.kubernetes.io/managed-by: argocd
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
  annotations:
    # NOTE: The scheduler.alpha.kubernetes.io/defaultTolerations annotation was removed.
    # It was a deprecated alpha annotation that is no longer supported by Kubernetes.
    # Use taints on nodes and tolerations in Pod specs instead.
spec:
  finalizers:
    - kubernetes
