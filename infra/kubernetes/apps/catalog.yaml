# Catalog Service — Node.js/TypeScript
# Product/inventory CRUD, search, dual gRPC+REST API
# Resource budget: CPU 200m/1000m, Memory 256Mi/1Gi, 3 replicas
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: catalog
  namespace: argocd
  labels:
    app.kubernetes.io/name: catalog
    app.kubernetes.io/component: catalog-service
    app.kubernetes.io/part-of: polyglot-microservices
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: polyglot-microservices
  source:
    repoURL: https://github.com/example/polyglot-microservices.git
    targetRevision: main
    kustomize:
      namePrefix: ""
      nameSuffix: ""
      images:
        - catalog=ghcr.io/example/catalog:latest
      namespace: production
    path: services/catalog/kustomize
  destination:
    server: https://kubernetes.default.svc
    namespace: production
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
