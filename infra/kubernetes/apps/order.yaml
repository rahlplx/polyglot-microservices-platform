# Order Service — Java/Kotlin
# Order lifecycle, Saga orchestration, Outbox pattern, Kafka event publisher
# Resource budget: CPU 500m/2000m, Memory 512Mi/2Gi, 3 replicas
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: order
  namespace: argocd
  labels:
    app.kubernetes.io/name: order
    app.kubernetes.io/component: order-service
    app.kubernetes.io/part-of: polyglot-microservices
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: polyglot-microservices
  source:
    repoURL: https://github.com/example/polyglot-microservices.git
    targetRevision: main
    kustomize:
      namePrefix: ""
      nameSuffix: ""
      images:
        - order=ghcr.io/example/order:latest
      namespace: production
    path: services/order/kustomize
  destination:
    server: https://kubernetes.default.svc
    namespace: production
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
