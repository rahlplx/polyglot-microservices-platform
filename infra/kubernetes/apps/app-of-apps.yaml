# ArgoCD ApplicationSet — App-of-Apps pattern
# Deploys all 9 microservices + platform components via GitOps
# Each service has its own Application manifest for independent lifecycle management
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: polyglot-microservices
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: polyglot-microservices
    app.kubernetes.io/managed-by: argocd
spec:
  generators:
    - list:
        elements:
          - name: gateway
            path: infra/kubernetes/apps/gateway.yaml
          - name: identity
            path: infra/kubernetes/apps/identity.yaml
          - name: catalog
            path: infra/kubernetes/apps/catalog.yaml
          - name: order
            path: infra/kubernetes/apps/order.yaml
          - name: payment
            path: infra/kubernetes/apps/payment.yaml
          - name: notification
            path: infra/kubernetes/apps/notification.yaml
          - name: analytics
            path: infra/kubernetes/apps/analytics.yaml
          - name: cdc-relay
            path: infra/kubernetes/apps/cdc-relay.yaml
          - name: schema-registry
            path: infra/kubernetes/apps/schema-registry.yaml
  template:
    metadata:
      name: "{{name}}"
      labels:
        app.kubernetes.io/part-of: polyglot-microservices
      annotations:
        notifications.argoproj.io/subscribe.on-deployed.slack: platform-team
        notifications.argoproj.io/subscribe.on-health-degraded.slack: platform-team
        notifications.argoproj.io/subscribe.on-sync-failed.slack: platform-team
    spec:
      project: polyglot-microservices
      source:
        repoURL: https://github.com/rahlplx/polyglot-microservices-platform.git
        targetRevision: main
        path: "{{path}}"
      destination:
        server: https://kubernetes.default.svc
        namespace: production
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
          allowEmpty: false
        syncOptions:
          - CreateNamespace=false
          - PrunePropagationPolicy=foreground
          - PruneLast=true
        retry:
          limit: 3
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
---
# ArgoCD Project for all polyglot microservices
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: polyglot-microservices
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: polyglot-microservices
spec:
  description: "Polyglot Microservices Platform — 9 services + platform components"
  sourceRepos:
    - "https://github.com/rahlplx/polyglot-microservices-platform.git"
  destinations:
    - namespace: production
      server: https://kubernetes.default.svc
    - namespace: argocd
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: "rbac.authorization.k8s.io"
      kind: ClusterRole
    - group: "rbac.authorization.k8s.io"
      kind: ClusterRoleBinding
  namespaceResourceWhitelist:
    - group: ""
      kind: ""
  namespaceResourceBlacklist:
    - group: ""
      kind: ResourceQuota
    - group: ""
      kind: LimitRange
  roles:
    - name: admin
      description: "Admin access to all applications in the project"
      policies:
        - "p, proj:polyglot-microservices:admin, applications, *, polyglot-microservices/*, allow"
    - name: readonly
      description: "Read-only access to all applications"
      policies:
        - "p, proj:polyglot-microservices:readonly, applications, get, polyglot-microservices/*, allow"
        - "p, proj:polyglot-microservices:readonly, applications, sync, polyglot-microservices/*, deny"
---
# Platform components Application (OTel, SPIRE, Kafka, Debezium)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-components
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: polyglot-microservices
    app.kubernetes.io/component: platform
  annotations:
    notifications.argoproj.io/subscribe.on-health-degraded.slack: platform-team
    notifications.argoproj.io/subscribe.on-sync-failed.slack: platform-team
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: polyglot-microservices
  source:
    repoURL: https://github.com/rahlplx/polyglot-microservices-platform.git
    targetRevision: main
    directory:
      recurse: true
      path: infra/kubernetes/platform
  destination:
    server: https://kubernetes.default.svc
    namespace: production
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - PrunePropagationPolicy=foreground
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
  ignoreDifferences:
    - group: ""
      kind: ConfigMap
      name: spire-bundle
      jsonPointers:
        - /data
