# ArgoCD ApplicationSet — App-of-Apps pattern
# Deploys all 9 microservices + platform components via GitOps
# Each service has its own Application manifest for independent lifecycle management
# Phase 5.2: Enhanced with ignoreDifferences, syncOptions, revisionHistoryLimit, info section
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: polyglot-microservices
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: polyglot-microservices
    app.kubernetes.io/managed-by: argocd
spec:
  generators:
    - list:
        elements:
          - name: gateway
            path: services/gateway/kustomize
          - name: identity
            path: services/identity/kustomize
          - name: catalog
            path: services/catalog/kustomize
          - name: order
            path: services/order/kustomize
          - name: payment
            path: services/payment/kustomize
          - name: notification
            path: services/notification/kustomize
          - name: analytics
            path: services/analytics/kustomize
          - name: cdc-relay
            path: services/cdc-relay/kustomize
          - name: schema-registry
            path: services/schema-registry/kustomize
  template:
    metadata:
      name: "{{name}}"
      labels:
        app.kubernetes.io/part-of: polyglot-microservices
        app.kubernetes.io/managed-by: argocd
      annotations:
        notifications.argoproj.io/subscribe.on-deployed.slack: platform-team
        notifications.argoproj.io/subscribe.on-health-degraded.slack: platform-team
        notifications.argoproj.io/subscribe.on-sync-failed.slack: platform-team
    spec:
      project: polyglot-microservices
      source:
        repoURL: ${GIT_REPO_URL:-https://github.com/rahlplx/polyglot-microservices-platform.git}
        targetRevision: ${GIT_TARGET_REVISION:-main}
        path: "{{path}}"
      destination:
        server: https://kubernetes.default.svc
        namespace: production
      # Revision history limit — keep only 3 revisions to reduce resource consumption
      revisionHistoryLimit: 3
      # Info section with links to runbooks and documentation
      info:
        - name: Runbook
          value: "https://runbooks.example.org/{{name}}"
        - name: Architecture
          value: "https://docs.example.org/architecture/{{name}}"
        - name: ArgoCD Dashboard
          value: "https://argocd.example.com/applications/{{name}}"
        - name: On-Call Escalation
          value: "https://pagerduty.example.com/escalation-policies/platform"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
          allowEmpty: false
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - PrunePropagationPolicy=foreground
          - PruneLast=true
        retry:
          limit: 3
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
      # Ignore differences for SPIRE bundle ConfigMap — SPIRE agent updates
      # the bundle at runtime, causing perpetual OutOfSync if not ignored
      ignoreDifferences:
        - group: ""
          kind: ConfigMap
          name: spire-bundle
          jsonPointers:
            - /data
---
# ArgoCD Project for all polyglot microservices
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: polyglot-microservices
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: polyglot-microservices
    app.kubernetes.io/managed-by: argocd
spec:
  description: "Polyglot Microservices Platform — 9 services + platform components"
  sourceRepos:
    - "${GIT_REPO_URL:-https://github.com/rahlplx/polyglot-microservices-platform.git}"
  destinations:
    - namespace: production
      server: https://kubernetes.default.svc
    - namespace: argocd
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: "rbac.authorization.k8s.io"
      kind: ClusterRole
    - group: "rbac.authorization.k8s.io"
      kind: ClusterRoleBinding
  namespaceResourceWhitelist:
    - group: ""
      kind: ""
  namespaceResourceBlacklist:
    - group: ""
      kind: ResourceQuota
    - group: ""
      kind: LimitRange
  roles:
    - name: admin
      description: "Admin access to all applications in the project"
      policies:
        - "p, proj:polyglot-microservices:admin, applications, *, polyglot-microservices/*, allow"
    - name: readonly
      description: "Read-only access to all applications"
      policies:
        - "p, proj:polyglot-microservices:readonly, applications, get, polyglot-microservices/*, allow"
        - "p, proj:polyglot-microservices:readonly, applications, sync, polyglot-microservices/*, deny"
---
# Platform components Application (OTel, SPIRE, Kafka, Debezium)
# Deploys platform infrastructure that services depend on
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-components
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: polyglot-microservices
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/component: platform
  annotations:
    notifications.argoproj.io/subscribe.on-health-degraded.slack: platform-team
    notifications.argoproj.io/subscribe.on-sync-failed.slack: platform-team
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: polyglot-microservices
  source:
    repoURL: ${GIT_REPO_URL:-https://github.com/rahlplx/polyglot-microservices-platform.git}
    targetRevision: ${GIT_TARGET_REVISION:-main}
    directory:
      recurse: true
      path: infra/kubernetes/platform
  destination:
    server: https://kubernetes.default.svc
    namespace: production
  # Revision history limit — keep only 3 revisions
  revisionHistoryLimit: 3
  # Info section with links to runbooks and documentation
  info:
    - name: Runbook
      value: "https://runbooks.example.org/platform-components"
    - name: Architecture
      value: "https://docs.example.org/architecture/platform"
    - name: ArgoCD Dashboard
      value: "https://argocd.example.com/applications/platform-components"
    - name: On-Call Escalation
      value: "https://pagerduty.example.com/escalation-policies/platform"
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - PrunePropagationPolicy=foreground
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
  # Ignore differences for SPIRE bundle ConfigMap — SPIRE agent updates
  # the bundle at runtime, causing perpetual OutOfSync if not ignored
  ignoreDifferences:
    - group: ""
      kind: ConfigMap
      name: spire-bundle
      jsonPointers:
        - /data
