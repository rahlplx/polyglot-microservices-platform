# Notification Service — Python
# Async event-driven delivery, ML optimization, CloudEvents consumer
# Resource budget: CPU 100m/500m, Memory 256Mi/512Mi, 2 replicas
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: notification
  namespace: argocd
  labels:
    app.kubernetes.io/name: notification
    app.kubernetes.io/component: notification-service
    app.kubernetes.io/part-of: polyglot-microservices
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: polyglot-microservices
  source:
    repoURL: https://github.com/example/polyglot-microservices.git
    targetRevision: main
    kustomize:
      namePrefix: ""
      nameSuffix: ""
      images:
        - notification=ghcr.io/example/notification:latest
      namespace: production
    path: services/notification/kustomize
  destination:
    server: https://kubernetes.default.svc
    namespace: production
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
