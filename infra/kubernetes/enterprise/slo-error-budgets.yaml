# Enterprise SLO Definitions, Error Budget Tracking & Multi-Window Burn Rate Alerting
# ──────────────────────────────────────────────────────────────────────────────────
# Covers all 9 platform services with formal SLO definitions, recording rules for
# SLI computation efficiency, Google SRE 2-window burn rate alerts, and error budget
# consumption tracking at 50%/80%/95% thresholds.
#
# SLO Targets:
# ┌──────────────────┬──────────────────┬───────────────┬──────────────────────┐
# │ Service          │ Availability SLO │ Latency SLO   │ 30d Error Budget     │
# ├──────────────────┼──────────────────┼───────────────┼──────────────────────┤
# │ gateway          │ 99.95%           │ p99 < 500ms   │ 21.9 min downtime    │
# │ identity         │ 99.99%           │ p99 < 200ms   │ 4.3 min downtime     │
# │ catalog          │ 99.95%           │ p99 < 300ms   │ 21.9 min downtime    │
# │ order            │ 99.95%           │ p99 < 1s      │ 21.9 min downtime    │
# │ payment          │ 99.99%           │ p99 < 500ms   │ 4.3 min downtime     │
# │ notification     │ 99.9%            │ p99 < 2s      │ 43.8 min downtime    │
# │ analytics        │ 99.9%            │ p99 < 2s      │ 43.8 min downtime    │
# │ rl-engine        │ 99.9%            │ p99 < 1s      │ 43.8 min downtime    │
# │ schema-registry  │ 99.95%           │ p99 < 200ms   │ 21.9 min downtime    │
# └──────────────────┴──────────────────┴───────────────┴──────────────────────┘
#
# Burn Rate Alert Strategy (Google SRE Chapter 6):
#   Fast Burn (PAGE):  14.4x rate over 1h window AND 14.4x over 5m window
#     → Consumes ~2% of 30d budget per hour → urgent intervention needed
#   Slow Burn (TICKET): 6x rate over 6h window AND 6x over 30m window
#     → Consumes ~5% of 30d budget per 6h → tracked, non-urgent
#
# NOTE: Latency histogram buckets MUST be configured in OTel SDK to include
# the SLO threshold values (0.2, 0.3, 0.5, 1, 2 seconds). Add these to the
# OTel histogram bucket overrides in each service's tracer provider config:
#   e.g., ExplicitBucketBoundaries: [0.005, 0.01, 0.025, 0.05, 0.1, 0.2,
#          0.3, 0.5, 0.75, 1, 2, 5, 10]
#
# Complements: infra/kubernetes/platform/prometheus-alerts.yaml (basic alerts)
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: slo-error-budgets
  namespace: production
  labels:
    app.kubernetes.io/part-of: polyglot-microservices
    prometheus: k8s
    role: slo-rules
    severity: enterprise
spec:
  groups:
    # ══════════════════════════════════════════════════════════════════════
    # GROUP 1: SLI Recording Rules
    # Pre-computes availability and latency ratios for efficient alert/dash queries
    # ══════════════════════════════════════════════════════════════════════
    - name: slo-recording-rules
      rules:
        # ──────────────────────────────────────────────────────────────────
        # Gateway — 99.95% availability, p99 < 500ms
        # ──────────────────────────────────────────────────────────────────
        - record: slo:service_availability:ratio_rate5m
          expr: |
            sum(rate(http_requests_total{job="gateway", code!~"5.."}[5m]))
            /
            sum(rate(http_requests_total{job="gateway"}[5m]))
          labels:
            service: gateway
            slo_type: availability
            slo_target: "0.9995"

        - record: slo:service_latency:ratio_rate5m
          expr: |
            sum(rate(http_request_duration_seconds_bucket{job="gateway", le="0.5"}[5m]))
            /
            sum(rate(http_request_duration_seconds_count{job="gateway"}[5m]))
          labels:
            service: gateway
            slo_type: latency
            slo_target: "0.99"
            latency_threshold_ms: "500"

        - record: slo:error_budget_consumed:ratio
          expr: |
            (1 -
              sum(increase(http_requests_total{job="gateway", code!~"5.."}[30d]))
              /
              sum(increase(http_requests_total{job="gateway"}[30d]))
            ) / (1 - 0.9995)
          labels:
            service: gateway
            slo_type: availability

        - record: slo:error_budget_remaining:ratio
          expr: |
            1 - slo:error_budget_consumed:ratio{service="gateway"}
          labels:
            service: gateway
            slo_type: availability

        # ──────────────────────────────────────────────────────────────────
        # Identity — 99.99% availability, p99 < 200ms
        # ──────────────────────────────────────────────────────────────────
        - record: slo:service_availability:ratio_rate5m
          expr: |
            sum(rate(http_requests_total{job="identity", code!~"5.."}[5m]))
            /
            sum(rate(http_requests_total{job="identity"}[5m]))
          labels:
            service: identity
            slo_type: availability
            slo_target: "0.9999"

        - record: slo:service_latency:ratio_rate5m
          expr: |
            sum(rate(http_request_duration_seconds_bucket{job="identity", le="0.2"}[5m]))
            /
            sum(rate(http_request_duration_seconds_count{job="identity"}[5m]))
          labels:
            service: identity
            slo_type: latency
            slo_target: "0.99"
            latency_threshold_ms: "200"

        - record: slo:error_budget_consumed:ratio
          expr: |
            (1 -
              sum(increase(http_requests_total{job="identity", code!~"5.."}[30d]))
              /
              sum(increase(http_requests_total{job="identity"}[30d]))
            ) / (1 - 0.9999)
          labels:
            service: identity
            slo_type: availability

        - record: slo:error_budget_remaining:ratio
          expr: |
            1 - slo:error_budget_consumed:ratio{service="identity"}
          labels:
            service: identity
            slo_type: availability

        # ──────────────────────────────────────────────────────────────────
        # Catalog — 99.95% availability, p99 < 300ms
        # ──────────────────────────────────────────────────────────────────
        - record: slo:service_availability:ratio_rate5m
          expr: |
            sum(rate(http_requests_total{job="catalog", code!~"5.."}[5m]))
            /
            sum(rate(http_requests_total{job="catalog"}[5m]))
          labels:
            service: catalog
            slo_type: availability
            slo_target: "0.9995"

        - record: slo:service_latency:ratio_rate5m
          expr: |
            sum(rate(http_request_duration_seconds_bucket{job="catalog", le="0.3"}[5m]))
            /
            sum(rate(http_request_duration_seconds_count{job="catalog"}[5m]))
          labels:
            service: catalog
            slo_type: latency
            slo_target: "0.99"
            latency_threshold_ms: "300"

        - record: slo:error_budget_consumed:ratio
          expr: |
            (1 -
              sum(increase(http_requests_total{job="catalog", code!~"5.."}[30d]))
              /
              sum(increase(http_requests_total{job="catalog"}[30d]))
            ) / (1 - 0.9995)
          labels:
            service: catalog
            slo_type: availability

        - record: slo:error_budget_remaining:ratio
          expr: |
            1 - slo:error_budget_consumed:ratio{service="catalog"}
          labels:
            service: catalog
            slo_type: availability

        # ──────────────────────────────────────────────────────────────────
        # Order — 99.95% availability, p99 < 1s
        # ──────────────────────────────────────────────────────────────────
        - record: slo:service_availability:ratio_rate5m
          expr: |
            sum(rate(http_requests_total{job="order", code!~"5.."}[5m]))
            /
            sum(rate(http_requests_total{job="order"}[5m]))
          labels:
            service: order
            slo_type: availability
            slo_target: "0.9995"

        - record: slo:service_latency:ratio_rate5m
          expr: |
            sum(rate(http_request_duration_seconds_bucket{job="order", le="1"}[5m]))
            /
            sum(rate(http_request_duration_seconds_count{job="order"}[5m]))
          labels:
            service: order
            slo_type: latency
            slo_target: "0.99"
            latency_threshold_ms: "1000"

        - record: slo:error_budget_consumed:ratio
          expr: |
            (1 -
              sum(increase(http_requests_total{job="order", code!~"5.."}[30d]))
              /
              sum(increase(http_requests_total{job="order"}[30d]))
            ) / (1 - 0.9995)
          labels:
            service: order
            slo_type: availability

        - record: slo:error_budget_remaining:ratio
          expr: |
            1 - slo:error_budget_consumed:ratio{service="order"}
          labels:
            service: order
            slo_type: availability

        # ──────────────────────────────────────────────────────────────────
        # Payment — 99.99% availability, p99 < 500ms
        # ──────────────────────────────────────────────────────────────────
        - record: slo:service_availability:ratio_rate5m
          expr: |
            sum(rate(http_requests_total{job="payment", code!~"5.."}[5m]))
            /
            sum(rate(http_requests_total{job="payment"}[5m]))
          labels:
            service: payment
            slo_type: availability
            slo_target: "0.9999"

        - record: slo:service_latency:ratio_rate5m
          expr: |
            sum(rate(http_request_duration_seconds_bucket{job="payment", le="0.5"}[5m]))
            /
            sum(rate(http_request_duration_seconds_count{job="payment"}[5m]))
          labels:
            service: payment
            slo_type: latency
            slo_target: "0.99"
            latency_threshold_ms: "500"

        - record: slo:error_budget_consumed:ratio
          expr: |
            (1 -
              sum(increase(http_requests_total{job="payment", code!~"5.."}[30d]))
              /
              sum(increase(http_requests_total{job="payment"}[30d]))
            ) / (1 - 0.9999)
          labels:
            service: payment
            slo_type: availability

        - record: slo:error_budget_remaining:ratio
          expr: |
            1 - slo:error_budget_consumed:ratio{service="payment"}
          labels:
            service: payment
            slo_type: availability

        # ──────────────────────────────────────────────────────────────────
        # Notification — 99.9% availability, p99 < 2s
        # ──────────────────────────────────────────────────────────────────
        - record: slo:service_availability:ratio_rate5m
          expr: |
            sum(rate(http_requests_total{job="notification", code!~"5.."}[5m]))
            /
            sum(rate(http_requests_total{job="notification"}[5m]))
          labels:
            service: notification
            slo_type: availability
            slo_target: "0.999"

        - record: slo:service_latency:ratio_rate5m
          expr: |
            sum(rate(http_request_duration_seconds_bucket{job="notification", le="2"}[5m]))
            /
            sum(rate(http_request_duration_seconds_count{job="notification"}[5m]))
          labels:
            service: notification
            slo_type: latency
            slo_target: "0.99"
            latency_threshold_ms: "2000"

        - record: slo:error_budget_consumed:ratio
          expr: |
            (1 -
              sum(increase(http_requests_total{job="notification", code!~"5.."}[30d]))
              /
              sum(increase(http_requests_total{job="notification"}[30d]))
            ) / (1 - 0.999)
          labels:
            service: notification
            slo_type: availability

        - record: slo:error_budget_remaining:ratio
          expr: |
            1 - slo:error_budget_consumed:ratio{service="notification"}
          labels:
            service: notification
            slo_type: availability

        # ──────────────────────────────────────────────────────────────────
        # Analytics — 99.9% availability, p99 < 2s
        # ──────────────────────────────────────────────────────────────────
        - record: slo:service_availability:ratio_rate5m
          expr: |
            sum(rate(http_requests_total{job="analytics", code!~"5.."}[5m]))
            /
            sum(rate(http_requests_total{job="analytics"}[5m]))
          labels:
            service: analytics
            slo_type: availability
            slo_target: "0.999"

        - record: slo:service_latency:ratio_rate5m
          expr: |
            sum(rate(http_request_duration_seconds_bucket{job="analytics", le="2"}[5m]))
            /
            sum(rate(http_request_duration_seconds_count{job="analytics"}[5m]))
          labels:
            service: analytics
            slo_type: latency
            slo_target: "0.99"
            latency_threshold_ms: "2000"

        - record: slo:error_budget_consumed:ratio
          expr: |
            (1 -
              sum(increase(http_requests_total{job="analytics", code!~"5.."}[30d]))
              /
              sum(increase(http_requests_total{job="analytics"}[30d]))
            ) / (1 - 0.999)
          labels:
            service: analytics
            slo_type: availability

        - record: slo:error_budget_remaining:ratio
          expr: |
            1 - slo:error_budget_consumed:ratio{service="analytics"}
          labels:
            service: analytics
            slo_type: availability

        # ──────────────────────────────────────────────────────────────────
        # RL Engine — 99.9% availability, p99 < 1s
        # ──────────────────────────────────────────────────────────────────
        - record: slo:service_availability:ratio_rate5m
          expr: |
            sum(rate(http_requests_total{job="rl-engine", code!~"5.."}[5m]))
            /
            sum(rate(http_requests_total{job="rl-engine"}[5m]))
          labels:
            service: rl-engine
            slo_type: availability
            slo_target: "0.999"

        - record: slo:service_latency:ratio_rate5m
          expr: |
            sum(rate(http_request_duration_seconds_bucket{job="rl-engine", le="1"}[5m]))
            /
            sum(rate(http_request_duration_seconds_count{job="rl-engine"}[5m]))
          labels:
            service: rl-engine
            slo_type: latency
            slo_target: "0.99"
            latency_threshold_ms: "1000"

        - record: slo:error_budget_consumed:ratio
          expr: |
            (1 -
              sum(increase(http_requests_total{job="rl-engine", code!~"5.."}[30d]))
              /
              sum(increase(http_requests_total{job="rl-engine"}[30d]))
            ) / (1 - 0.999)
          labels:
            service: rl-engine
            slo_type: availability

        - record: slo:error_budget_remaining:ratio
          expr: |
            1 - slo:error_budget_consumed:ratio{service="rl-engine"}
          labels:
            service: rl-engine
            slo_type: availability

        # ──────────────────────────────────────────────────────────────────
        # Schema Registry — 99.95% availability, p99 < 200ms
        # ──────────────────────────────────────────────────────────────────
        - record: slo:service_availability:ratio_rate5m
          expr: |
            sum(rate(http_requests_total{job="schema-registry", code!~"5.."}[5m]))
            /
            sum(rate(http_requests_total{job="schema-registry"}[5m]))
          labels:
            service: schema-registry
            slo_type: availability
            slo_target: "0.9995"

        - record: slo:service_latency:ratio_rate5m
          expr: |
            sum(rate(http_request_duration_seconds_bucket{job="schema-registry", le="0.2"}[5m]))
            /
            sum(rate(http_request_duration_seconds_count{job="schema-registry"}[5m]))
          labels:
            service: schema-registry
            slo_type: latency
            slo_target: "0.99"
            latency_threshold_ms: "200"

        - record: slo:error_budget_consumed:ratio
          expr: |
            (1 -
              sum(increase(http_requests_total{job="schema-registry", code!~"5.."}[30d]))
              /
              sum(increase(http_requests_total{job="schema-registry"}[30d]))
            ) / (1 - 0.9995)
          labels:
            service: schema-registry
