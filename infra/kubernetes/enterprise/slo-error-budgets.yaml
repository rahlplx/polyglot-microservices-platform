    # ══════════════════════════════════════════════════════════════════════
    # GROUP 4: Error Budget Consumption Tracking
    # Tracks how much of the 30d error budget has been consumed per service
    # Thresholds: 50% (info), 80% (warning), 95% (critical)
    # ══════════════════════════════════════════════════════════════════════
    - name: error-budget
      rules:
        # ──────────────────────────────────────────────────────────────────
        # Gateway — 99.95% availability (30d budget: 21.9 min)
        # ──────────────────────────────────────────────────────────────────
        - alert: ErrorBudget50PercentConsumed
          expr: slo:error_budget_consumed:ratio{service="gateway"} >= 0.5
          for: 5m
          labels:
            severity: info
            team: platform
            slo_type: availability
            service: gateway
            budget_threshold: "50%"
            runbook: docs/runbooks/gateway-runbook.md
          annotations:
            summary: "Gateway has consumed 50% of 30d availability error budget"
            description: >-
              Gateway has consumed {{ $value | humanizePercentage }} of its 30d error budget.
              Budget remaining: {{ with query "slo:error_budget_remaining:ratio{service='gateway'}" }}{{ . | first | value | humanizePercentage }}{{ end }}.
              At current rate, SLO violation is projected within {{ with query "slo:error_budget_remaining:ratio{service='gateway'}" }}{{ . | first | value | printf "%.0f" }}{{ end }}% of the remaining budget period.
            action: >-
              Monitor trend. No immediate action required but review incident history.
              Consider proactively addressing known issues to prevent budget exhaustion.

        - alert: ErrorBudget80PercentConsumed
          expr: slo:error_budget_consumed:ratio{service="gateway"} >= 0.8
          for: 5m
          labels:
            severity: warning
            team: platform
            slo_type: availability
            service: gateway
            budget_threshold: "80%"
            runbook: docs/runbooks/gateway-runbook.md
          annotations:
            summary: "Gateway has consumed 80% of 30d availability error budget"
            description: >-
              Gateway has consumed {{ $value | humanizePercentage }} of its 30d error budget.
              Only {{ with query "slo:error_budget_remaining:ratio{service='gateway'}" }}{{ . | first | value | humanizePercentage }}{{ end }} remains.
              Any additional downtime will likely result in SLO violation.
            action: >-
              Prioritize reliability work. Freeze non-critical deployments.
              Review all open incidents. Consider increasing redundancy or failover capacity.

        - alert: ErrorBudget95PercentConsumed
          expr: slo:error_budget_consumed:ratio{service="gateway"} >= 0.95
          for: 1m
          labels:
            severity: critical
            team: platform
            slo_type: availability
            service: gateway
            budget_threshold: "95%"
            runbook: docs/runbooks/gateway-runbook.md
          annotations:
            summary: "Gateway has consumed 95% of 30d availability error budget (CRITICAL)"
            description: >-
              Gateway has consumed {{ $value | humanizePercentage }} of its 30d error budget.
              SLO violation is imminent. Only {{ with query "slo:error_budget_remaining:ratio{service='gateway'}" }}{{ . | first | value | humanizePercentage }}{{ end }} remains.
              Freeze all deployments. Initiate incident response if not already active.
            action: >-
              EMERGENCY: Freeze all deployments to gateway and downstream services.
              Activate incident response. Review all recent changes.
              Consider rolling back recent deployments. Escalate to engineering leadership.

        # ──────────────────────────────────────────────────────────────────
        # Identity — 99.99% availability (30d budget: 4.3 min)
        # ──────────────────────────────────────────────────────────────────
