            (
              (1 - sum(rate(http_request_duration_seconds_bucket{job="gateway", le="0.5"}[30m])) / sum(rate(http_request_duration_seconds_count{job="gateway"}[30m])))
              / (1 - 0.99)
            ) >= 6
          for: 15m
          labels:
            severity: ticket
            team: platform
            slo_type: latency
            service: gateway
            slo_target: "p99<500ms"
            burn_rate_type: slow
            runbook: docs/runbooks/gateway-runbook.md
