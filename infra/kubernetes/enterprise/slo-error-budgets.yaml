              With only 4.3 min total budget, even 50% consumption is concerning (2.15 min used).
              Budget remaining: {{ with query "slo:error_budget_remaining:ratio{service='identity'}" }}{{ . | first | value | humanizePercentage }}{{ end }}.
            action: >-
              Review SVID rotation reliability. Check for intermittent SPIRE server issues.
              Monitor closely — the tight budget leaves little room for further errors.

        - alert: ErrorBudget80PercentConsumed
          expr: slo:error_budget_consumed:ratio{service="identity"} >= 0.8
          for: 5m
          labels:
            severity: warning
            team: platform
            slo_type: availability
            service: identity
            budget_threshold: "80%"
            runbook: docs/runbooks/identity-runbook.md
          annotations:
