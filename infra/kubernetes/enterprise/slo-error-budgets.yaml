    # ══════════════════════════════════════════════════════════════════════
    # GROUP 3: Latency SLO Burn Rate Alerts
    # Tracks p99 latency against per-service thresholds using 2-window burn rates
    # ══════════════════════════════════════════════════════════════════════
    - name: slo-latency
      rules:
        # ──────────────────────────────────────────────────────────────────
        # Gateway — p99 < 500ms latency SLO
        # ──────────────────────────────────────────────────────────────────
        - alert: SLOLatencyFastBurn
          expr: |
            (
              (1 - sum(rate(http_request_duration_seconds_bucket{job="gateway", le="0.5"}[1h])) / sum(rate(http_request_duration_seconds_count{job="gateway"}[1h])))
              / (1 - 0.99)
            ) >= 14.4
            and
            (
              (1 - sum(rate(http_request_duration_seconds_bucket{job="gateway", le="0.5"}[5m])) / sum(rate(http_request_duration_seconds_count{job="gateway"}[5m])))
              / (1 - 0.99)
            ) >= 14.4
          for: 2m
          labels:
            severity: page
            team: platform
            slo_type: latency
            service: gateway
            slo_target: "p99<500ms"
            burn_rate_type: fast
            runbook: docs/runbooks/gateway-runbook.md
          annotations:
            summary: "Gateway latency SLO fast burn (PAGE)"
            description: >-
              Gateway p99 latency is burning through its SLO budget at 14.4x rate (>500ms threshold).
              More than 1% of requests are exceeding 500ms, consuming the 30d latency budget rapidly.
              Gateway latency degradation cascades to ALL downstream services and user experience.
            action: >-
              Check for CPU throttling: kubectl top pods -n production -l app.kubernetes.io/name=gateway
              Review connection pool saturation. Check rate limiter queue depth.
              Examine downstream service latency. Consider scaling gateway replicas.

        - alert: SLOLatencySlowBurn
          expr: |
            (
              (1 - sum(rate(http_request_duration_seconds_bucket{job="gateway", le="0.5"}[6h])) / sum(rate(http_request_duration_seconds_count{job="gateway"}[6h])))
              / (1 - 0.99)
            ) >= 6
