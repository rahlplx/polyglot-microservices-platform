            slo_type: availability

    # ══════════════════════════════════════════════════════════════════════
    # GROUP 2: Availability SLO Burn Rate Alerts
    # Uses Google SRE 2-window pattern to distinguish fast (page) vs slow (ticket) burns
    # ══════════════════════════════════════════════════════════════════════
    - name: slo-availability
      rules:
        # ──────────────────────────────────────────────────────────────────
        # Gateway — 99.95% availability (budget: 21.9 min / 30d)
        # ──────────────────────────────────────────────────────────────────
        - alert: SLOAvailabilityFastBurn
          expr: |
            (
              (1 - sum(rate(http_requests_total{job="gateway", code!~"5.."}[1h])) / sum(rate(http_requests_total{job="gateway"}[1h])))
              / (1 - 0.9995)
            ) >= 14.4
            and
            (
              (1 - sum(rate(http_requests_total{job="gateway", code!~"5.."}[5m])) / sum(rate(http_requests_total{job="gateway"}[5m])))
              / (1 - 0.9995)
            ) >= 14.4
          for: 2m
          labels:
            severity: page
            team: platform
            slo_type: availability
            service: gateway
            slo_target: "99.95%"
            burn_rate_type: fast
            runbook: docs/runbooks/gateway-runbook.md
          annotations:
            summary: "Gateway availability SLO fast burn (PAGE)"
            description: >-
              Gateway is burning through its 99.95% availability error budget at 14.4x rate.
              Current 1h error rate is {{ $value | humanizePercentage }} of the allowed monthly rate.
              At this pace, the entire 30d budget (21.9 min downtime) will be consumed in ~2 days.
            action: >-
              Check gateway pod health: kubectl get pods -n production -l app.kubernetes.io/name=gateway
              Examine 5xx errors in Loki: {service="gateway"} | json | status >= 500
              Check downstream service health and network connectivity.

        - alert: SLOAvailabilitySlowBurn
          expr: |
            (
              (1 - sum(rate(http_requests_total{job="gateway", code!~"5.."}[6h])) / sum(rate(http_requests_total{job="gateway"}[6h])))
              / (1 - 0.9995)
            ) >= 6
            and
            (
              (1 - sum(rate(http_requests_total{job="gateway", code!~"5.."}[30m])) / sum(rate(http_requests_total{job="gateway"}[30m])))
              / (1 - 0.9995)
            ) >= 6
          for: 15m
          labels:
            severity: ticket
            team: platform
            slo_type: availability
            service: gateway
            slo_target: "99.95%"
            burn_rate_type: slow
            runbook: docs/runbooks/gateway-runbook.md
          annotations:
            summary: "Gateway availability SLO slow burn (TICKET)"
            description: >-
              Gateway is burning through its 99.95% availability error budget at 6x rate.
              Current 6h error rate indicates sustained degradation consuming ~5% of 30d budget per 6h.
              Budget remaining: {{ with query "slo:error_budget_remaining:ratio{service='gateway'}" }}{{ . | first | value | humanizePercentage }}{{ end }}.
            action: >-
              Review recent deployments and config changes. Check for gradual resource exhaustion.
              Verify downstream dependencies are healthy. Schedule investigation during business hours.

        # ──────────────────────────────────────────────────────────────────
        # Identity — 99.99% availability (budget: 4.3 min / 30d)
        # ──────────────────────────────────────────────────────────────────
        - alert: SLOAvailabilityFastBurn
          expr: |
            (
              (1 - sum(rate(http_requests_total{job="identity", code!~"5.."}[1h])) / sum(rate(http_requests_total{job="identity"}[1h])))
              / (1 - 0.9999)
            ) >= 14.4
            and
            (
              (1 - sum(rate(http_requests_total{job="identity", code!~"5.."}[5m])) / sum(rate(http_requests_total{job="identity"}[5m])))
              / (1 - 0.9999)
            ) >= 14.4
          for: 2m
          labels:
            severity: page
            team: platform
            slo_type: availability
            service: identity
            slo_target: "99.99%"
            burn_rate_type: fast
            runbook: docs/runbooks/identity-runbook.md
          annotations:
            summary: "Identity availability SLO fast burn (PAGE)"
            description: >-
              Identity is burning through its 99.99% availability error budget at 14.4x rate.
              This is a CRITICAL service — the entire 30d budget is only 4.3 minutes of downtime.
              At 14.4x burn, the budget will be exhausted in ~50 hours.
            action: >-
              Check SPIRE server health: kubectl get pods -n production -l app.kubernetes.io/name=spire-server
              Verify SVID rotation is functioning. Check database connectivity for identity store.
              Examine mTLS certificate expiry. Escalate immediately if auth is failing system-wide.

        - alert: SLOAvailabilitySlowBurn
          expr: |
            (
              (1 - sum(rate(http_requests_total{job="identity", code!~"5.."}[6h])) / sum(rate(http_requests_total{job="identity"}[6h])))
              / (1 - 0.9999)
            ) >= 6
            and
            (
              (1 - sum(rate(http_requests_total{job="identity", code!~"5.."}[30m])) / sum(rate(http_requests_total{job="identity"}[30m])))
              / (1 - 0.9999)
            ) >= 6
          for: 15m
          labels:
            severity: ticket
            team: platform
            slo_type: availability
            service: identity
            slo_target: "99.99%"
            burn_rate_type: slow
            runbook: docs/runbooks/identity-runbook.md
          annotations:
            summary: "Identity availability SLO slow burn (TICKET)"
            description: >-
              Identity is slowly burning its 99.99% availability error budget at 6x rate.
              Budget remaining: {{ with query "slo:error_budget_remaining:ratio{service='identity'}" }}{{ . | first | value | humanizePercentage }}{{ end }}.
              With only 4.3 min budget per month, even slow burns require prompt attention.
            action: >-
              Review SVID rotation logs. Check for intermittent SPIRE server connectivity issues.
              Examine identity service restarts. Plan investigation within current sprint.

        # ──────────────────────────────────────────────────────────────────
        # Catalog — 99.95% availability (budget: 21.9 min / 30d)
        # ──────────────────────────────────────────────────────────────────
        - alert: SLOAvailabilityFastBurn
          expr: |
            (
              (1 - sum(rate(http_requests_total{job="catalog", code!~"5.."}[1h])) / sum(rate(http_requests_total{job="catalog"}[1h])))
              / (1 - 0.9995)
            ) >= 14.4
            and
            (
              (1 - sum(rate(http_requests_total{job="catalog", code!~"5.."}[5m])) / sum(rate(http_requests_total{job="catalog"}[5m])))
              / (1 - 0.9995)
            ) >= 14.4
          for: 2m
          labels:
            severity: page
            team: platform
            slo_type: availability
            service: catalog
            slo_target: "99.95%"
            burn_rate_type: fast
            runbook: docs/runbooks/catalog-runbook.md
          annotations:
            summary: "Catalog availability SLO fast burn (PAGE)"
            description: >-
              Catalog is burning through its 99.95% availability error budget at 14.4x rate.
              At this pace, the entire 30d budget (21.9 min downtime) will be consumed in ~2 days.
              Catalog failures cascade to order processing and search functionality.
            action: >-
              Check catalog pod health and database connectivity.
              Examine search index health: kubectl logs -n production -l app.kubernetes.io/name=catalog
              Check Meilisearch/Elasticsearch status. Verify PostgreSQL replica health.

        - alert: SLOAvailabilitySlowBurn
          expr: |
            (
              (1 - sum(rate(http_requests_total{job="catalog", code!~"5.."}[6h])) / sum(rate(http_requests_total{job="catalog"}[6h])))
              / (1 - 0.9995)
            ) >= 6
            and
            (
              (1 - sum(rate(http_requests_total{job="catalog", code!~"5.."}[30m])) / sum(rate(http_requests_total{job="catalog"}[30m])))
              / (1 - 0.9995)
            ) >= 6
          for: 15m
          labels:
            severity: ticket
            team: platform
            slo_type: availability
            service: catalog
            slo_target: "99.95%"
            burn_rate_type: slow
            runbook: docs/runbooks/catalog-runbook.md
          annotations:
            summary: "Catalog availability SLO slow burn (TICKET)"
            description: >-
              Catalog is slowly burning its 99.95% availability error budget at 6x rate.
              Budget remaining: {{ with query "slo:error_budget_remaining:ratio{service='catalog'}" }}{{ . | first | value | humanizePercentage }}{{ end }}.
            action: >-
              Review search index freshness. Check for intermittent database replica lag.
              Investigate connection pool exhaustion under load. Schedule investigation.

        # ──────────────────────────────────────────────────────────────────
        # Order — 99.95% availability (budget: 21.9 min / 30d)
        # ──────────────────────────────────────────────────────────────────
        - alert: SLOAvailabilityFastBurn
          expr: |
            (
              (1 - sum(rate(http_requests_total{job="order", code!~"5.."}[1h])) / sum(rate(http_requests_total{job="order"}[1h])))
              / (1 - 0.9995)
            ) >= 14.4
            and
            (
              (1 - sum(rate(http_requests_total{job="order", code!~"5.."}[5m])) / sum(rate(http_requests_total{job="order"}[5m])))
              / (1 - 0.9995)
            ) >= 14.4
          for: 2m
          labels:
            severity: page
            team: platform
            slo_type: availability
            service: order
            slo_target: "99.95%"
