              Only ~52 seconds of downtime remaining out of 4.3 min budget.
              Identity failures block ALL authenticated requests.
            action: >-
              Prioritize identity service stability. Review all recent identity/spire changes.
              Consider adding SPIRE server replicas. Verify failover mechanisms.

        - alert: ErrorBudget95PercentConsumed
          expr: slo:error_budget_consumed:ratio{service="identity"} >= 0.95
          for: 1m
          labels:
            severity: critical
            team: platform
            slo_type: availability
            service: identity
