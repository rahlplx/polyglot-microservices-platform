# (pandas DataFrames, time-series processing). 4Gi ceiling supports complex
# aggregation queries. CPU ceiling handles concurrent report generation.
# =============================================================================
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: analytics-vpa
  namespace: production
  labels:
    app.kubernetes.io/name: analytics
    app.kubernetes.io/component: analytics-service
    app.kubernetes.io/part-of: polyglot-microservices
    app.kubernetes.io/managed-by: vpa
    vpa.signal: recommendation-only
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: analytics
  updatePolicy:
    updateMode: "Off"
  resourcePolicy:
    containerPolicies:
      - containerName: analytics
        minAllowed:
          cpu: 100m
          memory: 256Mi
        maxAllowed:
          cpu: 2000m
          memory: 4Gi
        controlledResources:
          - cpu
          - memory

---
# =============================================================================
# 7. RL-ENGINE — Reinforcement Learning Policy Evaluation (Python)
# Bounds: CPU 100m-2000m, Memory 256Mi-4Gi
# Strategy: RL inference loads policy models into memory. Model weights and
# feature preprocessing buffers drive the 4Gi ceiling. CPU is the primary
# constraint for real-time inference. Memory recommendations will likely
# trend toward the upper bound due to model loading patterns.
# =============================================================================
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: rl-engine-vpa
  namespace: production
  labels:
    app.kubernetes.io/name: rl-engine
    app.kubernetes.io/component: rl-engine
    app.kubernetes.io/part-of: polyglot-microservices
    app.kubernetes.io/managed-by: vpa
    vpa.signal: recommendation-only
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: rl-engine
  updatePolicy:
    updateMode: "Off"
  resourcePolicy:
    containerPolicies:
      - containerName: rl-engine
        minAllowed:
          cpu: 100m
          memory: 256Mi
        maxAllowed:
          cpu: 2000m
          memory: 4Gi
        controlledResources:
          - cpu
          - memory

---
