---
# =============================================================================
# 9. IDENTITY — SPIFFE/SPIRE Identity Service (Rust)
# Bounds: CPU 50m-1000m, Memory 32Mi-512Mi
# Strategy: Rust's zero-cost abstractions and no-GC design mean extremely
# efficient memory usage. SVID operations are CPU-bound (cryptography) but
# memory footprint is tiny. 512Mi ceiling is generous — expect recommendations
# well below this. 32Mi floor ensures minimal viable allocation.
# =============================================================================
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: identity-vpa
  namespace: production
  labels:
    app.kubernetes.io/name: identity
    app.kubernetes.io/component: identity-service
    app.kubernetes.io/part-of: polyglot-microservices
    app.kubernetes.io/managed-by: vpa
    vpa.signal: recommendation-only
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: identity
  updatePolicy:
    updateMode: "Off"
  resourcePolicy:
    containerPolicies:
      - containerName: identity
        minAllowed:
          cpu: 50m
          memory: 32Mi
        maxAllowed:
          cpu: 1000m
          memory: 512Mi
        controlledResources:
          - cpu
          - memory

---
# =============================================================================
# 10. OTEL-GATEWAY — Observability Pipeline Gateway (Go)
# Bounds: CPU 50m-2000m, Memory 64Mi-2Gi
# Strategy: OTel Collector is Go-based with batch processing and queue
# management. The 2Gi memory ceiling accounts for the sending_queue
# (queue_size: 10000 items) and batch processor buffers. CPU scales with
# telemetry throughput. Current deployment sets 500m/1Gi requests —
# VPA will refine based on actual collector pipeline utilization.
# =============================================================================
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: otel-gateway-vpa
  namespace: production
  labels:
    app.kubernetes.io/name: otel-gateway
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: polyglot-microservices
    app.kubernetes.io/managed-by: vpa
    vpa.signal: recommendation-only
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: otel-gateway
  updatePolicy:
    updateMode: "Off"
  resourcePolicy:
    containerPolicies:
      - containerName: otel-gateway
        minAllowed:
          cpu: 50m
          memory: 64Mi
        maxAllowed:
          cpu: 2000m
          memory: 2Gi
        controlledResources:
          - cpu
          - memory
