    kind: Deployment
    name: catalog
  updatePolicy:
    updateMode: Auto
    minReplicas: 2
  resourcePolicy:
    containerPolicies:
      - containerName: catalog
        mode: Auto
        minAllowed:
          cpu: 200m
          memory: 512Mi
        maxAllowed:
          cpu: "2"
          memory: 2Gi
        controlledResources:
          - cpu
          - memory
        controlledValues: RequestsAndLimits
  recommenders:
    - name: default

