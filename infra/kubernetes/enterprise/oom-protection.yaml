# OOM Protection Resources for Polyglot Microservices Platform
# ──────────────────────────────────────────────────────────
# Prevents Out-of-Memory kills through proactive detection, automatic right-sizing,
# runtime-specific tuning, and OOM-aware resource defaults.
#
# Contents:
#   1. VerticalPodAutoscaler (Auto mode) for OOM-prone services
#   2. PrometheusRule for OOM prediction and memory pressure alerts
#   3. Runtime-specific ConfigMaps (JVM, Node.js, Python)
#   4. LimitRange with OOM-aware defaults
#
# Service Runtime Map:
# ┌──────────────────┬────────────────────┬─────────────────────────────────┐
# │ Service          │ Runtime            │ OOM Risk Factors                │
# ├──────────────────┼────────────────────┼─────────────────────────────────┤
# │ order            │ Kotlin/JVM         │ Heap, metaspace, GC overhead   │
# │ catalog          │ Node.js/TypeScript │ V8 heap, libuv threadpool      │
# │ analytics        │ Python             │ GIL, glibc arenas, GC          │
# │ notification     │ Python             │ Template rendering, glibc      │
# │ rl-engine        │ Python             │ Model inference, numpy/ML libs │
# │ gateway          │ Go                 │ Goroutine leaks (low risk)     │
# │ identity         │ Rust               │ Low risk (no GC)               │
# │ payment          │ Kotlin/JVM         │ Heap, circuit breaker state    │
# │ schema-registry  │ Go                 │ Low risk (lightweight)         │
# └──────────────────┴────────────────────┴─────────────────────────────────┘
#
# VPA Auto mode will evict and resize pods when recommendations exceed current
# allocations. minAllowed ensures services always have baseline resources.
# maxAllowed prevents runaway resource consumption.
#
# Complements: infra/kubernetes/base/resource-quotas.yaml (base LimitRange)
#              infra/kubernetes/platform/prometheus-alerts.yaml (OOMKilled alert)
---

# ══════════════════════════════════════════════════════════════════════
# SECTION 1: VerticalPodAutoscaler — Auto Mode for OOM-Prone Services
# ══════════════════════════════════════════════════════════════════════

# Order Service (Kotlin/JVM) — HIGHEST OOM RISK
# JVM heap + metaspace + GC overhead + Kafka buffers + saga state machines
# Current deployment: 128Mi request / 512Mi limit (UNDERSIZED per performance-budget.md)
# Performance budget target: 512Mi request / 2Gi limit
# VPA will right-size based on actual usage, starting from minAllowed floor
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: order-vpa-oom
  namespace: production
  labels:
    app.kubernetes.io/name: order
    app.kubernetes.io/component: order
    app.kubernetes.io/part-of: polyglot-microservices
    oom-protection: enabled
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: order
  updatePolicy:
    updateMode: Auto
    minReplicas: 2
  resourcePolicy:
    containerPolicies:
      - containerName: order
        mode: Auto
        minAllowed:
          cpu: 500m
          memory: 768Mi
        maxAllowed:
          cpu: "4"
          memory: 4Gi
        controlledResources:
          - cpu
          - memory
        controlledValues: RequestsAndLimits
  recommenders:
    - name: default

# Catalog Service (Node.js) — HIGH OOM RISK
# V8 heap + libuv threadpool + search index cache + connection pools
# Current deployment: 128Mi request / 512Mi limit (UNDERSIZED)
# Performance budget target: 256Mi request / 1Gi limit
# Node.js needs headroom for V8 garbage collection and I/O buffers
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: catalog-vpa-oom
  namespace: production
  labels:
