# ---------------------------------------------------------------------------
# Topology Spread Constraints — Production Overlay
# ---------------------------------------------------------------------------
# Ensures pods are evenly distributed across availability zones for high
# availability. This is the production-grade configuration that satisfies
# the production readiness review requirement.
# ---------------------------------------------------------------------------
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
spec:
  template:
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: gateway
