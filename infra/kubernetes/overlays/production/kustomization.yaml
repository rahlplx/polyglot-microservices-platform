apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: production-overlay
resources:
- ../../base
- ../../platform
namespace: production
commonLabels:
  environment: production
  app.kubernetes.io/environment: production
images:
- name: gateway
  newName: ghcr.io/example/gateway
  newTag: v1.0.0
- name: identity
  newName: ghcr.io/example/identity
  newTag: v1.0.0
- name: catalog
  newName: ghcr.io/example/catalog
  newTag: v1.0.0
- name: order
  newName: ghcr.io/example/order
  newTag: v1.0.0
- name: payment
  newName: ghcr.io/example/payment
  newTag: v1.0.0
- name: notification
  newName: ghcr.io/example/notification
  newTag: v1.0.0
- name: analytics
  newName: ghcr.io/example/analytics
  newTag: v1.0.0
- name: cdc-relay
  newName: ghcr.io/example/cdc-relay
  newTag: v1.0.0
- name: schema-registry
  newName: ghcr.io/example/schema-registry
  newTag: v1.0.0
configMapGenerator:
- name: environment-config
  literals:
  - LOG_LEVEL=INFO
  - OTEL_TRACES_SAMPLER=parentbased_traceidratio
  - OTEL_TRACES_SAMPLER_ARG=0.1
  - OTEL_METRICS_EXPORT_INTERVAL=15000
  - SPIRE_TRUST_DOMAIN=trust.example.org
  behavior: create
patchesJson6902:
- target:
    group: apps
    version: v1
    kind: Deployment
    name: gateway
  patch: "- op: add\n  path: /spec/template/spec/containers/0/envFrom\n  value:\n\
    \    - configMapRef:\n        name: environment-config\n"
- target:
    group: apps
    version: v1
    kind: Deployment
    name: identity
  patch: "- op: add\n  path: /spec/template/spec/containers/0/envFrom\n  value:\n\
    \    - configMapRef:\n        name: environment-config\n"
- target:
    group: apps
    version: v1
    kind: Deployment
    name: catalog
  patch: "- op: add\n  path: /spec/template/spec/containers/0/envFrom\n  value:\n\
    \    - configMapRef:\n        name: environment-config\n"
- target:
    group: apps
    version: v1
    kind: Deployment
    name: order
  patch: "- op: add\n  path: /spec/template/spec/containers/0/envFrom\n  value:\n\
    \    - configMapRef:\n        name: environment-config\n"
- target:
    group: apps
    version: v1
    kind: Deployment
    name: payment
  patch: "- op: add\n  path: /spec/template/spec/containers/0/envFrom\n  value:\n\
    \    - configMapRef:\n        name: environment-config\n"
- target:
    group: apps
    version: v1
    kind: Deployment
    name: notification
  patch: "- op: add\n  path: /spec/template/spec/containers/0/envFrom\n  value:\n\
    \    - configMapRef:\n        name: environment-config\n"
- target:
    group: apps
    version: v1
    kind: Deployment
    name: analytics
  patch: "- op: add\n  path: /spec/template/spec/containers/0/envFrom\n  value:\n\
    \    - configMapRef:\n        name: environment-config\n"
- target:
    group: apps
    version: v1
    kind: Deployment
    name: cdc-relay
  patch: "- op: add\n  path: /spec/template/spec/containers/0/envFrom\n  value:\n\
    \    - configMapRef:\n        name: environment-config\n"
- target:
    group: apps
    version: v1
    kind: Deployment
    name: schema-registry
  patch: "- op: add\n  path: /spec/template/spec/containers/0/envFrom\n  value:\n\
    \    - configMapRef:\n        name: environment-config\n"
