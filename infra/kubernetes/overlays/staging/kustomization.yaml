apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: staging-overlay
resources:
- ../../base
- ../../platform
namespace: production
commonLabels:
  environment: staging
  app.kubernetes.io/environment: staging
images:
- name: gateway
  newName: ghcr.io/example/gateway
  newTag: rc
- name: identity
  newName: ghcr.io/example/identity
  newTag: rc
- name: catalog
  newName: ghcr.io/example/catalog
  newTag: rc
- name: order
  newName: ghcr.io/example/order
  newTag: rc
- name: payment
  newName: ghcr.io/example/payment
  newTag: rc
- name: notification
  newName: ghcr.io/example/notification
  newTag: rc
- name: analytics
  newName: ghcr.io/example/analytics
  newTag: rc
- name: cdc-relay
  newName: ghcr.io/example/cdc-relay
  newTag: rc
- name: schema-registry
  newName: ghcr.io/example/schema-registry
  newTag: rc
configMapGenerator:
- name: environment-config
  literals:
  - LOG_LEVEL=INFO
  - OTEL_TRACES_SAMPLER=parentbased_traceidratio
  - OTEL_TRACES_SAMPLER_ARG=0.5
  - OTEL_METRICS_EXPORT_INTERVAL=15000
  - SPIRE_TRUST_DOMAIN=trust.staging.example.org
  behavior: create
