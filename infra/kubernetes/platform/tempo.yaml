# Tempo StatefulSet — 2 replicas, HA
# Receives OTLP traces from OTel Gateway (gRPC 4317 / HTTP 4318)
# 30-day retention, 100Gi PVC per replica, search enabled
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tempo-config
  namespace: production
  labels:
    app.kubernetes.io/name: tempo
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: polyglot-microservices
data:
  tempo.yaml: |
    server:
      http_listen_port: 3200
      grpc_listen_port: 9095
      log_level: info

    distributor:
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
              max_recv_msg_size_mib: 32
            http:
              endpoint: 0.0.0.0:4318

    ingester:
      max_block_duration: 5m
      max_block_bytes: 104857600
      trace_idle_period: 30s

    compactor:
      compaction:
        block_retention: 720h          # 30 days
        compaction_window: 1h
        max_compaction_objects: 6000000
        compaction_concurrency: 1

    storage:
      trace:
        backend: local
        local:
          path: /var/tempo/traces
        wal:
          path: /var/tempo/wal
        pool:
          max_workers: 100
          queue_depth: 10000

    metrics_generator:
      registry:
        external_labels:
          source: tempo
          cluster: polyglot-production
      storage:
        path: /var/tempo/generator/wal
        remote_write:
          - url: http://prometheus.production.svc.cluster.local:9090/api/v1/write
            send_exemplars: true

    search_enabled: true

    querier:
      max_search_duration: 0s

    query_frontend:
      search:
        duration_slo: true
        throughput_bytes_slo: true

    overrides:
      defaults:
        metrics_generator:
          processors: [service-graphs, span-metrics]

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: tempo
  namespace: production
  labels:
    app.kubernetes.io/name: tempo
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: polyglot-microservices
    app.kubernetes.io/managed-by: argocd
spec:
  replicas: 2
  serviceName: tempo
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: tempo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tempo
        app.kubernetes.io/component: observability
        app.kubernetes.io/part-of: polyglot-microservices
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3200"
    spec:
      serviceAccountName: tempo
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/name
                      operator: In
                      values:
                        - tempo
                topologyKey: topology.kubernetes.io/zone
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app.kubernetes.io/name
                    operator: In
                    values:
                      - tempo
              topologyKey: kubernetes.io/hostname
      containers:
        - name: tempo
          image: grafana/tempo:2.3.1
          args:
            - -config.file=/etc/tempo/tempo.yaml
            - -storage.trace.backend=local
          ports:
            - name: otlp-grpc
              containerPort: 4317
              protocol: TCP
            - name: otlp-http
              containerPort: 4318
              protocol: TCP
            - name: http
              containerPort: 3200
              protocol: TCP
            - name: grpc
              containerPort: 9095
              protocol: TCP
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          volumeMounts:
            - name: config
              mountPath: /etc/tempo
            - name: data
              mountPath: /var/tempo
          livenessProbe:
            httpGet:
              path: /ready
              port: 3200
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: 3200
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
      securityContext:
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: config
          configMap:
            name: tempo-config
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: standard
        resources:
          requests:
            storage: 100Gi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tempo
  namespace: production
  labels:
    app.kubernetes.io/name: tempo
    app.kubernetes.io/part-of: polyglot-microservices
  annotations:
    spiffe.io/spiffe-id: spiffe://trust.example.org/ns/production/sa/tempo
---
apiVersion: v1
kind: Service
metadata:
  name: tempo
  namespace: production
  labels:
    app.kubernetes.io/name: tempo
    app.kubernetes.io/part-of: polyglot-microservices
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: tempo
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
      protocol: TCP
    - name: otlp-http
      port: 4318
      targetPort: 4318
      protocol: TCP
    - name: http
      port: 3200
      targetPort: 3200
      protocol: TCP
    - name: grpc
      port: 9095
      targetPort: 9095
      protocol: TCP
