# Debezium Connect Deployment — WAL capture for PostgreSQL outbox
# Captures changes from PostgreSQL WAL and publishes to Kafka topics
# Used for CDC pipeline: Order Outbox → Debezium → Kafka → Consumers
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: debezium-config
  namespace: production
  labels:
    app.kubernetes.io/name: debezium
    app.kubernetes.io/component: cdc
    app.kubernetes.io/part-of: polyglot-microservices
data:
  CONNECT_BOOTSTRAP_SERVERS: "kafka-0.kafka.production.svc.cluster.local:9092,kafka-1.kafka.production.svc.cluster.local:9092,kafka-2.kafka.production.svc.cluster.local:9092"
  CONNECT_GROUP_ID: "debezium-connect-cluster"
  CONNECT_CONFIG_STORAGE_TOPIC: "debezium-connect-configs"
  CONNECT_OFFSET_STORAGE_TOPIC: "debezium-connect-offsets"
  CONNECT_STATUS_STORAGE_TOPIC: "debezium-connect-status"
  CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: "3"
  CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: "3"
  CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: "3"
  CONNECT_KEY_CONVERTER: "io.confluent.connect.protobuf.ProtobufConverter"
  CONNECT_VALUE_CONVERTER: "io.confluent.connect.protobuf.ProtobufConverter"
  CONNECT_KEY_CONVERTER_SCHEMA_REGISTRY_URL: "http://schema-registry.production.svc.cluster.local:8081"
  CONNECT_VALUE_CONVERTER_SCHEMA_REGISTRY_URL: "http://schema-registry.production.svc.cluster.local:8081"
  CONNECT_INTERNAL_KEY_CONVERTER: "org.apache.kafka.connect.json.JsonConverter"
  CONNECT_INTERNAL_VALUE_CONVERTER: "org.apache.kafka.connect.json.JsonConverter"
  CONNECT_REST_ADVERTISED_HOST_NAME: "debezium.production.svc.cluster.local"
  CONNECT_LOG4J_ROOT_LOGLEVEL: "INFO"
  CONNECT_LOG4J_LOGGERS: "io.debezium=INFO,org.apache.kafka.connect=INFO"
  CONNECT_PLUGIN_PATH: "/kafka/connect"
  # Debezium-specific settings
  DATABASE_SERVER_NAME: "production-postgres"
  DATABASE_HISTORY_KAFKA_BOOTSTRAP_SERVERS: "kafka-0.kafka.production.svc.cluster.local:9092,kafka-1.kafka.production.svc.cluster.local:9092,kafka-2.kafka.production.svc.cluster.local:9092"
  DATABASE_HISTORY_KAFKA_TOPIC: "schema-changes.production"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: debezium
  namespace: production
  labels:
    app.kubernetes.io/name: debezium
    app.kubernetes.io/component: cdc
    app.kubernetes.io/part-of: polyglot-microservices
    app.kubernetes.io/managed-by: argocd
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: debezium
  template:
    metadata:
      labels:
        app.kubernetes.io/name: debezium
        app.kubernetes.io/component: cdc
        app.kubernetes.io/part-of: polyglot-microservices
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9308"
    spec:
      serviceAccountName: cdc-relay
      containers:
        - name: debezium
          image: debezium/connect:2.5.0.Final
          envFrom:
            - configMapRef:
                name: debezium-config
          env:
            - name: CONNECT_REST_PORT
              value: "8083"
            # PostgreSQL connection (via SPIFFE mTLS sidecar)
            - name: POSTGRES_HOST
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: host
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: password
            - name: POSTGRES_DB
              value: "production"
          ports:
            - name: rest-api
              containerPort: 8083
              protocol: TCP
            - name: jmx
              containerPort: 9308
              protocol: TCP
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          livenessProbe:
            httpGet:
              path: /
              port: 8083
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /connectors
              port: 8083
            initialDelaySeconds: 30
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
        # JMX Exporter sidecar for OTel metrics
        - name: jmx-exporter
          image: bitnami/jmx-exporter:0.20.0
          args:
            - "9308"
            - "/etc/jmx-exporter/config.yaml"
          ports:
            - name: metrics
              containerPort: 9308
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: jmx-config
              mountPath: /etc/jmx-exporter
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
      volumes:
        - name: jmx-config
          configMap:
            name: debezium-jmx-config
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: debezium-jmx-config
  namespace: production
  labels:
    app.kubernetes.io/name: debezium
    app.kubernetes.io/part-of: polyglot-microservices
data:
  config.yaml: |
    hostPort: localhost:9308
    lowercaseOutputName: true
    rules:
      - pattern: "kafka.connect<type=(connect-worker-metrics)><>([^:]+)"
        name: "kafka_connect_$1_$2"
        type: GAUGE
      - pattern: "kafka.connect<type=(connector-metrics), connector=([^>]+)><>([^:]+)"
        name: "kafka_connect_$1_$3"
        labels:
          connector: "$2"
        type: GAUGE
      - pattern: "debezium<type=(connector-metrics), context=([^>]+), server=([^>]+)><>([^:]+)"
        name: "debezium_$1_$3"
        labels:
          context: "$2"
          server: "$3"
        type: GAUGE
---
apiVersion: v1
kind: Service
metadata:
  name: debezium
  namespace: production
  labels:
    app.kubernetes.io/name: debezium
    app.kubernetes.io/part-of: polyglot-microservices
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: debezium
  ports:
    - name: rest-api
      port: 8083
      targetPort: 8083
      protocol: TCP
    - name: metrics
      port: 9308
      targetPort: 9308
      protocol: TCP
