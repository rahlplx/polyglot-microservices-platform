# OTel Collector Gateway Deployment — 2 replicas, HA
# Receivers: OTLP/gRPC from DaemonSet collectors
# Processors: batch, resource, retry
# Exporters: Prometheus (metrics), Tempo (traces), Loki (logs)
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-gateway-config
  namespace: production
  labels:
    app.kubernetes.io/name: otel-gateway
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: polyglot-microservices
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
            max_recv_msg_size_mib: 32
          http:
            endpoint: 0.0.0.0:4318

    processors:
      batch:
        send_batch_size: 16384
        send_batch_max_size: 32768
        timeout: 10s

      resource:
        attributes:
          - key: collector.source
            value: "gateway"
            action: upsert

      memory_limiter:
        check_interval: 5s
        limit_percentage: 80
        spike_limit_percentage: 25

      retry:
        initial_interval: 5s
        max_interval: 30s
        max_elapsed_time: 300s

    exporters:
      prometheus:
        endpoint: 0.0.0.0:8889
        namespace: polyglot
        const_labels:
          environment: production

      otlp/tempo:
        endpoint: tempo.production.svc.cluster.local:4317
        tls:
          ca_file: /etc/spire/certs/bundle.crt
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_interval: 30s
          max_elapsed_time: 300s
        sending_queue:
          enabled: true
          num_consumers: 20
          queue_size: 10000

      loki:
        endpoint: http://loki.production.svc.cluster.local:3100/loki/api/v1/push
        default_labels_enabled:
          exporter: false
        tls:
          ca_file: /etc/spire/certs/bundle.crt

    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch, resource]
          exporters: [otlp/tempo]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, batch, resource]
          exporters: [prometheus]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, batch, resource]
          exporters: [loki]

      telemetry:
        logs:
          level: info
        metrics:
          address: 0.0.0.0:8888

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-gateway
  namespace: production
  labels:
    app.kubernetes.io/name: otel-gateway
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: polyglot-microservices
    app.kubernetes.io/managed-by: argocd
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: otel-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: otel-gateway
        app.kubernetes.io/component: observability
        app.kubernetes.io/part-of: polyglot-microservices
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8889"
    spec:
      serviceAccountName: otel-gateway
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/name
                      operator: In
                      values:
                        - otel-gateway
                topologyKey: topology.kubernetes.io/zone
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app.kubernetes.io/name
                    operator: In
                    values:
                      - otel-gateway
              topologyKey: kubernetes.io/hostname
      containers:
        - name: otel-gateway
          image: otel/opentelemetry-collector-contrib:0.96.0
          args:
            - --config=/etc/otelcol/config.yaml
          ports:
            - name: otlp-grpc
              containerPort: 4317
              protocol: TCP
            - name: otlp-http
              containerPort: 4318
              protocol: TCP
            - name: metrics
              containerPort: 8889
              protocol: TCP
            - name: telemetry
              containerPort: 8888
              protocol: TCP
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          env:
            - name: GOMEMLIMIT
              value: "3200MiB"
            - name: GOMAXPROCS
              value: "2"
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol
            - name: spire-certs
              mountPath: /etc/spire/certs
              readOnly: true
          livenessProbe:
            httpGet:
              path: /
              port: 13133
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 13133
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: config
          configMap:
            name: otel-gateway-config
        - name: spire-certs
          projected:
            sources:
              - configMap:
                  name: spire-bundle
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: otel-gateway
  namespace: production
  labels:
    app.kubernetes.io/name: otel-gateway
    app.kubernetes.io/part-of: polyglot-microservices
  annotations:
    spiffe.io/spiffe-id: spiffe://trust.example.org/ns/production/sa/otel-gateway
---
apiVersion: v1
kind: Service
metadata:
  name: otel-gateway
  namespace: production
  labels:
    app.kubernetes.io/name: otel-gateway
    app.kubernetes.io/part-of: polyglot-microservices
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: otel-gateway
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
      protocol: TCP
    - name: otlp-http
      port: 4318
      targetPort: 4318
      protocol: TCP
    - name: metrics
      port: 8889
      targetPort: 8889
      protocol: TCP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: otel-gateway
  namespace: production
  labels:
    app.kubernetes.io/name: otel-gateway
    app.kubernetes.io/part-of: polyglot-microservices
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: otel-gateway
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
