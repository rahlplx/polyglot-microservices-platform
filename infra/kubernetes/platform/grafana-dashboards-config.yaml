# Grafana Dashboard ConfigMap — generated from source JSON files via Kustomize configMapGenerator
# The source of truth is the JSON files in infra/kubernetes/platform/grafana-dashboards/
# This manifest is intentionally minimal; the ConfigMap is generated by kustomization.yaml
# using configMapGenerator with the files key, which eliminates the duplication risk.
#
# DO NOT edit this file directly. Add/modify dashboards in grafana-dashboards/ directory.
---
apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/component: observability
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: polyglot-microservices
  name: grafana-dashboards-config
  namespace: production
data: {}
# NOTE: This ConfigMap is populated by Kustomize configMapGenerator.
# The generator reads from infra/kubernetes/platform/grafana-dashboards/*.json
# and injects the dashboard JSON as data keys. See the kustomization.yaml
# in infra/kubernetes/platform/ for the configMapGenerator definition.
# This ensures the JSON files are the single source of truth and eliminates
# the duplication that existed when dashboard JSON was inline here AND in
# the grafana-dashboards/ directory.
