  slo-error-budget.json: "{\n  \"annotations\": {\n    \"list\": [\n      {\n        \"builtIn\": 1,\n        \"datasource\": { \"type\": \"grafana\", \"uid\": \"-- Grafana --\" },\n        \"enable\": true,\n        \"hide\": true,\n        \"iconColor\": \"rgba(0, 211, 255, 1)\",\n        \"name\": \"Annotations & Alerts\",\n        \"type\": \"dashboard\"\n      }\n    ]\n  },\n  \"description\": \"SLO Error Budget tracking for the polyglot microservices platform \u2014 burn rate, remaining budget, SLI trends\",\n  \"editable\": false,\n  \"fiscalYearStartMonth\": 0,\n  \"graphTooltip\": 1,\n  \"id\": null,\n  \"links\": [\n    {\n      \"title\": \"RED Metrics\",\n      \"url\": \"/d/red-metrics-overview\",\n      \"type\": \"dashboard\"\n    },\n    {\n      \"title\": \"USE Metrics\",\n      \"url\": \"/d/use-metrics-infrastructure\",\n      \"type\": \"dashboard\"\n    }\n  ],\n  \"liveNow\": true,\n  \"panels\": [\n    {\n      \"title\": \"Error Budget Remaining (%)\",\n      \"description\": \"Remaining error budget per service over the 30-day SLO window. 99.9% SLO = 0.1% error budget per month. When this reaches 0%, the SLO is violated.\",\n      \"type\": \"gauge\",\n      \"gridPos\": { \"h\": 8, \"w\": 6, \"x\": 0, \"y\": 0 },\n      \"id\": 1,\n      \"datasource\": { \"type\": \"prometheus\", \"uid\": \"prometheus\" },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"color\": { \"mode\": \"thresholds\" },\n          \"min\": 0,\n          \"max\": 100,\n          \"unit\": \"percent\",\n          \"decimals\": 2,\n          \"thresholds\": {\n            \"mode\": \"absolute\",\n            \"steps\": [\n              { \"color\": \"red\", \"value\": null },\n              { \"color\": \"orange\", \"value\": 10 },\n              { \"color\": \"yellow\", \"value\": 30 },\n              { \"color\": \"green\", \"value\": 60 }\n            ]\n          }\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"orientation\": \"auto\",\n        \"reduceOptions\": { \"calcs\": [\"lastNotNull\"], \"fields\": \"\", \"values\": false },\n        \"showThresholdLabels\": false,\n        \"showThresholdMarkers\": true\n      },\n      \"targets\": [\n        {\n          \"expr\": \"100 * (1 - (\\n  sum(rate(http_server_duration_count{http.status_code=~\\\"5..\\\"}[30d])) by (service.name)\\n  /\\n  sum(rate(http_server_duration_count[30d])) by (service.name)\\n) / 0.001)\",\n          \"legendFormat\": \"{{service.name}}\",\n          \"refId\": \"A\"\n        }\n      ]\n    },\n    {\n      \"title\": \"Error Budget Burn Rate\",\n      \"description\": \"Current burn rate of the error budget. A burn rate of 1 means consuming the budget at exactly the SLO rate. >1 means consuming faster than allowed. Fast burn (>14.4x) triggers immediate page.\",\n      \"type\": \"timeseries\",\n      \"gridPos\": { \"h\": 8, \"w\": 12, \"x\": 6, \"y\": 0 },\n      \"id\": 2,\n      \"datasource\": { \"type\": \"prometheus\", \"uid\": \"prometheus\" },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"color\": { \"mode\": \"palette-classic\" },\n          \"custom\": {\n            \"axisCenteredZero\": false,\n            \"axisColorMode\": \"text\",\n            \"axisLabel\": \"Burn Rate (x)\",\n            \"axisPlacement\": \"auto\",\n            \"barAlignment\": 0,\n            \"drawStyle\": \"line\",\n            \"fillOpacity\": 20,\n            \"gradientMode\": \"scheme\",\n            \"lineInterpolation\": \"smooth\",\n            \"lineWidth\": 2,\n            \"showPoints\": \"never\",\n            \"spanNulls\": false,\n            \"stacking\": { \"mode\": \"none\" },\n            \"thresholdsStyle\": { \"mode\": \"area\" }\n          },\n          \"unit\": \"short\",\n          \"decimals\": 1,\n          \"thresholds\": {\n            \"mode\": \"absolute\",\n            \"steps\": [\n              { \"color\": \"transparent\", \"value\": null },\n             