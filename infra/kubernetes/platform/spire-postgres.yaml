# SPIRE PostgreSQL — HA database backend for SPIRE Server
# Replaces SQLite for multi-replica StatefulSet consistency.
# In production, replace with managed PostgreSQL (RDS/CloudSQL/Azure DB)
# using the Terraform database module.
---
apiVersion: v1
kind: Secret
metadata:
  name: spire-postgres
  namespace: production
  labels:
    app.kubernetes.io/name: spire-postgres
    app.kubernetes.io/component: identity
    app.kubernetes.io/part-of: polyglot-microservices
type: Opaque
stringData:
  POSTGRES_DB: "spire"
  POSTGRES_USER: "spire"
  POSTGRES_PASSWORD: "Ch4ng3M3!sp1r3_h4_pr0d"
  connection-string: "host=spire-postgres.production.svc.cluster.local port=5432 dbname=spire user=spire password=Ch4ng3M3!sp1r3_h4_pr0d sslmode=disable"
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: spire-postgres
  namespace: production
  labels:
    app.kubernetes.io/name: spire-postgres
    app.kubernetes.io/component: identity
    app.kubernetes.io/part-of: polyglot-microservices
    app.kubernetes.io/managed-by: argocd
spec:
  replicas: 1
  serviceName: spire-postgres
  selector:
    matchLabels:
      app.kubernetes.io/name: spire-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: spire-postgres
        app.kubernetes.io/component: identity
        app.kubernetes.io/part-of: polyglot-microservices
    spec:
      securityContext:
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: spire-postgres
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: spire-postgres
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: spire-postgres
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - spire
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - spire
            initialDelaySeconds: 5
            periodSeconds: 5
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: standard
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: spire-postgres
  namespace: production
  labels:
    app.kubernetes.io/name: spire-postgres
    app.kubernetes.io/part-of: polyglot-microservices
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: spire-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      protocol: TCP
