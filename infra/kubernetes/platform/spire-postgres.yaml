# SPIRE PostgreSQL — HA database backend for SPIRE Server
# Replaces SQLite for multi-replica StatefulSet consistency.
# In production, replace with managed PostgreSQL (RDS/CloudSQL/Azure DB)
# using the Terraform database module.
---
apiVersion: v1
kind: Secret
metadata:
  name: spire-postgres
  namespace: production
  labels:
    app.kubernetes.io/name: spire-postgres
    app.kubernetes.io/component: identity
    app.kubernetes.io/part-of: polyglot-microservices
type: Opaque
stringData:
  POSTGRES_DB: "spire"
  POSTGRES_USER: "spire"
  POSTGRES_PASSWORD: "CHANGE_ME_IN_PRODUCTION_USE_VAULT_OR_SEALED_SECRETS"
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: spire-postgres
  namespace: production
  labels:
    app.kubernetes.io/name: spire-postgres
    app.kubernetes.io/component: identity
    app.kubernetes.io/part-of: polyglot-microservices
    app.kubernetes.io/managed-by: argocd
spec:
  replicas: 1
  serviceName: spire-postgres
  selector:
    matchLabels:
      app.kubernetes.io/name: spire-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: spire-postgres
        app.kubernetes.io/component: identity
        app.kubernetes.io/part-of: polyglot-microservices
    spec:
      securityContext:
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: spire-postgres
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: spire-postgres
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: spire-postgres
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - spire
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - spire
            initialDelaySeconds: 5
            periodSeconds: 5
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: standard
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: spire-postgres
  namespace: production
  labels:
    app.kubernetes.io/name: spire-postgres
    app.kubernetes.io/part-of: polyglot-microservices
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: spire-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      protocol: TCP
---
# PostgreSQL Backup CronJob — daily pg_dump for disaster recovery
# Retains 7 days of backups; in production, push to S3/GCS via sidecar
apiVersion: batch/v1
kind: CronJob
metadata:
  name: spire-postgres-backup
  namespace: production
  labels:
    app.kubernetes.io/name: spire-postgres
    app.kubernetes.io/component: identity
    app.kubernetes.io/part-of: polyglot-microservices
spec:
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 3
      template:
        metadata:
          labels:
            app.kubernetes.io/name: spire-postgres-backup
        spec:
          restartPolicy: OnFailure
          securityContext:
            fsGroup: 999
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: pg-dump
              image: postgres:16-alpine
              command:
                - /bin/sh
                - -c
                - |
                  BACKUP_FILE="/backup/spire-$(date +%Y%m%d-%H%M%S).sql.gz"
                  pg_dump -h spire-postgres.production.svc.cluster.local \
                    -U spire -d spire | gzip > "$BACKUP_FILE"
                  echo "Backup completed: $BACKUP_FILE"
                  # Cleanup backups older than 7 days
                  find /backup -name "spire-*.sql.gz" -mtime +7 -delete
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: spire-postgres
                      key: POSTGRES_PASSWORD
              volumeMounts:
                - name: backup
                  mountPath: /backup
              securityContext:
                runAsNonRoot: true
                runAsUser: 999
                runAsGroup: 999
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                seccompProfile:
                  type: RuntimeDefault
          volumes:
            - name: backup
              persistentVolumeClaim:
                claimName: spire-postgres-backup
