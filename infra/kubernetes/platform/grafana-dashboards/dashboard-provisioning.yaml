# Grafana Dashboard Provisioning Configuration
# Points Grafana to the dashboards directory for automatic discovery
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provisioning
  namespace: production
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: polyglot-microservices
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: polyglot-dashboards
        orgId: 1
        folder: Polyglot Microservices
        folderUid: polyglot-microservices
        type: file
        disableDeletion: true
        updateIntervalSeconds: 30
        allowUiUpdates: false
        options:
          path: /var/lib/grafana/dashboards
          foldersFromFilesStructure: false
