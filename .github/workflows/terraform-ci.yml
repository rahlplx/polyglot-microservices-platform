# ---------------------------------------------------------------------------
# Terraform CI — Polyglot Microservices Platform
# ---------------------------------------------------------------------------
# Triggers: PRs on infra/terraform/**
# Jobs:
#   1. terraform-fmt      — Format check
#   2. terraform-validate — Syntax + semantic validation
#   3. tflint             — Terraform linter
#   4. tfsec              — Security scan
#   5. terraform-plan     — Plan generation (comment on PR)
# ---------------------------------------------------------------------------
name: Terraform CI

on:
  pull_request:
    paths:
      - 'infra/terraform/**'
    branches:
      - develop
      - main

permissions:
  contents: read
  pull-requests: write

env:
  TF_VERSION: "1.7.0"
  TFLINT_VERSION: "v0.50.0"
  TFSEC_VERSION: "v1.28.4"

jobs:
  # =========================================================================
  # 1. Terraform Format Check
  # =========================================================================
  terraform-fmt:
    name: "Terraform Fmt"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format Check
        run: terraform fmt -check -recursive -diff

  # =========================================================================
  # 2. Terraform Validate
  # =========================================================================
  terraform-validate:
    name: "Terraform Validate"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate -no-color

  # =========================================================================
  # 3. TFLint — Terraform linter
  # =========================================================================
  tflint:
    name: "TFLint"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}

      - name: Init TFLint
        run: tflint --init

      - name: Run TFLint
        run: tflint --recursive --format compact

  # =========================================================================
  # 4. tfsec — Security scan
  # =========================================================================
  tfsec:
    name: "tfsec"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1.0.0
        with:
          working_directory: infra/terraform
          soft_fail: false
          additional_args: --format sarif --out tfsec-results.sarif

      - name: Upload tfsec SARIF results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: infra/terraform/tfsec-results.sarif

  # =========================================================================
  # 5. Terraform Plan — generates plan and comments on PR
  # =========================================================================
  terraform-plan:
    name: "Terraform Plan"
    runs-on: ubuntu-latest
    needs: [terraform-fmt, terraform-validate, tflint, tfsec]
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan -no-color -input=false -out=tfplan 2>&1 | tee plan_output.txt
          terraform show -no-color tfplan > plan_human.txt 2>/dev/null || true

      - name: Comment PR with plan
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const planOutput = fs.readFileSync('infra/terraform/plan_output.txt', 'utf8');

            // Truncate if too long for a comment
            const MAX_LENGTH = 60000;
            const output = planOutput.length > MAX_LENGTH
              ? planOutput.substring(0, MAX_LENGTH) + '\n\n... (truncated)'
              : planOutput;

            const body = `## Terraform Plan\n\`\`\`hcl\n${output}\n\`\`\``;

            // Find existing comment
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existingComment = comments.data.find(c =>
              c.user.login === 'github-actions[bot]' && c.body.startsWith('## Terraform Plan')
            );

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }

      - name: Upload plan artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: |
            infra/terraform/tfplan
            infra/terraform/plan_output.txt
          retention-days: 7
