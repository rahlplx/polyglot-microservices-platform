name: RL Review Gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'services/**'
      - 'infra/**'
      - '.claude/engine/**'

permissions:
  contents: read
  pull-requests: write
  checks: write

env:
  CONFIDENCE_THRESHOLD: '0.95'
  BLOCK_ON_SEVERITY: 'CRITICAL'

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Job 1: RL Knowledge Base Validation
  # ─────────────────────────────────────────────────────────────────────────────
  validate-knowledge-base:
    name: Validate RL Knowledge Base
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate knowledge base completeness
        run: |
          echo "### RL Knowledge Base Validation" >> "$GITHUB_STEP_SUMMARY"
          python3 .claude/engine/knowledge_matcher.py --validate 2>&1 | tee kb-validation.txt

          # Check exit code — exits 1 if coverage < 80%
          if [ $? -ne 0 ]; then
            echo "::warning::Knowledge base coverage below 80% threshold"
          fi

          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat kb-validation.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 2: Scan Changed Files
  # ─────────────────────────────────────────────────────────────────────────────
  scan-changes:
    name: Scan PR Changes
    needs: [validate-knowledge-base]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v44
        with:
          since_last_remote_commit: true
          separator: ' '

      - name: Run RL knowledge matcher
        id: rl-scan
        run: |
          CHANGED="${{ steps.changed-files.outputs.all_changed_files }}"

          if [ -z "$CHANGED" ]; then
            echo "No changed files to scan"
            echo "has_findings=false" >> "$GITHUB_OUTPUT"
            echo "critical_count=0" >> "$GITHUB_OUTPUT"
            echo "high_count=0" >> "$GITHUB_OUTPUT"
            echo "blocking=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Run scan with JSON output
          python3 .claude/engine/knowledge_matcher.py --scan-diff --json $CHANGED > rl-findings.json 2>&1 || true

          # Parse findings
          TOTAL=$(jq '.total_findings // 0' rl-findings.json)
          CRITICAL=$(jq '.critical_count // 0' rl-findings.json)
          HIGH=$(jq '.high_count // 0' rl-findings.json)
          MEDIUM=$(jq '.medium_count // 0' rl-findings.json)
          LOW=$(jq '.low_count // 0' rl-findings.json)
          FILES_SCANNED=$(jq '.files_scanned // 0' rl-findings.json)

          echo "total_findings=$TOTAL" >> "$GITHUB_OUTPUT"
          echo "critical_count=$CRITICAL" >> "$GITHUB_OUTPUT"
          echo "high_count=$HIGH" >> "$GITHUB_OUTPUT"
          echo "medium_count=$MEDIUM" >> "$GITHUB_OUTPUT"
          echo "low_count=$LOW" >> "$GITHUB_OUTPUT"
          echo "files_scanned=$FILES_SCANNED" >> "$GITHUB_OUTPUT"

          if [ "$TOTAL" -gt 0 ]; then
            echo "has_findings=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_findings=false" >> "$GITHUB_OUTPUT"
          fi

          # Determine if merge should be blocked
          # Block on CRITICAL findings with high confidence (confidence > threshold)
          BLOCKING=false
          if [ "$CRITICAL" -gt 0 ]; then
            # Check each critical finding for confidence threshold
            CRITICAL_BLOCKING=$(jq --arg threshold "$CONFIDENCE_THRESHOLD" \
              '[.findings[] | select(.severity == "CRITICAL")] | length' rl-findings.json)

            if [ "$CRITICAL_BLOCKING" -gt 0 ]; then
              BLOCKING=true
              echo "::error::RL Review Gate: $CRITICAL_BLOCKING CRITICAL finding(s) exceed confidence threshold ($CONFIDENCE_THRESHOLD)"
            fi
          fi

          echo "blocking=$BLOCKING" >> "$GITHUB_OUTPUT"

          # Generate summary
          echo "### RL Pattern Scanner Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Metric | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|--------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Files Scanned | $FILES_SCANNED |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Total Findings | $TOTAL |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Critical | $CRITICAL |" >> "$GITHUB_STEP_SUMMARY"
          echo "| High | $HIGH |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Medium | $MEDIUM |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Low | $LOW |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Merge Blocked | $BLOCKING |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Confidence Threshold | $CONFIDENCE_THRESHOLD |" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload RL findings artifact
        if: steps.rl-scan.outputs.has_findings == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: rl-findings
          path: rl-findings.json
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 3: Comment Findings on PR
  # ─────────────────────────────────────────────────────────────────────────────
  comment-findings:
    name: Comment Findings on PR
    needs: [scan-changes]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: needs.scan-changes.outputs.has_findings == 'true'
    steps:
      - name: Download RL findings
        uses: actions/download-artifact@v4
        with:
          name: rl-findings

      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let findings;
            try {
              findings = JSON.parse(fs.readFileSync('rl-findings.json', 'utf8'));
            } catch (e) {
              console.log('Could not parse RL findings JSON');
              return;
            }

            const severityIcons = {
              'CRITICAL': '🔴',
              'HIGH': '🟠',
              'MEDIUM': '🟡',
              'LOW': '🟢'
            };

            let body = '## 🔍 RL Review Gate — Pattern Scanner Results\n\n';
            body += `**Files Scanned:** ${findings.files_scanned} | **Total Findings:** ${findings.total_findings}\n\n`;

            if (findings.findings && findings.findings.length > 0) {
              body += '| Severity | Pattern | File | Description | Fix |\n';
              body += '|----------|---------|------|-------------|-----|\n';

              for (const f of findings.findings) {
                const icon = severityIcons[f.severity] || '⚪';
                const relPath = f.file.split('/').slice(-3).join('/');
                body += `| ${icon} ${f.severity} | \`${f.signature}\` | ${relPath} | ${f.description} | ${f.fix} |\n`;
              }
            }

            body += `\n---\n`;
            body += `**Summary:** 🔴 ${findings.critical_count} Critical | 🟠 ${findings.high_count} High | 🟡 ${findings.medium_count} Medium | 🟢 ${findings.low_count} Low\n\n`;

            if (findings.critical_count > 0) {
              body += `> ⛔ **MERGE BLOCKED**: ${findings.critical_count} CRITICAL finding(s) detected with confidence > ${process.env.CONFIDENCE_THRESHOLD}. `;
              body += `Please resolve these issues before merging.\n\n`;
              body += `### Recommended Actions\n`;
              for (const f of (findings.findings || []).filter(f => f.severity === 'CRITICAL')) {
                body += `- **${f.signature}**: ${f.fix}\n`;
              }
            } else if (findings.high_count > 0) {
              body += `> ⚠️ **Warning**: ${findings.high_count} HIGH finding(s) detected. Review recommended before merging.\n`;
            } else {
              body += `> ✅ No blocking findings. Review the medium/low findings at your discretion.\n`;
            }

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 4: Gate Decision
  # ─────────────────────────────────────────────────────────────────────────────
  gate:
    name: RL Review Gate Decision
    needs: [scan-changes]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    if: always()
    steps:
      - name: Evaluate gate
        run: |
          echo "### RL Review Gate Decision" >> "$GITHUB_STEP_SUMMARY"

          BLOCKING="${{ needs.scan-changes.outputs.blocking }}"
          CRITICAL="${{ needs.scan-changes.outputs.critical_count }}"
          HIGH="${{ needs.scan-changes.outputs.high_count }}"

          if [ "$BLOCKING" = "true" ]; then
            echo "- ❌ **BLOCKED**: $CRITICAL CRITICAL finding(s) with confidence > $CONFIDENCE_THRESHOLD" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::RL Review Gate: Merge is BLOCKED due to $CRITICAL CRITICAL finding(s)"
            exit 1
          elif [ "$HIGH" -gt 0 ]; then
            echo "- ⚠️ **WARNING**: $HIGH HIGH finding(s) detected (non-blocking)" >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::RL Review Gate: $HIGH HIGH finding(s) detected — review recommended"
          else
            echo "- ✅ **PASSED**: No blocking findings detected" >> "$GITHUB_STEP_SUMMARY"
          fi
