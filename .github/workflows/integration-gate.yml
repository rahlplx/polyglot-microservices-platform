name: Integration Gate

on:
  workflow_call:
    inputs:
      image-tag:
        description: 'Image tag to test (e.g., pr-42, sha-abc1234, v1.2.3)'
        required: true
        type: string
      environment:
        description: 'Target environment for integration tests'
        required: false
        type: string
        default: 'staging'
      run-chaos:
        description: 'Whether to run chaos experiments'
        required: false
        type: boolean
        default: false
      run-stress:
        description: 'Whether to run stress tests'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  checks: write

env:
  REGISTRY: ghcr.io
  ORG: rahlplx

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Job 1: Contract Tests
  # ─────────────────────────────────────────────────────────────────────────────
  contract-tests:
    name: Contract Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: |
            services/gateway/go.sum
            services/payment/go.sum
            services/schema-registry/go.sum

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/identity -> target

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: services/catalog/package-lock.json

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Run contract tests
        run: |
          chmod +x scripts/run-contract-tests.sh
          scripts/run-contract-tests.sh --verbose 2>&1 | tee contract-test-output.txt

      - name: Upload contract test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contract-test-results
          path: |
            contract-test-output.txt
            test-results/
          retention-days: 14

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 2: End-to-End Tests
  # ─────────────────────────────────────────────────────────────────────────────
  e2e-tests:
    name: E2E Tests
    needs: [contract-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install test dependencies
        run: |
          pip install pytest pytest-timeout requests grpcio grpcio-tools

      - name: Run E2E test suite
        env:
          TARGET_ENV: ${{ inputs.environment }}
          BASE_URL: ${{ secrets.STAGING_URL || 'http://localhost:8080' }}
        run: |
          echo "Running E2E tests against ${{ inputs.environment }}..."
          chmod +x scripts/run-e2e-tests.sh
          scripts/run-e2e-tests.sh --env ${{ inputs.environment }} --verbose 2>&1 | tee e2e-test-output.txt || true

          # Also run pytest directly for the Python E2E tests
          if [ -d "tests/e2e" ]; then
            pytest tests/e2e/ -v --timeout=180 --junitxml=e2e-junit.xml 2>&1 | tee -a e2e-test-output.txt || true
          fi

      - name: Upload E2E test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-test-results
          path: |
            e2e-test-output.txt
            e2e-junit.xml
            test-results/
          retention-days: 14

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 3: mTLS Verification
  # ─────────────────────────────────────────────────────────────────────────────
  mtls-verify:
    name: mTLS Verification
    needs: [contract-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run mTLS verification
        env:
          NAMESPACE: ${{ inputs.environment }}
        run: |
          chmod +x scripts/mtls-verify.sh
          scripts/mtls-verify.sh --namespace ${{ inputs.environment }} --skip-live --verbose 2>&1 | tee mtls-verify-output.txt || true

      - name: Upload mTLS verification results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mtls-verify-results
          path: |
            mtls-verify-output.txt
            reports/
          retention-days: 14

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 4: Chaos Experiments (optional)
  # ─────────────────────────────────────────────────────────────────────────────
  chaos-experiments:
    name: Chaos Experiments
    needs: [e2e-tests]
    if: inputs.run-chaos
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: chaos-test
          node_image: kindest/node:v1.29.2

      - name: Run chaos experiments
        run: |
          chmod +x scripts/chaos-experiments.sh
          scripts/chaos-experiments.sh \
            --cluster chaos-test \
            --duration 60 \
            --skip-setup \
            --skip-teardown \
            --verbose 2>&1 | tee chaos-output.txt || true

      - name: Upload chaos experiment results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chaos-experiment-results
          path: |
            chaos-output.txt
            test-results/chaos/
          retention-days: 14

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 5: Stress Tests (optional)
  # ─────────────────────────────────────────────────────────────────────────────
  stress-tests:
    name: Stress Tests
    needs: [e2e-tests]
    if: inputs.run-stress
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install stress test dependencies
        run: |
          pip install pytest pytest-timeout pytest-benchmark locust

      - name: Run stress tests
        run: |
          if [ -d "tests/stress" ]; then
            pytest tests/stress/ -v --timeout=300 -m "not slow" --junitxml=stress-junit.xml 2>&1 | tee stress-output.txt || true
          fi

      - name: Upload stress test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stress-test-results
          path: |
            stress-output.txt
            stress-junit.xml
            tests/stress/stress_test_results.json
          retention-days: 14

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 6: Production Readiness Review
  # ─────────────────────────────────────────────────────────────────────────────
  production-readiness:
    name: Production Readiness Review
    needs: [e2e-tests, mtls-verify]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run production readiness review
        run: |
          chmod +x scripts/production-readiness-review.sh
          scripts/production-readiness-review.sh --skip-live --verbose --output integration-readiness-report.json 2>&1 | tee readiness-output.txt || true

      - name: Check readiness score
        id: score
        run: |
          if [ -f integration-readiness-report.json ]; then
            SCORE=$(python3 -c "import json; d=json.load(open('integration-readiness-report.json')); print(d.get('overall_score', d.get('score', 0)))" 2>/dev/null || echo "0")
            echo "score=$SCORE" >> "$GITHUB_OUTPUT"
            echo "### Production Readiness Score: $SCORE/100" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "score=0" >> "$GITHUB_OUTPUT"
            echo "### Production Readiness: Report not generated" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload readiness report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-readiness-report
          path: |
            integration-readiness-report.json
            readiness-output.txt
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 7: Promotion Gate
  # ─────────────────────────────────────────────────────────────────────────────
  promotion-gate:
    name: Promotion Gate
    needs: [contract-tests, e2e-tests, mtls-verify, production-readiness]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    steps:
      - name: Evaluate promotion gate
        run: |
          echo "### Integration Gate — Promotion Decision" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          # Check all dependent job results
          CONTRACT="${{ needs.contract-tests.result }}"
          E2E="${{ needs.e2e-tests.result }}"
          MTLS="${{ needs.mtls-verify.result }}"
          READINESS="${{ needs.production-readiness.result }}"

          echo "| Check | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Contract Tests | $CONTRACT |" >> "$GITHUB_STEP_SUMMARY"
          echo "| E2E Tests | $E2E |" >> "$GITHUB_STEP_SUMMARY"
          echo "| mTLS Verification | $MTLS |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Production Readiness | $READINESS |" >> "$GITHUB_STEP_SUMMARY"

          # Gate decision
          FAILED=false
          for result in "$CONTRACT" "$E2E" "$MTLS" "$READINESS"; do
            if [ "$result" = "failure" ]; then
              FAILED=true
              break
            fi
          done

          if [ "$FAILED" = "true" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "❌ **PROMOTION BLOCKED**: One or more integration gate checks failed" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Integration gate: Promotion blocked — one or more checks failed"
            exit 1
          else
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "✅ **PROMOTION APPROVED**: All integration gate checks passed" >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::Integration gate: Promotion approved for image tag ${{ inputs.image-tag }}"
          fi
