# ---------------------------------------------------------------------------
# Comprehensive CI Pipeline — Polyglot Microservices Platform
# ---------------------------------------------------------------------------
# Runs on every push to main/develop and on pull requests.
# Stages: Lint → Schema Validation → Test → Benchmark → Build → Security Scan → Deploy
# ---------------------------------------------------------------------------
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  security-events: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}
  BUF_VERSION: "1.29.0"

# ---------------------------------------------------------------------------
# Service matrix — language mapping for all 9 services
# ---------------------------------------------------------------------------
jobs:
  # =========================================================================
  # STAGE 1: LINT
  # =========================================================================
  lint:
    name: Lint (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: gateway
            language: go
          - service: identity
            language: go
          - service: catalog
            language: typescript
          - service: order
            language: rust
          - service: payment
            language: java
          - service: notification
            language: python
          - service: analytics
            language: python
          - service: cdc-relay
            language: rust
          - service: schema-registry
            language: typescript
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # --- Go linting ---
      - name: Setup Go
        if: matrix.language == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: services/${{ matrix.service }}/go.sum

      - name: golangci-lint
        if: matrix.language == 'go'
        run: |
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
          golangci-lint run --timeout 5m

      # --- Rust linting ---
      - name: Setup Rust
        if: matrix.language == 'rust'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: cargo clippy
        if: matrix.language == 'rust'
        run: |
          cargo fmt -- --check
          cargo clippy --all-targets --all-features -- -D warnings

      # --- TypeScript linting (Biome) ---
      - name: Setup Node.js
        if: matrix.language == 'typescript'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: services/${{ matrix.service }}/package-lock.json

      - name: Biome lint + format
        if: matrix.language == 'typescript'
        run: |
          npm ci
          npx biome check .

      # --- Python linting (ruff) ---
      - name: Setup Python
        if: matrix.language == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: services/${{ matrix.service }}/pyproject.toml

      - name: ruff + mypy
        if: matrix.language == 'python'
        run: |
          pip install ruff mypy
          ruff check .
          mypy src/ --strict

      # --- Java/Kotlin linting (ktlint) ---
      - name: Setup Java
        if: matrix.language == 'java'
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: ktlint + detekt
        if: matrix.language == 'java'
        run: |
          ./gradlew ktlintCheck detekt

  # =========================================================================
  # STAGE 2: SCHEMA VALIDATION
  # =========================================================================
  schema-validation:
    name: Schema Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout base branch
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref }}
          path: base

      - name: Setup Buf
        uses: bufbuild/buf-setup-action@v1
        with:
          version: ${{ env.BUF_VERSION }}

      - name: Buf Lint
        run: buf lint schemas/

      - name: Buf Format Check
        run: buf format schemas/ --exit-code

      - name: Buf Breaking Change Detection
        if: github.event_name == 'pull_request'
        run: buf breaking schemas/ --against base/schemas/

      - name: Protobuf Compilation Check
        run: |
          buf generate schemas/
          if ! git diff --exit-code --quiet schemas/generated/; then
            echo "::error::Generated code is out of date. Run 'buf generate' and commit."
            git diff schemas/generated/
            exit 1
          fi

      - name: Validate OpenAPI specs
        run: |
          npm install -g @redocly/cli@latest
          for spec in schemas/openapi/*/*.yaml; do
            if [ -f "$spec" ]; then
              echo "Validating $spec"
              redocly lint "$spec" || exit 1
            fi
          done

  # =========================================================================
  # STAGE 3: TEST
  # =========================================================================
  test:
    name: Test (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: [lint]
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: gateway
            language: go
          - service: identity
            language: go
          - service: catalog
            language: typescript
          - service: order
            language: rust
          - service: payment
            language: java
          - service: notification
            language: python
          - service: analytics
            language: python
          - service: cdc-relay
            language: rust
          - service: schema-registry
            language: typescript
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: test_${{ matrix.service }}
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        if: matrix.language == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: services/${{ matrix.service }}/go.sum

      - name: Setup Rust
        if: matrix.language == 'rust'
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        if: matrix.language == 'typescript'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: services/${{ matrix.service }}/package-lock.json

      - name: Setup Java
        if: matrix.language == 'java'
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Python
        if: matrix.language == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: services/${{ matrix.service }}/pyproject.toml

      # --- Go tests ---
      - name: Go test
        if: matrix.language == 'go'
        run: go test -v -race -coverprofile=coverage.out ./...

      # --- Rust tests ---
      - name: Rust test
        if: matrix.language == 'rust'
        run: cargo test --all-features

      # --- TypeScript tests ---
      - name: TypeScript test
        if: matrix.language == 'typescript'
        run: |
          npm ci
          npm test -- --coverage

      # --- Java tests ---
      - name: Java test
        if: matrix.language == 'java'
        run: ./gradlew test

      # --- Python tests ---
      - name: Python test
        if: matrix.language == 'python'
        run: |
          pip install -e ".[dev]"
          pytest tests/ -v --cov=src --cov-report=term-missing

  # =========================================================================
  # STAGE 4: BENCHMARK
  # =========================================================================
  benchmark:
    name: Benchmark (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: gateway
            language: go
          - service: identity
            language: rust
          - service: catalog
            language: typescript
          - service: order
            language: java
          - service: payment
            language: go
          - service: notification
            language: python
          - service: analytics
            language: python
          - service: rl-engine
            language: python
          - service: schema-registry
            language: go
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        if: matrix.language == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: services/${{ matrix.service }}/go.sum

      - name: Setup Rust
        if: matrix.language == 'rust'
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        if: matrix.language == 'typescript'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: services/${{ matrix.service }}/package-lock.json

      - name: Setup Java
        if: matrix.language == 'java'
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Python
        if: matrix.language == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: services/${{ matrix.service }}/pyproject.toml

      # --- Go benchmarks ---
      - name: Go benchmark
        if: matrix.language == 'go'
        run: |
          go test -bench=. -benchmem -count=3 ./... | tee benchmark-results.txt

      # --- Rust benchmarks ---
      - name: Rust benchmark
        if: matrix.language == 'rust'
        run: |
          cargo bench --bench '*' 2>/dev/null || cargo test --release -- --nocapture | tee benchmark-results.txt

      # --- TypeScript benchmarks ---
      - name: TypeScript benchmark
        if: matrix.language == 'typescript'
        run: |
          npm ci
          npx vitest bench 2>/dev/null || echo "No benchmarks defined yet"

      # --- Java benchmarks ---
      - name: Java benchmark
        if: matrix.language == 'java'
        run: |
          ./gradlew jmh 2>/dev/null || ./gradlew benchmark 2>/dev/null || echo "No benchmarks defined yet"

      # --- Python benchmarks ---
      - name: Python benchmark
        if: matrix.language == 'python'
        run: |
          pip install -e ".[dev]"
          python -m pytest tests/ -v --benchmark-only 2>/dev/null || python -m pytest tests/ -v --benchmark-skip 2>/dev/null || echo "No benchmarks defined yet"

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-${{ matrix.service }}
          path: services/${{ matrix.service }}/benchmark-results.txt
          if-no-files-found: ignore

  # =========================================================================
  # STAGE 5: BUILD (Docker)
  # =========================================================================
  build:
    name: Build (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: [test, schema-validation]
    strategy:
      fail-fast: false
      matrix:
        service:
          - gateway
          - identity
          - catalog
          - order
          - payment
          - notification
          - analytics
          - cdc-relay
          - schema-registry
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=ref,event=pr

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: services/${{ matrix.service }}
          file: services/${{ matrix.service }}/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            SERVICE_NAME=${{ matrix.service }}
            GIT_SHA=${{ github.sha }}

  # =========================================================================
  # STAGE 6: SECURITY SCAN
  # =========================================================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # --- Check for proprietary SDKs in domain layer ---
      - name: ACL Enforcement — No proprietary SDKs in domain
        run: |
          PROPRIETARY_PATTERNS=(
            "amazonaws"
            "google.golang.org/api"
            "azure-sdk"
            "stripe"
            "twilio"
            "sendgrid"
          )

          FOUND=0
          for service in gateway identity catalog order payment notification analytics cdc-relay schema-registry; do
            DOMAIN_DIR="services/${service}/domain"
            INBOUND_DIR="services/${service}/adapters/inbound"

            for pattern in "${PROPRIETARY_PATTERNS[@]}"; do
              if rg -l "$pattern" "$DOMAIN_DIR" 2>/dev/null; then
                echo "::error::Found proprietary import '$pattern' in $service domain layer. ACL violation."
                FOUND=1
              fi
              if rg -l "$pattern" "$INBOUND_DIR" 2>/dev/null; then
                echo "::error::Found proprietary import '$pattern' in $service inbound adapter. ACL violation."
                FOUND=1
              fi
            done
          done

          if [ "$FOUND" -ne 0 ]; then
            echo "::error::ACL enforcement check FAILED."
            exit 1
          fi
          echo "ACL enforcement check PASSED."

      # --- Trivy filesystem scan ---
      - name: Trivy vulnerability scan (filesystem)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          format: table
          exit-code: '1'

  # =========================================================================
  # STAGE 7: DEPLOY (main branch only)
  # =========================================================================
  deploy:
    name: Deploy (ArgoCD Sync)
    runs-on: ubuntu-latest
    needs: [build, security-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trigger ArgoCD Sync
        env:
          ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}
          ARGOCD_TOKEN: ${{ secrets.ARGOCD_TOKEN }}
        run: |
          echo "Triggering ArgoCD application sync for all services..."
          SERVICES=(
            gateway identity catalog order payment notification analytics cdc-relay schema-registry
          )

          for service in "${SERVICES[@]}"; do
            echo "Syncing $service..."
            # ArgoCD CLI sync trigger (requires argocd CLI in runner or API call)
            curl -s -X POST \
              "${ARGOCD_SERVER}/api/v1/applications/${service}/sync" \
              -H "Authorization: Bearer ${ARGOCD_TOKEN}" \
              -H "Content-Type: application/json" \
              -d '{"syncOptions": {"items": ["ApplyOutOfSyncOnly=true"]}}' \
              || echo "::warning::Failed to sync $service — check ArgoCD connectivity"
          done

          echo "ArgoCD sync triggered for all services."

  # =========================================================================
  # CI Summary
  # =========================================================================
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [lint, schema-validation, test, benchmark, build, security-scan]
    if: always()
    steps:
      - name: Check overall result
        run: |
          if [ "${{ needs.lint.result }}" == "failure" ] || \
             [ "${{ needs.schema-validation.result }}" == "failure" ] || \
             [ "${{ needs.test.result }}" == "failure" ] || \
             [ "${{ needs.benchmark.result }}" == "failure" ] || \
             [ "${{ needs.build.result }}" == "failure" ] || \
             [ "${{ needs.security-scan.result }}" == "failure" ]; then
            echo "::error::CI pipeline FAILED. Check individual job logs."
            exit 1
          fi
          echo "All CI stages passed successfully."
