# ---------------------------------------------------------------------------
# Schema Validation CI — Polyglot Microservices Platform
# ---------------------------------------------------------------------------
# Triggers: PRs on schemas/** and buf config files
# Jobs:
#   1. buf-lint           — Protobuf lint via Buf
#   2. buf-breaking       — Breaking change detection
#   3. openapi-validate   — OpenAPI spec validation with Redocly
#   4. pact-broker-check  — Pact contract verification
# ---------------------------------------------------------------------------
name: Schema CI

on:
  pull_request:
    paths:
      - 'schemas/**'
      - 'buf.yaml'
      - 'buf.gen.yaml'
    branches:
      - develop
      - main

permissions:
  contents: read
  pull-requests: write
  checks: write

env:
  BUF_VERSION: "1.31.0"

jobs:
  # =========================================================================
  # 1. Buf Lint — Protobuf lint
  # =========================================================================
  buf-lint:
    name: "Buf Lint"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Buf
        uses: bufbuild/buf-setup-action@v1
        with:
          version: ${{ env.BUF_VERSION }}

      - name: Buf Lint
        run: buf lint schemas/
        continue-on-error: false

      - name: Buf Format Check
        run: buf format schemas/ --exit-code

  # =========================================================================
  # 2. Buf Breaking Change Detection
  # =========================================================================
  buf-breaking:
    name: "Buf Breaking"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref }}
          path: base

      - name: Setup Buf
        uses: bufbuild/buf-setup-action@v1
        with:
          version: ${{ env.BUF_VERSION }}

      - name: Buf Breaking (against base)
        run: buf breaking schemas/ --against base/schemas/

  # =========================================================================
  # 3. OpenAPI Spec Validation
  # =========================================================================
  openapi-validate:
    name: "OpenAPI Validate"
    runs-on: ubuntu-latest
    needs: [buf-lint]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Redocly CLI
        run: npm install -g @redocly/cli@latest

      - name: Validate centralized OpenAPI specs
        run: |
          for spec in schemas/openapi/*/*.yaml; do
            if [ -f "$spec" ]; then
              echo "Validating $spec"
              redocly lint "$spec" || exit 1
            fi
          done

      - name: Validate service-local OpenAPI specs
        run: |
          for spec in services/*/api/openapi/*.yaml; do
            if [ -f "$spec" ]; then
              echo "Validating $spec"
              redocly lint "$spec" || exit 1
            fi
          done

  # =========================================================================
  # 4. Pact Broker Check
  # =========================================================================
  pact-broker-check:
    name: "Pact Broker Check"
    runs-on: ubuntu-latest
    needs: [buf-lint]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Pact CLI
        run: npm install -g @pact-foundation/pact-cli@latest

      - name: Verify Pact contracts exist
        run: |
          echo "Checking Pact contract directories..."
          CONTRACT_DIRS_FOUND=0
          for dir in schemas/contracts/*/; do
            if [ -d "$dir" ]; then
              echo "Found contract directory: $dir"
              CONTRACT_DIRS_FOUND=1
              if [ -z "$(ls -A "$dir")" ]; then
                echo "::warning::Contract directory $dir is empty"
              fi
            fi
          done

          if [ "$CONTRACT_DIRS_FOUND" -eq 0 ]; then
            echo "::warning::No contract directories found under schemas/contracts/"
          fi

      - name: Check Pact broker connectivity
        if: env.PACT_BROKER_URL != ''
        env:
          PACT_BROKER_URL: ${{ secrets.PACT_BROKER_URL }}
          PACT_BROKER_TOKEN: ${{ secrets.PACT_BROKER_TOKEN }}
        run: |
          echo "Verifying Pact broker at ${PACT_BROKER_URL}..."
          curl -sf -H "Authorization: Bearer ${PACT_BROKER_TOKEN}" \
            "${PACT_BROKER_URL}/diagnostic/status/heartbeat" || {
            echo "::warning::Pact broker is not reachable"
          }

  # =========================================================================
  # Schema CI Summary
  # =========================================================================
  schema-ci-summary:
    name: "Schema CI Summary"
    runs-on: ubuntu-latest
    needs: [buf-lint, buf-breaking, openapi-validate, pact-broker-check]
    if: always()
    steps:
      - name: Check all jobs
        run: |
          if [ "${{ needs.buf-lint.result }}" != "success" ] || \
             [ "${{ needs.buf-breaking.result }}" != "success" ] || \
             [ "${{ needs.openapi-validate.result }}" != "success" ]; then
            echo "::error::Schema CI failed. Fix lint, breaking change, or OpenAPI issues before merging."
            exit 1
          fi
          echo "All schema CI checks passed."
