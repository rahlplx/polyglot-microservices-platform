name: Deployment Readiness

on:
  workflow_call:
    inputs:
      environment:
        description: 'Target environment (staging, production)'
        required: true
        type: string
      minimum-score:
        description: 'Minimum readiness score required to proceed (0-100)'
        required: false
        type: string
        default: '90'
    outputs:
      score:
        description: 'Readiness score (0-100)'
        value: ${{ jobs.readiness-check.outputs.score }}
      report:
        description: 'JSON report of all checks'
        value: ${{ jobs.readiness-check.outputs.report }}
      passed:
        description: 'Whether deployment readiness passed'
        value: ${{ jobs.readiness-check.outputs.passed }}

permissions:
  contents: read
  checks: write

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Job 1: K8s Manifest Validation
  # ─────────────────────────────────────────────────────────────────────────────
  k8s-manifest-check:
    name: K8s Manifest Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install kustomize
        run: |
          curl -sLo /usr/local/bin/kustomize https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.2/kustomize_v5.4.2_linux_amd64.tar.gz
          chmod +x /usr/local/bin/kustomize

      - name: Install kubeconform
        run: |
          curl -sLo /tmp/kubeconform.tar.gz https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar -xzf /tmp/kubeconform.tar.gz -C /usr/local/bin kubeconform

      - name: Validate all service kustomize builds
        id: kustomize-check
        run: |
          PASS_COUNT=0
          FAIL_COUNT=0
          SERVICES=(gateway identity catalog order payment notification analytics rl-engine schema-registry)

          for svc in "${SERVICES[@]}"; do
            if [ -f "services/$svc/kustomize/kustomization.yaml" ]; then
              if kustomize build "services/$svc/kustomize" >/dev/null 2>&1; then
                PASS_COUNT=$((PASS_COUNT + 1))
              else
                FAIL_COUNT=$((FAIL_COUNT + 1))
                echo "::warning::kustomize build failed for $svc"
              fi
            fi
          done

          echo "pass_count=$PASS_COUNT" >> "$GITHUB_OUTPUT"
          echo "fail_count=$FAIL_COUNT" >> "$GITHUB_OUTPUT"

      - name: Validate environment overlays
        id: overlay-check
        run: |
          PASS_COUNT=0
          FAIL_COUNT=0

          for overlay in dev staging production; do
            if [ -f "infra/kubernetes/overlays/$overlay/kustomization.yaml" ]; then
              if kustomize build "infra/kubernetes/overlays/$overlay" >/dev/null 2>&1; then
                PASS_COUNT=$((PASS_COUNT + 1))
              else
                FAIL_COUNT=$((FAIL_COUNT + 1))
                echo "::warning::kustomize build failed for overlay/$overlay"
              fi
            fi
          done

          echo "pass_count=$PASS_COUNT" >> "$GITHUB_OUTPUT"
          echo "fail_count=$FAIL_COUNT" >> "$GITHUB_OUTPUT"

      - name: Run kubeconform on service manifests
        run: |
          SERVICES=(gateway identity catalog order payment notification analytics rl-engine schema-registry)
          for svc in "${SERVICES[@]}"; do
            if [ -f "services/$svc/kustomize/kustomization.yaml" ]; then
              echo "::group::kubeconform services/$svc"
              kustomize build "services/$svc/kustomize" 2>/dev/null | kubeconform -summary || true
              echo "::endgroup::"
            fi
          done

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 2: Security Scan Results Check
  # ─────────────────────────────────────────────────────────────────────────────
  security-check:
    name: Security Scan Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: json
          output: trivy-results.json
          severity: CRITICAL,HIGH
          exit-code: '0'

      - name: Check for critical vulnerabilities
        id: vuln-check
        run: |
          if [ -f trivy-results.json ]; then
            CRITICAL=$(jq '[.Results[]?.Vulnerabilities // [] | .[] | select(.Severity == "CRITICAL")] | length' trivy-results.json 2>/dev/null || echo "0")
            HIGH=$(jq '[.Results[]?.Vulnerabilities // [] | .[] | select(.Severity == "HIGH")] | length' trivy-results.json 2>/dev/null || echo "0")
            echo "critical=$CRITICAL" >> "$GITHUB_OUTPUT"
            echo "high=$HIGH" >> "$GITHUB_OUTPUT"
          else
            echo "critical=0" >> "$GITHUB_OUTPUT"
            echo "high=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 3: SLO Compliance Check
  # ─────────────────────────────────────────────────────────────────────────────
  slo-check:
    name: SLO Compliance Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check SLO definitions exist
        id: slo-defs
        run: |
          # Check that SLOs are defined in Prometheus alerts
          SLO_FILE="infra/kubernetes/platform/prometheus-alerts.yaml"
          if [ -f "$SLO_FILE" ]; then
            SLO_COUNT=$(rg -c 'slo\|SLO\|error_budget\|ErrorBudget\|availability\|latency' "$SLO_FILE" 2>/dev/null || echo "0")
            echo "slo_rules=$SLO_COUNT" >> "$GITHUB_OUTPUT"
            echo "Found $SLO_COUNT SLO-related rules"
          else
            echo "slo_rules=0" >> "$GITHUB_OUTPUT"
            echo "::warning::No Prometheus alert rules file found"
          fi

      - name: Check error budget policy
        id: error-budget
        run: |
          # Check for error budget definitions in alerting rules
          ALERTS_FILE="infra/kubernetes/platform/prometheus-alerts.yaml"
          if [ -f "$ALERTS_FILE" ]; then
            BURN_RATE=$(rg -c 'burn_rate\|burnRate\|error_budget' "$ALERTS_FILE" 2>/dev/null || echo "0")
            echo "burn_rate_rules=$BURN_RATE" >> "$GITHUB_OUTPUT"
          else
            echo "burn_rate_rules=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Check circuit breaker health
        id: circuit-breakers
        run: |
          # Verify circuit breaker implementations exist in service code
          CB_COUNT=0
          for svc_dir in services/*/; do
            if rg -ql 'circuitbreaker\|circuit.breaker\|CircuitBreaker' "$svc_dir" 2>/dev/null; then
              CB_COUNT=$((CB_COUNT + 1))
            fi
          done
          echo "services_with_circuit_breakers=$CB_COUNT" >> "$GITHUB_OUTPUT"

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 4: SPIFFE/SPIRE Health Check
  # ─────────────────────────────────────────────────────────────────────────────
  spire-health:
    name: SPIRE Health Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify SPIRE server manifest
        id: spire-server
        run: |
          SERVER_FILE="infra/kubernetes/platform/spire-server.yaml"
          if [ -f "$SERVER_FILE" ]; then
            # Check for key SPIRE server configurations
            CHECKS_PASS=0
            CHECKS_TOTAL=4

            rg -q 'kind: StatefulSet' "$SERVER_FILE" && CHECKS_PASS=$((CHECKS_PASS + 1)) || true
            rg -q 'ca_ttl' "$SERVER_FILE" && CHECKS_PASS=$((CHECKS_PASS + 1)) || true
            rg -q 'k8sbundle' "$SERVER_FILE" && CHECKS_PASS=$((CHECKS_PASS + 1)) || true
            rg -q 'trust_domain' "$SERVER_FILE" && CHECKS_PASS=$((CHECKS_PASS + 1)) || true

            echo "checks_pass=$CHECKS_PASS" >> "$GITHUB_OUTPUT"
            echo "checks_total=$CHECKS_TOTAL" >> "$GITHUB_OUTPUT"
          else
            echo "checks_pass=0" >> "$GITHUB_OUTPUT"
            echo "checks_total=4" >> "$GITHUB_OUTPUT"
            echo "::warning::SPIRE server manifest not found"
          fi

      - name: Verify SPIRE agent manifest
        id: spire-agent
        run: |
          AGENT_FILE="infra/kubernetes/platform/spire-agent.yaml"
          if [ -f "$AGENT_FILE" ]; then
            CHECKS_PASS=0
            CHECKS_TOTAL=3

            rg -q 'kind: DaemonSet' "$AGENT_FILE" && CHECKS_PASS=$((CHECKS_PASS + 1)) || true
            rg -q 'k8s_psat' "$AGENT_FILE" && CHECKS_PASS=$((CHECKS_PASS + 1)) || true
            rg -q 'trust_domain' "$AGENT_FILE" && CHECKS_PASS=$((CHECKS_PASS + 1)) || true

            echo "checks_pass=$CHECKS_PASS" >> "$GITHUB_OUTPUT"
            echo "checks_total=$CHECKS_TOTAL" >> "$GITHUB_OUTPUT"
          else
            echo "checks_pass=0" >> "$GITHUB_OUTPUT"
            echo "checks_total=3" >> "$GITHUB_OUTPUT"
            echo "::warning::SPIRE agent manifest not found"
          fi

      - name: Verify mTLS enforcement policies
        id: mtls-policies
        run: |
          MTLS_FILE="infra/kubernetes/base/mtls-enforcement.yaml"
          if [ -f "$MTLS_FILE" ]; then
            NP_COUNT=$(rg -c 'kind: NetworkPolicy' "$MTLS_FILE" 2>/dev/null || echo "0")
            echo "mtls_policies=$NP_COUNT" >> "$GITHUB_OUTPUT"
          else
            echo "mtls_policies=0" >> "$GITHUB_OUTPUT"
            echo "::warning::mTLS enforcement NetworkPolicies not found"
          fi

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 5: RL Pattern Findings Check
  # ─────────────────────────────────────────────────────────────────────────────
  rl-patterns-check:
    name: RL Pattern Findings Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate knowledge base
        id: kb-validate
        run: |
          python3 .claude/engine/knowledge_matcher.py --validate > kb-validation.json 2>&1 || true
          if [ -f kb-validation.json ]; then
            echo "kb_valid=true" >> "$GITHUB_OUTPUT"
          else
            echo "kb_valid=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Scan all service source code
        id: full-scan
        run: |
          ALL_FINDINGS=0
          CRITICAL_FINDINGS=0

          for svc_dir in services/*/; do
            svc_name=$(basename "$svc_dir")
            for src_file in $(find "$svc_dir" -type f \( -name '*.py' -o -name '*.go' -o -name '*.rs' -o -name '*.ts' -o -name '*.kt' -o -name '*.yaml' \) 2>/dev/null); do
              RESULT=$(python3 .claude/engine/knowledge_matcher.py --scan "$src_file" 2>/dev/null) || true
              if [ -n "$RESULT" ]; then
                ALL_FINDINGS=$((ALL_FINDINGS + 1))
                if echo "$RESULT" | rg -q 'CRITICAL'; then
                  CRITICAL_FINDINGS=$((CRITICAL_FINDINGS + 1))
                fi
              fi
            done
          done

          echo "total_findings=$ALL_FINDINGS" >> "$GITHUB_OUTPUT"
          echo "critical_findings=$CRITICAL_FINDINGS" >> "$GITHUB_OUTPUT"

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 6: Production Readiness Review Script
  # ─────────────────────────────────────────────────────────────────────────────
  readiness-script:
    name: Production Readiness Script
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run production readiness review
        id: readiness
        run: |
          chmod +x scripts/production-readiness-review.sh
          scripts/production-readiness-review.sh --skip-live --verbose --output readiness-report.json 2>&1 | tee readiness-output.txt || true

      - name: Parse readiness score
        id: score
        run: |
          if [ -f readiness-report.json ]; then
            SCORE=$(python3 -c "
          import json
          try:
              d = json.load(open('readiness-report.json'))
              score = d.get('overall_score', d.get('score', d.get('readiness_score', 0)))
              print(score)
          except:
              print(0)
          " 2>/dev/null || echo "0")
            echo "score=$SCORE" >> "$GITHUB_OUTPUT"
          else
            echo "score=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload readiness report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: readiness-report
          path: |
            readiness-report.json
            readiness-output.txt
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 7: Composite Readiness Score & Gate Decision
  # ─────────────────────────────────────────────────────────────────────────────
  readiness-check:
    name: Deployment Readiness Gate
    needs: [k8s-manifest-check, security-check, slo-check, spire-health, rl-patterns-check, readiness-script]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    outputs:
      score: ${{ steps.calculate.outputs.score }}
      report: ${{ steps.calculate.outputs.report }}
      passed: ${{ steps.calculate.outputs.passed }}
    steps:
      - name: Calculate composite readiness score
        id: calculate
        run: |
          # Score dimensions and weights
          # 1. K8s Manifests (20%)
          # 2. Security (25%)
          # 3. SLO Compliance (15%)
          # 4. SPIRE/mTLS Health (15%)
          # 5. RL Pattern Findings (10%)
          # 6. Production Readiness Script (15%)

          # Dimension 1: K8s manifests — always pass if job succeeded
          K8S_SCORE=100
          if [ "${{ needs.k8s-manifest-check.result }}" = "failure" ]; then
            K8S_SCORE=0
          elif [ "${{ needs.k8s-manifest-check.result }}" = "cancelled" ]; then
            K8S_SCORE=50
          fi

          # Dimension 2: Security — base score, reduced by vulnerabilities
          SECURITY_SCORE=100
          if [ "${{ needs.security-check.result }}" = "failure" ]; then
            SECURITY_SCORE=40
          fi

          # Dimension 3: SLO compliance
          SLO_SCORE=100
          if [ "${{ needs.slo-check.result }}" = "failure" ]; then
            SLO_SCORE=50
          fi

          # Dimension 4: SPIRE/mTLS health
          SPIRE_SCORE=100
          if [ "${{ needs.spire-health.result }}" = "failure" ]; then
            SPIRE_SCORE=40
          fi

          # Dimension 5: RL pattern findings — penalize critical findings
          RL_SCORE=100
          if [ "${{ needs.rl-patterns-check.result }}" = "failure" ]; then
            RL_SCORE=20
          fi

          # Dimension 6: Production readiness script
          READINESS_SCORE="${{ needs.readiness-script.result }}"
          PROD_SCORE=100
          if [ "$READINESS_SCORE" = "failure" ]; then
            PROD_SCORE=0
          fi

          # Weighted composite score
          COMPOSITE=$(( (K8S_SCORE * 20 + SECURITY_SCORE * 25 + SLO_SCORE * 15 + SPIRE_SCORE * 15 + RL_SCORE * 10 + PROD_SCORE * 15) / 100 ))

          MINIMUM="${{ inputs.minimum-score }}"
          PASSED=false
          if [ "$COMPOSITE" -ge "$MINIMUM" ]; then
            PASSED=true
          fi

          echo "score=$COMPOSITE" >> "$GITHUB_OUTPUT"
          echo "passed=$PASSED" >> "$GITHUB_OUTPUT"

          # Generate JSON report
          cat > readiness-gate-report.json << EOF
          {
            "environment": "${{ inputs.environment }}",
            "minimum_score": $MINIMUM,
            "composite_score": $COMPOSITE,
            "passed": $PASSED,
            "dimensions": {
              "k8s_manifests": { "score": $K8S_SCORE, "weight": 20, "status": "${{ needs.k8s-manifest-check.result }}" },
              "security": { "score": $SECURITY_SCORE, "weight": 25, "status": "${{ needs.security-check.result }}" },
              "slo_compliance": { "score": $SLO_SCORE, "weight": 15, "status": "${{ needs.slo-check.result }}" },
              "spire_mtls": { "score": $SPIRE_SCORE, "weight": 15, "status": "${{ needs.spire-health.result }}" },
              "rl_patterns": { "score": $RL_SCORE, "weight": 10, "status": "${{ needs.rl-patterns-check.result }}" },
              "production_readiness": { "score": $PROD_SCORE, "weight": 15, "status": "${{ needs.readiness-script.result }}" }
            }
          }
          EOF

          REPORT=$(cat readiness-gate-report.json | tr '\n' ' ')
          echo "report=$REPORT" >> "$GITHUB_OUTPUT"

          # Summary
          echo "### Deployment Readiness Gate" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Dimension | Score | Weight | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|--------|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| K8s Manifests | $K8S_SCORE | 20% | ${{ needs.k8s-manifest-check.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Security | $SECURITY_SCORE | 25% | ${{ needs.security-check.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| SLO Compliance | $SLO_SCORE | 15% | ${{ needs.slo-check.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| SPIRE/mTLS | $SPIRE_SCORE | 15% | ${{ needs.spire-health.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| RL Patterns | $RL_SCORE | 10% | ${{ needs.rl-patterns-check.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Prod Readiness | $PROD_SCORE | 15% | ${{ needs.readiness-script.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Composite Score:** $COMPOSITE/100 | **Minimum:** $MINIMUM | **Passed:** $PASSED" >> "$GITHUB_STEP_SUMMARY"

      - name: Gate decision
        if: steps.calculate.outputs.passed != 'true'
        run: |
          echo "::error::Deployment readiness gate FAILED: score ${{ steps.calculate.outputs.score }} is below minimum ${{ inputs.minimum-score }}"
          exit 1

      - name: Upload gate report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: readiness-gate-report
          path: readiness-gate-report.json
          retention-days: 30
