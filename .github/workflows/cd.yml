name: CD Pipeline

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - staging
          - production
      service:
        description: 'Service to deploy (or "all")'
        required: true
        type: string
        default: 'all'
      image-tag:
        description: 'Image tag to deploy (e.g., v1.2.3, pr-42-abc1234)'
        required: true
        type: string
      rollback-on-failure:
        description: 'Automatically rollback on deployment failure'
        required: false
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - 'services/**'
      - 'infra/kubernetes/**'

permissions:
  contents: read
  id-token: write
  packages: write

env:
  REGISTRY: ghcr.io
  ORG: rahlplx
  SERVICES: >-
    gateway identity catalog order payment
    notification analytics rl-engine schema-registry

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Job 1: Build & Push Docker Images
  # ─────────────────────────────────────────────────────────────────────────────
  build-and-push:
    name: Build & Push (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        service:
          - gateway
          - identity
          - catalog
          - order
          - payment
          - notification
          - analytics
          - rl-engine
          - schema-registry
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.ORG }}/polyglot-${{ matrix.service }}
          tags: |
            type=sha
            type=raw,value=latest
            type=semver,pattern={{version}}
            type=raw,value=sha-${{ steps.sha.outputs.short }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./services/${{ matrix.service }}
          file: ./services/${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
          provenance: true
          sbom: true

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 2: Deployment Readiness Gate
  # ─────────────────────────────────────────────────────────────────────────────
  readiness-gate:
    name: Deployment Readiness Gate
    needs: [build-and-push]
    if: always() && !cancelled()
    uses: ./.github/workflows/deployment-readiness.yml
    with:
      environment: ${{ github.event.inputs.environment || 'staging' }}
    secrets: inherit

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 3: Deploy to Staging
  # ─────────────────────────────────────────────────────────────────────────────
  deploy-staging:
    name: Deploy to Staging
    needs: [build-and-push, readiness-gate]
    if: >-
      always() &&
      !cancelled() &&
      (github.event.inputs.environment == 'staging' || github.event_name == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: staging
      url: https://staging.example.com
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine target services
        id: targets
        run: |
          if [ "${{ github.event.inputs.service }}" = "all" ] || [ -z "${{ github.event.inputs.service }}" ]; then
            echo "services=$SERVICES" >> "$GITHUB_OUTPUT"
          else
            echo "services=${{ github.event.inputs.service }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine image tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.image-tag }}" ]; then
            echo "tag=${{ github.event.inputs.image-tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_STAGING }}" | base64 -d > ~/.kube/config
          kubectl cluster-info

      - name: Update Kustomize image tags
        run: |
          for svc in ${{ steps.targets.outputs.services }}; do
            echo "Setting $svc image tag to ${{ steps.tag.outputs.tag }}"
            cd infra/kubernetes/overlays/staging
            kustomize edit set image \
              polyglot-platform/$svc=${{ env.REGISTRY }}/${{ env.ORG }}/polyglot-$svc:${{ steps.tag.outputs.tag }} \
              || true
            cd "$GITHUB_WORKSPACE"
          done

      - name: Deploy via ArgoCD
        run: |
          # Trigger ArgoCD sync for each service application
          for svc in ${{ steps.targets.outputs.services }}; do
            echo "::group::Syncing $svc to staging"
            argocd app sync "$svc-staging" \
              --server ${{ secrets.ARGOCD_SERVER }} \
              --auth-token ${{ secrets.ARGOCD_TOKEN }} \
              --prune || true
            echo "::endgroup::"
          done

      - name: Wait for rollout
        run: |
          for svc in ${{ steps.targets.outputs.services }}; do
            echo "Waiting for $svc rollout in staging..."
            kubectl rollout status deployment/"$svc" -n staging --timeout=300s || true
          done

      - name: Verify deployment health
        run: |
          chmod +x scripts/argocd-sync-validate.sh
          scripts/argocd-sync-validate.sh --phase post --namespace staging --skip-cluster-checks || true

      - name: Run mTLS verification
        run: |
          chmod +x scripts/mtls-verify.sh
          scripts/mtls-verify.sh --namespace staging --skip-live || true

      - name: Rollback on failure
        if: failure() && github.event.inputs.rollback-on-failure == 'true'
        run: |
          for svc in ${{ steps.targets.outputs.services }}; do
            echo "Rolling back $svc in staging..."
            kubectl rollout undo deployment/"$svc" -n staging || true
          done

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 4: Deploy to Production
  # ─────────────────────────────────────────────────────────────────────────────
  deploy-production:
    name: Deploy to Production
    needs: [deploy-staging, readiness-gate]
    if: >-
      always() &&
      !cancelled() &&
      github.event.inputs.environment == 'production'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://app.example.com
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine target services
        id: targets
        run: |
          if [ "${{ github.event.inputs.service }}" = "all" ] || [ -z "${{ github.event.inputs.service }}" ]; then
            echo "services=$SERVICES" >> "$GITHUB_OUTPUT"
          else
            echo "services=${{ github.event.inputs.service }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine image tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.image-tag }}" ]; then
            echo "tag=${{ github.event.inputs.image-tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_PRODUCTION }}" | base64 -d > ~/.kube/config
          kubectl cluster-info

      - name: Run production readiness review
        run: |
          chmod +x scripts/production-readiness-review.sh
          scripts/production-readiness-review.sh --output production-readiness-report.json || true

      - name: Check readiness score
        id: readiness
        run: |
          if [ -f production-readiness-report.json ]; then
            SCORE=$(jq -r '.overall_score // 0' production-readiness-report.json)
            echo "score=$SCORE" >> "$GITHUB_OUTPUT"
            if [ "$SCORE" -lt 90 ]; then
              echo "::error::Production readiness score $SCORE is below threshold of 90"
              exit 1
            fi
          fi

      - name: Update Kustomize image tags for production
        run: |
          for svc in ${{ steps.targets.outputs.services }}; do
            echo "Setting $svc image tag to ${{ steps.tag.outputs.tag }}"
            cd infra/kubernetes/overlays/production
            kustomize edit set image \
              polyglot-platform/$svc=${{ env.REGISTRY }}/${{ env.ORG }}/polyglot-$svc:${{ steps.tag.outputs.tag }} \
              || true
            cd "$GITHUB_WORKSPACE"
          done

      - name: Deploy via ArgoCD (canary)
        run: |
          for svc in ${{ steps.targets.outputs.services }}; do
            echo "::group::Syncing $svc to production (canary)"
            argocd app sync "$svc-production" \
              --server ${{ secrets.ARGOCD_SERVER }} \
              --auth-token ${{ secrets.ARGOCD_TOKEN }} \
              --prune || true
            echo "::endgroup::"
          done

      - name: Wait for canary rollout
        run: |
          for svc in ${{ steps.targets.outputs.services }}; do
            echo "Waiting for $svc canary rollout in production..."
            kubectl rollout status deployment/"$svc" -n production --timeout=600s || true
          done

      - name: Verify production health
        run: |
          chmod +x scripts/argocd-sync-validate.sh
          scripts/argocd-sync-validate.sh --phase post --namespace production || true

          chmod +x scripts/mtls-verify.sh
          scripts/mtls-verify.sh --namespace production --skip-live || true

      - name: Promote canary to full rollout
        run: |
          for svc in ${{ steps.targets.outputs.services }}; do
            echo "Promoting $svc canary to full rollout..."
            # Scale up to full replicas
            kubectl patch deployment "$svc" -n production -p '{"spec":{"replicas":3}}' || true
          done

      - name: Post-deployment smoke tests
        run: |
          chmod +x scripts/integration-test.sh
          scripts/integration-test.sh --env production --timeout 60 || true

      - name: Rollback on failure
        if: failure() && github.event.inputs.rollback-on-failure == 'true'
        run: |
          for svc in ${{ steps.targets.outputs.services }}; do
            echo "Rolling back $svc in production..."
            kubectl rollout undo deployment/"$svc" -n production || true
          done
          echo "::error::Production deployment failed — automatic rollback triggered"

      - name: Notify deployment result
        if: always()
        run: |
          STATUS="${{ job.status }}"
          echo "Deployment to production: $STATUS"
          echo "### Production Deployment $STATUS" >> "$GITHUB_STEP_SUMMARY"
          echo "- Environment: production" >> "$GITHUB_STEP_SUMMARY"
          echo "- Services: ${{ steps.targets.outputs.services }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image Tag: ${{ steps.tag.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Readiness Score: ${{ steps.readiness.outputs.score }}" >> "$GITHUB_STEP_SUMMARY"
