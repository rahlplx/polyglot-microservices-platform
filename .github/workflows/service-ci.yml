# Service CI — Reusable workflow for per-service lint+test+build+push
# Triggered by each service's CI pipeline or manually via workflow_dispatch
# Supports all 9 polyglot services with language-specific toolchains
name: Service CI

on:
  workflow_call:
    inputs:
      service:
        description: "Service name (gateway, identity, catalog, order, payment, notification, analytics, cdc-relay, schema-registry)"
        required: true
        type: string
      language:
        description: "Primary language (go, rust, typescript, java, python)"
        required: true
        type: string
      dockerfile:
        description: "Path to Dockerfile relative to service directory"
        required: false
        type: string
        default: "Dockerfile"
      push-image:
        description: "Push container image to registry"
        required: false
        type: boolean
        default: false
    outputs:
      image-tag:
        description: "The container image tag that was built"
        value: ${{ jobs.build.outputs.image-tag }}
    secrets:
      REGISTRY_USERNAME:
        required: false
      REGISTRY_PASSWORD:
        required: false

permissions:
  contents: read
  packages: write
  security-events: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}

jobs:
  lint:
    name: Lint (${{ inputs.service }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/${{ inputs.service }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        if: inputs.language == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: services/${{ inputs.service }}/go.sum

      - name: Setup Rust
        if: inputs.language == 'rust'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Setup Node.js
        if: inputs.language == 'typescript'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: services/${{ inputs.service }}/package-lock.json

      - name: Setup Java
        if: inputs.language == 'java'
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Python
        if: inputs.language == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: services/${{ inputs.service }}/pyproject.toml

      # Language-specific lint
      - name: Go lint
        if: inputs.language == 'go'
        run: |
          go vet ./...
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
          golangci-lint run --timeout 5m

      - name: Rust lint
        if: inputs.language == 'rust'
        run: |
          cargo fmt -- --check
          cargo clippy --all-targets --all-features -- -D warnings

      - name: TypeScript lint
        if: inputs.language == 'typescript'
        run: |
          npm ci
          npx eslint . --ext .ts
          npx tsc --noEmit

      - name: Java lint
        if: inputs.language == 'java'
        run: |
          ./gradlew ktlintCheck detekt

      - name: Python lint
        if: inputs.language == 'python'
        run: |
          pip install ruff mypy
          ruff check .
          mypy src/ --strict

  test:
    name: Test (${{ inputs.service }})
    runs-on: ubuntu-latest
    needs: [lint]
    defaults:
      run:
        working-directory: services/${{ inputs.service }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: test_${{ inputs.service }}
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        if: inputs.language == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: services/${{ inputs.service }}/go.sum

      - name: Setup Rust
        if: inputs.language == 'rust'
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        if: inputs.language == 'typescript'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: services/${{ inputs.service }}/package-lock.json

      - name: Setup Java
        if: inputs.language == 'java'
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Python
        if: inputs.language == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: services/${{ inputs.service }}/pyproject.toml

      # Language-specific test
      - name: Go test
        if: inputs.language == 'go'
        run: |
          go test -v -race -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out

      - name: Rust test
        if: inputs.language == 'rust'
        run: |
          cargo test --all-features
          cargo test --all-features -- --ignored  # property tests

      - name: TypeScript test
        if: inputs.language == 'typescript'
        run: |
          npm ci
          npm test -- --coverage

      - name: Java test
        if: inputs.language == 'java'
        run: |
          ./gradlew test

      - name: Python test
        if: inputs.language == 'python'
        run: |
          pip install -e ".[dev]"
          pytest tests/ -v --cov=src --cov-report=term-missing

  build:
    name: Build & Push (${{ inputs.service }})
    runs-on: ubuntu-latest
    needs: [test]
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
    defaults:
      run:
        working-directory: services/${{ inputs.service }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        if: inputs.push-image
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ inputs.service }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: services/${{ inputs.service }}
          file: services/${{ inputs.service }}/${{ inputs.dockerfile }}
          push: ${{ inputs.push-image }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            SERVICE_NAME=${{ inputs.service }}
            GIT_SHA=${{ github.sha }}

      - name: Trivy security scan
        if: inputs.push-image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ inputs.service }}:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: '1'

      - name: Upload Trivy scan results
        if: inputs.push-image
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

  acl-check:
    name: ACL Enforcement Check (${{ inputs.service }})
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for proprietary imports in domain layer
        run: |
          echo "Scanning services/${{ inputs.service }}/domain/ for proprietary SDK imports..."
          PROPRIETARY_PATTERNS=(
            "amazonaws"
            "google.golang.org/api"
            "azure-sdk"
            "stripe"
            "twilio"
            "sendgrid"
          )

          FOUND=0
          for pattern in "${PROPRIETARY_PATTERNS[@]}"; do
            if rg -l "$pattern" "services/${{ inputs.service }}/domain/" 2>/dev/null; then
              echo "::error::Found proprietary import '$pattern' in domain layer. ACL violation detected."
              FOUND=1
            fi
            if rg -l "$pattern" "services/${{ inputs.service }}/adapters/inbound/" 2>/dev/null; then
              echo "::error::Found proprietary import '$pattern' in inbound adapter. ACL violation detected."
              FOUND=1
            fi
          done

          if [ "$FOUND" -ne 0 ]; then
            echo "::error::ACL enforcement check FAILED. Proprietary imports found in protected layers."
            exit 1
          fi
          echo "ACL enforcement check PASSED. No proprietary imports in domain/inbound layers."

  otel-coverage:
    name: OTel Instrumentation Coverage (${{ inputs.service }})
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check OTel instrumentation coverage
        run: |
          echo "Checking OTel instrumentation coverage for ${{ inputs.service }}..."

          # Count total service entry points (gRPC handlers, REST controllers, event consumers)
          TOTAL=0
          INSTRUMENTED=0

          # Check for OTel span creation in adapter layer
          ADAPTER_DIR="services/${{ inputs.service }}/adapters"
          if [ -d "$ADAPTER_DIR" ]; then
            TOTAL=$(find "$ADAPTER_DIR" -name "*.go" -o -name "*.rs" -o -name "*.ts" -o -name "*.kt" -o -name "*.py" 2>/dev/null | wc -l)
            INSTRUMENTED=$(rg -l "otel|tracing|span|instrumentation|trace" "$ADAPTER_DIR" 2>/dev/null | wc -l)
          fi

          if [ "$TOTAL" -gt 0 ]; then
            COVERAGE=$(( (INSTRUMENTED * 100) / TOTAL ))
            echo "OTel instrumentation coverage: ${COVERAGE}% (${INSTRUMENTED}/${TOTAL} files)"

            if [ "$COVERAGE" -lt 90 ]; then
              echo "::warning::OTel instrumentation coverage is ${COVERAGE}%, below the 90% target."
            fi
          else
            echo "No adapter files found. Skipping OTel coverage check."
          fi
