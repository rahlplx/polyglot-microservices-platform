name: CI Pipeline

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'LICENSE'
      - '.claude/engine/feedback/**'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  checks: write
  security-events: write

env:
  REGISTRY: ghcr.io
  ORG: rahlplx

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Job 1: Detect Changed Services
  # ─────────────────────────────────────────────────────────────────────────────
  detect-changes:
    uses: ./.github/workflows/detect-changes.yml

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 2: Lint (matrix per language)
  # ─────────────────────────────────────────────────────────────────────────────
  lint:
    name: Lint (${{ matrix.language }})
    needs: detect-changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            services: ${{ needs.detect-changes.outputs.go-services }}
          - language: rust
            services: ${{ needs.detect-changes.outputs.rust-services }}
          - language: node
            services: ${{ needs.detect-changes.outputs.node-services }}
          - language: kotlin
            services: ${{ needs.detect-changes.outputs.kotlin-services }}
          - language: python
            services: ${{ needs.detect-changes.outputs.python-services }}
    steps:
      - name: Skip if no changes
        if: matrix.services == '[]'
        run: echo "No changes detected for ${{ matrix.language }}, skipping lint." && exit 0

      - name: Checkout repository
        if: matrix.services != '[]'
        uses: actions/checkout@v4

      # ── Go Lint ──────────────────────────────────────────────────────────
      - name: Set up Go
        if: matrix.language == 'go' && matrix.services != '[]'
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: |
            services/gateway/go.sum
            services/payment/go.sum
            services/schema-registry/go.sum

      - name: Install golangci-lint
        if: matrix.language == 'go' && matrix.services != '[]'
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b /usr/local/bin v1.59.1

      - name: Lint Go services
        if: matrix.language == 'go' && matrix.services != '[]'
        run: |
          services='${{ matrix.services }}'
          for svc in $(echo "$services" | jq -r '.[]'); do
            echo "::group::Linting services/$svc"
            cd "$GITHUB_WORKSPACE/services/$svc"
            if [ -f .golangci.yml ]; then
              golangci-lint run --timeout=5m --out-format=github-actions ./...
            else
              golangci-lint run --timeout=5m --enable=gosec,errcheck,staticcheck,govet --out-format=github-actions ./...
            fi
            cd "$GITHUB_WORKSPACE"
            echo "::endgroup::"
          done

      # ── Rust Lint ────────────────────────────────────────────────────────
      - name: Set up Rust
        if: matrix.language == 'rust' && matrix.services != '[]'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust cargo
        if: matrix.language == 'rust' && matrix.services != '[]'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            services/identity -> target

      - name: Lint Rust services
        if: matrix.language == 'rust' && matrix.services != '[]'
        run: |
          services='${{ matrix.services }}'
          for svc in $(echo "$services" | jq -r '.[]'); do
            echo "::group::Linting services/$svc"
            cd "$GITHUB_WORKSPACE/services/$svc"
            cargo fmt -- --check
            cargo clippy -- -D warnings -D clippy::unwrap_used -D clippy::expect_used
            cd "$GITHUB_WORKSPACE"
            echo "::endgroup::"
          done

      # ── Node.js Lint ─────────────────────────────────────────────────────
      - name: Set up Node.js
        if: matrix.language == 'node' && matrix.services != '[]'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: services/catalog/package-lock.json

      - name: Lint Node.js services
        if: matrix.language == 'node' && matrix.services != '[]'
        run: |
          services='${{ matrix.services }}'
          for svc in $(echo "$services" | jq -r '.[]'); do
            echo "::group::Linting services/$svc"
            cd "$GITHUB_WORKSPACE/services/$svc"
            npm ci --ignore-scripts
            npx eslint . --max-warnings=0 --format github-actions || true
            npx prettier --check "src/**/*.ts" || true
            cd "$GITHUB_WORKSPACE"
            echo "::endgroup::"
          done

      # ── Kotlin Lint ──────────────────────────────────────────────────────
      - name: Set up JDK
        if: matrix.language == 'kotlin' && matrix.services != '[]'
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Setup Gradle
        if: matrix.language == 'kotlin' && matrix.services != '[]'
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Lint Kotlin services
        if: matrix.language == 'kotlin' && matrix.services != '[]'
        run: |
          services='${{ matrix.services }}'
          for svc in $(echo "$services" | jq -r '.[]'); do
            echo "::group::Linting services/$svc"
            cd "$GITHUB_WORKSPACE/services/$svc"
            ./gradlew detekt --no-daemon || true
            ./gradlew ktlintCheck --no-daemon || true
            cd "$GITHUB_WORKSPACE"
            echo "::endgroup::"
          done

      # ── Python Lint ──────────────────────────────────────────────────────
      - name: Set up Python
        if: matrix.language == 'python' && matrix.services != '[]'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python lint tools
        if: matrix.language == 'python' && matrix.services != '[]'
        run: pip install ruff mypy black

      - name: Lint Python services
        if: matrix.language == 'python' && matrix.services != '[]'
        run: |
          services='${{ matrix.services }}'
          for svc in $(echo "$services" | jq -r '.[]'); do
            echo "::group::Linting services/$svc"
            cd "$GITHUB_WORKSPACE/services/$svc"
            ruff check . --output-format=github || true
            mypy src/ --ignore-missing-imports || true
            black --check . || true
            cd "$GITHUB_WORKSPACE"
            echo "::endgroup::"
          done

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 3: Unit Tests (matrix per language)
  # ─────────────────────────────────────────────────────────────────────────────
  unit-test:
    name: Unit Tests (${{ matrix.language }})
    needs: detect-changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            services: ${{ needs.detect-changes.outputs.go-services }}
          - language: rust
            services: ${{ needs.detect-changes.outputs.rust-services }}
          - language: node
            services: ${{ needs.detect-changes.outputs.node-services }}
          - language: kotlin
            services: ${{ needs.detect-changes.outputs.kotlin-services }}
          - language: python
            services: ${{ needs.detect-changes.outputs.python-services }}
    steps:
      - name: Skip if no changes
        if: matrix.services == '[]'
        run: echo "No changes detected for ${{ matrix.language }}, skipping tests." && exit 0

      - name: Checkout repository
        if: matrix.services != '[]'
        uses: actions/checkout@v4

      # ── Go Tests ─────────────────────────────────────────────────────────
      - name: Set up Go
        if: matrix.language == 'go' && matrix.services != '[]'
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: |
            services/gateway/go.sum
            services/payment/go.sum
            services/schema-registry/go.sum

      - name: Run Go unit tests
        if: matrix.language == 'go' && matrix.services != '[]'
        run: |
          services='${{ matrix.services }}'
          for svc in $(echo "$services" | jq -r '.[]'); do
            echo "::group::Testing services/$svc"
            cd "$GITHUB_WORKSPACE/services/$svc"
            go test ./... -v -race -coverprofile=coverage.out -covermode=atomic -timeout=10m 2>&1 | tee test-output.txt
            go tool cover -func=coverage.out
            cd "$GITHUB_WORKSPACE"
            echo "::endgroup::"
          done

      - name: Upload Go coverage
        if: matrix.language == 'go' && matrix.services != '[]'
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: services/*/coverage.out
          retention-days: 7

      # ── Rust Tests ───────────────────────────────────────────────────────
      - name: Set up Rust
        if: matrix.language == 'rust' && matrix.services != '[]'
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust cargo
        if: matrix.language == 'rust' && matrix.services != '[]'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            services/identity -> target

      - name: Install tarpaulin
        if: matrix.language == 'rust' && matrix.services != '[]'
        run: cargo install cargo-tarpaulin --locked

      - name: Run Rust unit tests
        if: matrix.language == 'rust' && matrix.services != '[]'
        run: |
          services='${{ matrix.services }}'
          for svc in $(echo "$services" | jq -r '.[]'); do
            echo "::group::Testing services/$svc"
            cd "$GITHUB_WORKSPACE/services/$svc"
            cargo test --verbose 2>&1 | tee test-output.txt
            cargo tarpaulin --out Xml --skip-clean 2>&1 || true
            cd "$GITHUB_WORKSPACE"
            echo "::endgroup::"
          done

      - name: Upload Rust coverage
        if: matrix.language == 'rust' && matrix.services != '[]'
        uses: actions/upload-artifact@v4
        with:
          name: rust-coverage
          path: services/*/cobertura.xml
          retention-days: 7

      # ── Node.js Tests ────────────────────────────────────────────────────
      - name: Set up Node.js
        if: matrix.language == 'node' && matrix.services != '[]'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: services/catalog/package-lock.json

      - name: Run Node.js unit tests
        if: matrix.language == 'node' && matrix.services != '[]'
        run: |
          services='${{ matrix.services }}'
          for svc in $(echo "$services" | jq -r '.[]'); do
            echo "::group::Testing services/$svc"
            cd "$GITHUB_WORKSPACE/services/$svc"
            npm ci --ignore-scripts
            npm run build
            npx jest --coverage --ci --forceExit --detectOpenHandles 2>&1 | tee test-output.txt || true
            cd "$GITHUB_WORKSPACE"
            echo "::endgroup::"
          done

      - name: Upload Node coverage
        if: matrix.language == 'node' && matrix.services != '[]'
        uses: actions/upload-artifact@v4
        with:
          name: node-coverage
          path: services/*/coverage/
          retention-days: 7

      # ── Kotlin Tests ─────────────────────────────────────────────────────
      - name: Set up JDK
        if: matrix.language == 'kotlin' && matrix.services != '[]'
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Setup Gradle
        if: matrix.language == 'kotlin' && matrix.services != '[]'
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Run Kotlin unit tests
        if: matrix.language == 'kotlin' && matrix.services != '[]'
        run: |
          services='${{ matrix.services }}'
          for svc in $(echo "$services" | jq -r '.[]'); do
            echo "::group::Testing services/$svc"
            cd "$GITHUB_WORKSPACE/services/$svc"
            ./gradlew test jacocoTestReport --no-daemon 2>&1 | tee test-output.txt || true
            cd "$GITHUB_WORKSPACE"
            echo "::endgroup::"
          done

      - name: Upload Kotlin coverage
        if: matrix.language == 'kotlin' && matrix.services != '[]'
        uses: actions/upload-artifact@v4
        with:
          name: kotlin-coverage
          path: services/*/build/reports/jacoco/
          retention-days: 7

      # ── Python Tests ─────────────────────────────────────────────────────
      - name: Set up Python
        if: matrix.language == 'python' && matrix.services != '[]'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Run Python unit tests
        if: matrix.language == 'python' && matrix.services != '[]'
        run: |
          pip install pytest pytest-cov
          services='${{ matrix.services }}'
          for svc in $(echo "$services" | jq -r '.[]'); do
            echo "::group::Testing services/$svc"
            cd "$GITHUB_WORKSPACE/services/$svc"
            pip install -e ".[dev]" 2>/dev/null || pip install -e . 2>/dev/null || true
            pytest tests/unit/ -v --cov=src --cov-report=xml:coverage.xml --cov-report=term-missing --timeout=120 2>&1 | tee test-output.txt || true
            cd "$GITHUB_WORKSPACE"
            echo "::endgroup::"
          done

      - name: Upload Python coverage
        if: matrix.language == 'python' && matrix.services != '[]'
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage
          path: services/*/coverage.xml
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 4: Docker Build (matrix per changed service)
  # ─────────────────────────────────────────────────────────────────────────────
  docker-build:
    name: Docker Build (${{ matrix.service }})
    needs: [lint, unit-test, detect-changes]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.all-changed-services) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.ORG }}/polyglot-${{ matrix.service }}
          tags: |
            type=raw,value=pr-${{ github.event.pull_request.number }}
            type=sha,prefix=pr-${{ github.event.pull_request.number }}-

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./services/${{ matrix.service }}
          file: ./services/${{ matrix.service }}/Dockerfile
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          build-args: |
            VERSION=0.0.0-pr${{ github.event.pull_request.number }}
            COMMIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}

      - name: Save image for security scan
        run: |
          docker image save \
            ${{ env.REGISTRY }}/${{ env.ORG }}/polyglot-${{ matrix.service }}:pr-${{ github.event.pull_request.number }} \
            -o /tmp/image-${{ matrix.service }}.tar

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-${{ matrix.service }}
          path: /tmp/image-${{ matrix.service }}.tar
          retention-days: 1

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 5: Security Scan
  # ─────────────────────────────────────────────────────────────────────────────
  security:
    name: Security Scan (${{ matrix.service }})
    needs: [docker-build, detect-changes]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.all-changed-services) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image-${{ matrix.service }}
          path: /tmp

      - name: Load Docker image
        run: docker load -i /tmp/image-${{ matrix.service }}.tar

      # ── Trivy vulnerability scan on built image ──
      - name: Run Trivy vulnerability scan (image)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.ORG }}/polyglot-${{ matrix.service }}:pr-${{ github.event.pull_request.number }}
          format: sarif
          output: trivy-image-${{ matrix.service }}.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'

      - name: Run Trivy filesystem scan (source)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: ./services/${{ matrix.service }}
          format: sarif
          output: trivy-fs-${{ matrix.service }}.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: .
          category: trivy-${{ matrix.service }}

      # ── Language-specific security scanners ──
      - name: Run Gosec (Go)
        if: contains(fromJson('["payment","gateway","schema-registry"]'), matrix.service)
        uses: securego/gosec@master
        with:
          args: '-no-fail -fmt sarif -out gosec-results.sarif ./services/${{ matrix.service }}/...'

      - name: Run Bandit (Python)
        if: contains(fromJson('["notification","analytics","rl-engine"]'), matrix.service)
        run: |
          pip install bandit
          bandit -r ./services/${{ matrix.service }}/src -f sarif -o bandit-results.sarif || true

      # ── Secret detection ──
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── License check ──
      - name: Run Trivy license scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.ORG }}/polyglot-${{ matrix.service }}:pr-${{ github.event.pull_request.number }}
          scan-type: image
          format: table
          scanners: license
        continue-on-error: true

      - name: Upload security scan artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-results-${{ matrix.service }}
          path: |
            trivy-*.sarif
            gosec-*.sarif
            bandit-*.sarif
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 6: RL Review Gate
  # ─────────────────────────────────────────────────────────────────────────────
  rl-review:
    name: RL Review Gate
    needs: [lint, unit-test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate RL knowledge base
        run: |
          python3 .claude/engine/knowledge_matcher.py --validate
          echo "RL knowledge base validation complete"

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v44
        with:
          since_last_remote_commit: true

      - name: Run RL pattern matcher on changed files
        id: rl-scan
        run: |
          FILES="${{ steps.changed-files.outputs.all_changed_files }}"
          if [ -z "$FILES" ]; then
            echo "No changed files to scan"
            echo "blocking_findings=0" >> "$GITHUB_OUTPUT"
            echo "total_findings=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Run the knowledge matcher
          python3 .claude/engine/knowledge_matcher.py --scan-diff --json $FILES > rl-findings.json 2>&1 || true

          # Parse results
          TOTAL_FINDINGS=$(jq '.total_findings // 0' rl-findings.json)
          CRITICAL=$(jq '.critical_count // 0' rl-findings.json)
          HIGH=$(jq '.high_count // 0' rl-findings.json)

          echo "total_findings=$TOTAL_FINDINGS" >> "$GITHUB_OUTPUT"
          echo "critical_findings=$CRITICAL" >> "$GITHUB_OUTPUT"
          echo "high_findings=$HIGH" >> "$GITHUB_OUTPUT"

          echo "### RL Pattern Matcher Results" >> "$GITHUB_STEP_SUMMARY"
          echo "- Total findings: $TOTAL_FINDINGS" >> "$GITHUB_STEP_SUMMARY"
          echo "- Critical: $CRITICAL" >> "$GITHUB_STEP_SUMMARY"
          echo "- High: $HIGH" >> "$GITHUB_STEP_SUMMARY"

          # Block on CRITICAL findings with high confidence
          if [ "$CRITICAL" -gt 0 ]; then
            echo "::error::RL review gate: $CRITICAL CRITICAL finding(s) detected — merge blocked"
            echo "BLOCKING_MERGE=true" >> "$GITHUB_ENV"
          fi

      - name: Comment RL findings on PR
        if: steps.rl-scan.outputs.total_findings != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let findings;
            try {
              findings = JSON.parse(fs.readFileSync('rl-findings.json', 'utf8'));
            } catch (e) {
              console.log('Could not parse RL findings');
              return;
            }

            let body = '## 🔍 RL Pattern Matcher Findings\n\n';
            body += `| Severity | Pattern | File | Description |\n|----------|---------|------|-------------|\n`;

            for (const f of findings.findings || []) {
              const icon = f.severity === 'CRITICAL' ? '🔴' : f.severity === 'HIGH' ? '🟠' : f.severity === 'MEDIUM' ? '🟡' : '🟢';
              body += `| ${icon} ${f.severity} | ${f.signature} | ${f.file} | ${f.description} |\n`;
            }

            body += `\n**Total:** ${findings.total_findings} | **Critical:** ${findings.critical_count} | **High:** ${findings.high_count}\n`;

            if (findings.critical_count > 0) {
              body += '\n> ⛔ **MERGE BLOCKED**: Critical findings detected. Please resolve before merging.\n';
            }

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

      - name: Block merge on CRITICAL findings
        if: env.BLOCKING_MERGE == 'true'
        run: |
          echo "::error::RL review gate blocked merge due to CRITICAL findings"
          exit 1

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 7: Schema Validation
  # ─────────────────────────────────────────────────────────────────────────────
  schema-validate:
    name: Schema Validation
    needs: detect-changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up buf
        uses: bufbuild/buf-setup-action@v1
        with:
          version: '1.30.0'

      - name: Lint protobuf schemas
        run: buf lint schemas/
        continue-on-error: true

      - name: Check protobuf breaking changes
        run: buf breaking schemas/ --against '.git#branch=main,subdir=schemas'
        continue-on-error: true

      - name: Install spectral
        run: npm install -g @stoplight/spectral-cli@latest

      - name: Lint OpenAPI specs
        run: |
          for spec in schemas/openapi/**/*.yaml; do
            echo "::group::Linting $spec"
            spectral lint "$spec" --ruleset .spectral.yaml 2>&1 || true
            echo "::endgroup::"
          done
        continue-on-error: true

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 8: K8s Manifest Validation
  # ─────────────────────────────────────────────────────────────────────────────
  k8s-validate:
    name: K8s Manifest Validation
    needs: detect-changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install kustomize
        run: |
          curl -sLo /usr/local/bin/kustomize https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.2/kustomize_v5.4.2_linux_amd64.tar.gz
          chmod +x /usr/local/bin/kustomize

      - name: Install kubeconform
        run: |
          curl -sLo /tmp/kubeconform.tar.gz https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar -xzf /tmp/kubeconform.tar.gz -C /usr/local/bin kubeconform

      - name: Validate service kustomize builds
        run: |
          SERVICES=(gateway identity catalog order payment notification analytics rl-engine schema-registry)
          for svc in "${SERVICES[@]}"; do
            echo "::group::Validating services/$svc/kustomize"
            if [ -f "services/$svc/kustomize/kustomization.yaml" ]; then
              kustomize build "services/$svc/kustomize" | kubeconform -summary -output text
            else
              echo "No kustomization.yaml for $svc"
            fi
            echo "::endgroup::"
          done

      - name: Validate environment overlays
        run: |
          for overlay in dev staging production; do
            echo "::group::Validating overlay/$overlay"
            if [ -f "infra/kubernetes/overlays/$overlay/kustomization.yaml" ]; then
              kustomize build "infra/kubernetes/overlays/$overlay" 2>/dev/null | kubeconform -summary -output text || true
            fi
            echo "::endgroup::"
          done

      - name: Run kustomize-validate script
        run: |
          chmod +x scripts/kustomize-validate.sh
          scripts/kustomize-validate.sh --skip-kubeconform || true
        continue-on-error: true

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 9: Integration Gate (only on approval)
  # ─────────────────────────────────────────────────────────────────────────────
  integration-gate:
    name: Integration Gate
    needs: [docker-build, security, rl-review, detect-changes]
    if: github.event.pull_request.review.state == 'approved'
    uses: ./.github/workflows/integration-gate.yml
    with:
      image-tag: pr-${{ github.event.pull_request.number }}
    secrets: inherit
