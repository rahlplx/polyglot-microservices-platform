#
# Service-Language Mappings:
#   identity        = Rust
#   order           = Kotlin
#   payment         = Go
#   schema-registry = Go
#   gateway         = Go
#   catalog         = TypeScript
#   notification    = Python
#   analytics       = Python
#   rl-engine       = Python
# ---------------------------------------------------------------------------
name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  security-events: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

# ---------------------------------------------------------------------------
# Service matrix — correct language mapping for all 9 services
# ---------------------------------------------------------------------------
jobs:
  # =========================================================================
  # STAGE 1: LINT — per-language matrix
  # =========================================================================
  lint:
    name: "Lint / ${{ matrix.language }} / ${{ matrix.service }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Rust
          - service: identity
            language: rust
          # Kotlin
          - service: order
            language: kotlin
          # Go
          - service: payment
            language: go
          - service: schema-registry
            language: go
          - service: gateway
            language: go
          # TypeScript
          - service: catalog
            language: typescript
          # Python
          - service: notification
            language: python
          - service: analytics
            language: python
          - service: rl-engine
            language: python
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # --- Rust linting ---
      - name: Setup Rust toolchain
        if: matrix.language == 'rust'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo artifacts
        if: matrix.language == 'rust'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/${{ matrix.service }} -> target

      - name: Rust fmt check
        if: matrix.language == 'rust'
        run: cargo fmt --all -- --check

      - name: Rust clippy
        if: matrix.language == 'rust'
        run: cargo clippy --all-targets --all-features -- -D warnings

      # --- Kotlin linting ---
      - name: Setup JDK 21
        if: matrix.language == 'kotlin'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Gradle
        if: matrix.language == 'kotlin'
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            services/${{ matrix.service }}/.gradle
          key: gradle-${{ matrix.service }}-${{ hashFiles('services/order/**/*.gradle*') }}
          restore-keys: gradle-${{ matrix.service }}-

      - name: Grant gradlew execute permission
        if: matrix.language == 'kotlin'
        run: chmod +x gradlew

      - name: ktlint + detekt
        if: matrix.language == 'kotlin'
        run: ./gradlew ktlintCheck detekt

      # --- Go linting ---
      - name: Setup Go 1.22
        if: matrix.language == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: services/${{ matrix.service }}/go.sum

      - name: Go vet
        if: matrix.language == 'go'
        run: go vet ./...

      - name: golangci-lint
        if: matrix.language == 'go'
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.59
          working-directory: services/${{ matrix.service }}
          args: --timeout=5m

      # --- TypeScript linting ---
      - name: Setup Node 20
        if: matrix.language == 'typescript'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: services/${{ matrix.service }}/package-lock.json

      - name: Install dependencies
        if: matrix.language == 'typescript'
        run: npm ci

      - name: ESLint + type check
        if: matrix.language == 'typescript'
        run: |
          npm run lint
          npx tsc --noEmit

      # --- Python linting ---
      - name: Setup Python 3.12
        if: matrix.language == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/pyproject.toml

      - name: Install Python dev dependencies
        if: matrix.language == 'python'
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy

      - name: Ruff lint
        if: matrix.language == 'python'
        run: ruff check .

      - name: mypy type check
        if: matrix.language == 'python'
        run: mypy src/ --strict

  # =========================================================================
  # STAGE 2: TEST — per-service matrix
  # =========================================================================
  test:
    name: "Test / ${{ matrix.language }} / ${{ matrix.service }}"
    runs-on: ubuntu-latest
    needs: [lint]
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: identity
            language: rust
          - service: order
            language: kotlin
          - service: payment
            language: go
          - service: schema-registry
            language: go
          - service: gateway
            language: go
          - service: catalog
            language: typescript
          - service: notification
            language: python
          - service: analytics
            language: python
          - service: rl-engine
            language: python
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: test_${{ matrix.service }}
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # --- Rust test ---
      - name: Setup Rust toolchain
        if: matrix.language == 'rust'
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        if: matrix.language == 'rust'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/${{ matrix.service }} -> target

      - name: Run Rust tests
        if: matrix.language == 'rust'
        run: cargo test --all-features

      # --- Kotlin test ---
      - name: Setup JDK 21
        if: matrix.language == 'kotlin'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Gradle
        if: matrix.language == 'kotlin'
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ matrix.service }}-${{ hashFiles('services/order/**/*.gradle*') }}

      - name: Grant gradlew execute permission
        if: matrix.language == 'kotlin'
        run: chmod +x gradlew

      - name: Run Kotlin tests
        if: matrix.language == 'kotlin'
        run: ./gradlew test

      # --- Go test ---
      - name: Setup Go 1.22
        if: matrix.language == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: services/${{ matrix.service }}/go.sum

      - name: Run Go tests with race detector and coverage
        if: matrix.language == 'go'
        run: |
          go test -race -coverprofile=coverage.out -covermode=atomic ./...
          go tool cover -func=coverage.out

      - name: Upload Go coverage
        if: matrix.language == 'go' && success()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-go-${{ matrix.service }}
          path: services/${{ matrix.service }}/coverage.out
          retention-days: 7

      # --- TypeScript test ---
      - name: Setup Node 20
        if: matrix.language == 'typescript'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: services/${{ matrix.service }}/package-lock.json

      - name: Install dependencies
        if: matrix.language == 'typescript'
        run: npm ci

      - name: Run TypeScript tests
        if: matrix.language == 'typescript'
        run: npm test -- --coverage

      # --- Python test ---
      - name: Setup Python 3.12
        if: matrix.language == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/pyproject.toml

      - name: Install Python dependencies
        if: matrix.language == 'python'
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pytest with coverage
        if: matrix.language == 'python'
        run: pytest tests/ -v --cov=src --cov-report=term-missing --junitxml=test-results.xml

      - name: Upload Python test results
        if: matrix.language == 'python' && always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-python-${{ matrix.service }}
          path: services/${{ matrix.service }}/test-results.xml
          retention-days: 7

  # =========================================================================
  # STAGE 3: BUILD — Docker image build (no push on PRs)
  # =========================================================================
  docker-build:
    name: "Docker Build / ${{ matrix.service }}"
    runs-on: ubuntu-latest
    needs: [test]
    strategy:
      fail-fast: false
      matrix:
        service:
          - identity
          - order
          - payment
          - schema-registry
          - gateway
          - catalog
          - notification
          - analytics
          - rl-engine
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image (no push on PR)
        uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          file: services/${{ matrix.service }}/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            GIT_REF=${{ github.ref }}

  # =========================================================================
  # STAGE 4: SECURITY SCAN — Trivy + SAST
  # =========================================================================
  security-scan:
    name: "Security Scan"
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner (filesystem)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          severity: "CRITICAL,HIGH"
          format: "table"
          exit-code: "1"
          scanners: "vuln,config"
          skip-dirs: "node_modules,.git,skills"

      - name: Generate Trivy SARIF report
        if: always()
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          severity: "CRITICAL,HIGH"
          format: "sarif"
          output: "trivy-results.sarif"
          scanners: "vuln,config"
          skip-dirs: "node_modules,.git,skills"

      - name: Upload Trivy scan results to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: "trivy-results.sarif"

      - name: ACL enforcement — no proprietary SDKs in domain layers
        run: |
          PROPRIETARY_PATTERNS=(
            "amazonaws"
            "google.golang.org/api"
            "azure-sdk"
            "stripe"
            "twilio"
            "sendgrid"
          )
          FOUND=0
          for service in identity order payment schema-registry gateway catalog notification analytics rl-engine; do
            for dir in "services/${service}/domain" "services/${service}/src/domain"; do
              if [ -d "$dir" ]; then
                for pattern in "${PROPRIETARY_PATTERNS[@]}"; do
                  if rg -l "$pattern" "$dir" 2>/dev/null; then
                    echo "::error::Found proprietary import '$pattern' in $dir. ACL violation."
                    FOUND=1
                  fi
                done
              fi
            done
          done
          if [ "$FOUND" -ne 0 ]; then
            echo "::error::ACL enforcement check FAILED."
            exit 1
          fi
          echo "ACL enforcement check PASSED."

