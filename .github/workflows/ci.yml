name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  # ──────────────────────────────────────────────
  # Go services: gateway, payment, schema-registry
  # ──────────────────────────────────────────────
  lint-and-test-go:
    name: "Go / ${{ matrix.service }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [gateway, payment, schema-registry]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: services/${{ matrix.service }}/go.sum

      - name: Download modules
        run: go mod download

      - name: Go vet
        run: go vet ./...

      - name: Run tests with race detector and coverage
        run: |
          go test -race -coverprofile=coverage.out -covermode=atomic ./...
          go tool cover -func=coverage.out

      - name: Upload coverage artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-go-${{ matrix.service }}
          path: services/${{ matrix.service }}/coverage.out
          retention-days: 7

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.59
          working-directory: services/${{ matrix.service }}
          args: --timeout=5m

  # ──────────────────────────────────────────────
  # Rust service: identity
  # ──────────────────────────────────────────────
  lint-and-test-rust:
    name: "Rust / identity"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/identity
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/identity -> target
          key: identity-v1

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --all-features

  # ──────────────────────────────────────────────
  # Kotlin service: order
  # ──────────────────────────────────────────────
  lint-and-test-kotlin:
    name: "Kotlin / order"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/order
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            services/order/.gradle
          key: gradle-order-${{ hashFiles('services/order/**/*.gradle*', 'services/order/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-order-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew test

      - name: Run ktlint check
        run: ./gradlew ktlintCheck

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-kotlin-order
          path: services/order/build/reports/tests/
          retention-days: 7

  # ──────────────────────────────────────────────
  # TypeScript service: catalog
  # ──────────────────────────────────────────────
  lint-and-test-typescript:
    name: "TypeScript / catalog"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/catalog
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: services/catalog/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run tests
        run: npm test

  # ──────────────────────────────────────────────
  # Python services: notification, analytics, rl-engine
  # ──────────────────────────────────────────────
  lint-and-test-python:
    name: "Python / ${{ matrix.service }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [notification, analytics, rl-engine]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Run Ruff linter
        run: ruff check .

      - name: Run type checks with mypy
        run: mypy src/

      - name: Run pytest
        run: |
          pytest --junitxml=test-results.xml --cov=src --cov-report=term-missing

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-python-${{ matrix.service }}
          path: services/${{ matrix.service }}/test-results.xml
          retention-days: 7

  # ──────────────────────────────────────────────
  # Schema validation
  # ──────────────────────────────────────────────
  schema-validation:
    name: "Schema Validation"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: schemas
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Buf
        uses: bufbuild/buf-setup-action@v1
        with:
          version: "1.31.0"

      - name: Lint proto files
        uses: bufbuild/buf-lint-action@v1
        with:
          input: schemas

      - name: Check for breaking changes
        uses: bufbuild/buf-breaking-action@v1
        with:
          input: schemas
          against: "https://github.com/${{ github.repository }}.git#ref=${{ github.base_ref || 'main' }}"
        continue-on-error: ${{ github.event_name == 'pull_request' }}

      - name: Validate OpenAPI specs
        run: |
          if command -v npx &> /dev/null; then
            npx @redocly/cli lint openapi/*.yaml || true
          else
            echo "Skipping OpenAPI lint — npx not available"
          fi

  # ──────────────────────────────────────────────
  # Security scan with Trivy
  # ──────────────────────────────────────────────
  security-scan:
    name: "Security Scan"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner on Dockerfiles
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          severity: "CRITICAL,HIGH"
          format: "table"
          exit-code: "1"
          # Only scan Dockerfiles and config files
          scanners: "vuln,config"
          skip-dirs: "node_modules,.git"

      - name: Generate Trivy SARIF report
        if: always()
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          severity: "CRITICAL,HIGH"
          format: "sarif"
          output: "trivy-results.sarif"
          scanners: "vuln,config"
          skip-dirs: "node_modules,.git"

      - name: Upload Trivy scan results to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: "trivy-results.sarif"

  # ──────────────────────────────────────────────
  # Docker build validation
  # ──────────────────────────────────────────────
  docker-build:
    name: "Docker Build / ${{ matrix.service }}"
    runs-on: ubuntu-latest
    needs:
      - lint-and-test-go
      - lint-and-test-rust
      - lint-and-test-kotlin
      - lint-and-test-typescript
      - lint-and-test-python
    strategy:
      fail-fast: false
      matrix:
        service:
          - gateway
          - payment
          - schema-registry
          - identity
          - order
          - catalog
          - notification
          - analytics
          - rl-engine
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          file: services/${{ matrix.service }}/Dockerfile
          push: false
          load: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Scan built image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ github.sha }}"
          severity: "CRITICAL"
          format: "table"
          exit-code: "0"  # Non-blocking on built image
